[package]
name = "bb-store"
description = "Database adapter: schema, migrations, repositories and the search compiler (ADR-0003)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bb-app = { path = "../bb-app" }
bb-core = { path = "../bb-core" }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
sea-query = { workspace = true }
sea-query-sqlx = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "sqlite", "tls-rustls"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
bb-core = { path = "../bb-core", features = ["fake-ids"] }
bb-testing = { path = "../bb-testing" }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
