[package]
name = "bb-testing"
description = "Database test harness: runs one test body on SQLite and PostgreSQL, each with a fresh database (ADR-0003). Dev dependency only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bb-dev-words = { path = "../bb-dev-words" }
sqlx = { workspace = true, features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
