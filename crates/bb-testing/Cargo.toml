[package]
name = "bb-testing"
description = "Database test harness: runs one test body on SQLite and PostgreSQL, each with a fresh database (ADR-0003). Dev dependency only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sqlx = { workspace = true, features = ["any", "sqlite", "postgres", "runtime-tokio", "tls-rustls"] }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
