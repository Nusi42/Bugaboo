[package]
name = "bb-files"
description = "File adapter: content-addressed storage, type checks, previews and scanning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `PreviewCommand::in_process`: previews made inside the test instead of by a child process, for
# the tests of the server that do not start the program. Only `[dev-dependencies]` switch it on;
# the tests of the child process itself use the real program.
testing = []

[dependencies]
bb-app = { path = "../bb-app" }
bb-core = { path = "../bb-core" }
cap = "0.1.2"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = { version = "0.22.0", default-features = false, features = ["std"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

# The child process of a preview limits its own memory (ADR-0032 section 4): the allocator `cap` on
# every system, and on Linux the address space with the system call `setrlimit`.
[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.11.0"

[dev-dependencies]
bb-core = { path = "../bb-core", features = ["fake-ids"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
