[package]
name = "bb-wasm"
description = "WebAssembly bindings for Markdown, the wording of changes and notifications and the rule of the same name (ADR-0011, ADR-0033). The search language has a module of its own: bb-wasm-search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bb-core = { path = "../bb-core" }
bb-markdown = { path = "../bb-markdown" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
