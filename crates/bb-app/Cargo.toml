[package]
name = "bb-app"
description = "Use cases per feature, depending only on ports (traits) for storage, files, mail and AI (ADR-0001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Lets a test look at what a use case answered (`Authorized::into_value`). Only `[dev-dependencies]`
# switch it on (ARCH-AUTHZ-ONLY).
peek = ["bb-policy/peek"]
# `NoFailureLimit`, a failure limit that lets every try through. Only the tests of this crate and
# the sample generator (a developer tool, not shipped) switch it on.
testing = []

[dependencies]
bb-auth = { path = "../bb-auth" }
bb-core = { path = "../bb-core" }
bb-markdown = { path = "../bb-markdown" }
bb-policy = { path = "../bb-policy" }
bb-searchlang = { path = "../bb-searchlang", features = ["round-trip-guard"] }
getrandom = { workspace = true }
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
base64ct = { workspace = true }
bb-dev-words = { path = "../bb-dev-words" }
# Predictable IDs for the property tests (`SequentialIds`).
bb-core = { path = "../bb-core", features = ["fake-ids"] }
# Makes `Authorized::into_value` for the tests of this crate (ARCH-AUTHZ-ONLY).
bb-policy = { path = "../bb-policy", features = ["peek"] }
proptest = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true }
webauthn-authenticator-rs = { workspace = true }

[lints]
workspace = true
