[package]
name = "bb-searchlang"
description = "The search language: parse, print, check and suggest. No I/O; also built for WebAssembly (ADR-0005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Reading a tree and the readable fields from JSON. Only the WebAssembly module of the browser turns
# it on: the server never reads a tree from outside. The tests of this crate switch it on too.
browser = []

[dependencies]
bb-core = { path = "../bb-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
bb-searchlang = { path = ".", features = ["browser"] }
proptest = { workspace = true }
