[package]
name = "bb-searchlang"
description = "The search language: parse, print, check and suggest. No I/O; also built for WebAssembly (ADR-0005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Reading a tree and the readable fields from JSON. Only the WebAssembly module of the browser turns
# it on: the server never reads a tree from outside. The tests of this crate switch it on too.
browser = []
# The canonical text is given only when the language reads it back as the same tree
# (`canonical_text`). The server and the tests turn it on; the WebAssembly module of the browser
# builds without it, because the check (a tree turned into JSON values and compared) costs 7 KB of
# its 91 KB budget (PERF-BUNDLE) and everything the browser prints is checked by the server again.
round-trip-guard = []

[dependencies]
bb-core = { path = "../bb-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
bb-searchlang = { path = ".", features = ["browser", "round-trip-guard"] }
proptest = { workspace = true }
