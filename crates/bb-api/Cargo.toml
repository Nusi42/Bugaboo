[package]
name = "bb-api"
description = "HTTP: routes, OpenAPI, security headers, rate limits and the embedded browser app (ADR-0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "json", "matched-path", "query", "tokio"] }
base64ct = { workspace = true }
bb-app = { path = "../bb-app" }
bb-auth = { path = "../bb-auth" }
bb-core = { path = "../bb-core", features = ["openapi"] }
getrandom = { workspace = true }
hmac = { workspace = true }
hyper-util = { workspace = true, features = ["http1", "http2", "server-auto", "service", "tokio"] }
mime_guess = { workspace = true }
rcgen = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
tower-http = { workspace = true, features = ["compression-br", "compression-gzip", "set-header"] }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
h2 = { workspace = true }
brotli = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
