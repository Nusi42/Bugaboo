[package]
name = "bb-api"
description = "HTTP: routes, OpenAPI, security headers, rate limits and the embedded browser app (ADR-0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
tokio = { version = "1.53.2", features = ["fs", "net"] }
tower-http = { version = "0.7.1", features = ["set-header"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
