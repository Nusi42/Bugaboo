[package]
name = "bb-load-check"
description = "Developer tool: the invariants after a run of many people at once, written once and applied to the database and the book of the run (architecture §11, TEST-CONCURRENT)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bb-load-check"
path = "src/main.rs"

[dependencies]
bb-app = { path = "../bb-app" }
bb-core = { path = "../bb-core" }
# The plain reads of the tables that the invariants need (a developer tool, never shipped).
bb-store = { path = "../bb-store", features = ["testing"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
