[package]
name = "bb-server"
description = "The bugaboo binary: command line, setup wizard, service install and wiring of all adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bugaboo"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bb-api = { path = "../bb-api" }
bb-app = { path = "../bb-app" }
bb-auth = { path = "../bb-auth" }
bb-core = { path = "../bb-core" }
bb-files = { path = "../bb-files" }
bb-jobs = { path = "../bb-jobs" }
bb-notify = { path = "../bb-notify" }
bb-store = { path = "../bb-store" }
clap = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Runs Bugaboo as a Windows service (OPS-04): installing it and answering the service manager.
[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
# Asks Windows for its system folder, where icacls and whoami are (coding-standards section 2, no fixed paths).
known-folders = { workspace = true }
# The access list of the data folder is saved to a temporary file and read back (SEC-16, M1-F65).
tempfile = { workspace = true }

# Asks the system who runs the program and what an account number is called, instead of reading
# its files (coding-standards section 2, no fixed paths).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
argon2 = { workspace = true }
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
base64ct = { workspace = true }
bb-api = { path = "../bb-api", features = ["testing"] }
bb-api-words = { path = "../bb-api-words" }
bb-app = { path = "../bb-app", features = ["peek", "testing"] }
bb-dev-words = { path = "../bb-dev-words" }
bb-files = { path = "../bb-files", features = ["testing"] }
bb-load-check = { path = "../bb-load-check" }
bb-policy = { path = "../bb-policy" }
# The settings that only exist for tests, so the project level can be tested (CFG-06).
bb-core = { path = "../bb-core", features = ["test-settings"] }
bb-jobs = { path = "../bb-jobs", features = ["testing"] }
bb-store = { path = "../bb-store", features = ["testing"] }
bb-testing = { path = "../bb-testing" }
h2 = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { workspace = true }
tower = { workspace = true, features = ["util"] }
webauthn-authenticator-rs = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
