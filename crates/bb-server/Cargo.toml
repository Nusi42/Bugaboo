[package]
name = "bb-server"
description = "The bugaboo binary: command line, setup wizard, service install and wiring of all adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bugaboo"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bb-api = { path = "../bb-api" }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
