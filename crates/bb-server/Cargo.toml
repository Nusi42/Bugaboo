[package]
name = "bb-server"
description = "The bugaboo binary: command line, setup wizard, service install and wiring of all adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bugaboo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bb-api = { path = "../bb-api" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
