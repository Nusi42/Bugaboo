# Tests may unwrap and panic; production code may not (coding-standards §3).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Product names that are not code; ".." keeps Clippy's built-in list.
doc-valid-idents = [
  "OpenAPI",
  "WebAssembly",
  "PostgreSQL",
  "SQLite",
  "TypeScript",
  "OneDrive",
  "GitHub",
  "..",
]

# ARCH-PURE (architecture section 4, rule 1): this crate is also built for WebAssembly and does no I/O.
# Clippy reads only the nearest clippy.toml, so the lines above are the root file, repeated; ARCH-PURE
# checks that they stay the same.
disallowed-methods = [
  { path = "std::fs::read", reason = "ARCH-PURE: this crate does no I/O and never reads the file system; the caller passes it in" },
  { path = "std::fs::read_to_string", reason = "ARCH-PURE: this crate does no I/O and never reads the file system; the caller passes it in" },
  { path = "std::fs::write", reason = "ARCH-PURE: this crate does no I/O and never reads the file system; the caller passes it in" },
