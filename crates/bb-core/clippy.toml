# Generated by `cargo xtask gen clippy` from clippy.toml and the list of what reaches the world.
# Do not edit by hand. Clippy reads only the nearest clippy.toml, so the settings of clippy.toml are
# repeated, then comes what ARCH-PURE (architecture section 4, rule 1) disallows in this crate.

# Tests may unwrap and panic; production code may not (coding-standards §3).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Product names that are not code; ".." keeps Clippy's built-in list.
doc-valid-idents = [
  "OpenAPI",
  "WebAssembly",
  "PostgreSQL",
  "SQLite",
  "TypeScript",
  "OneDrive",
  "GitHub",
  "..",
]
