[package]
name = "bb-core"
description = "Domain types, IDs, error codes, domain events and field types. Does no I/O (architecture §4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Describes the API types for OpenAPI (utoipa); only the HTTP layer turns it on.
openapi = ["dep:utoipa"]

[dependencies]
bb-macros = { path = "../bb-macros" }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["std"] }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true
