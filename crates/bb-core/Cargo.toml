[package]
name = "bb-core"
description = "Domain types, IDs, error codes, domain events and field types. Does no I/O (architecture §4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The data of the time zones, for what writes a moment in a named zone outside the server (the
# generator of the test vectors). The server turns the same data on in bb-app.
zone-data = ["jiff/tzdb-bundle-always"]
# Describes the API types for OpenAPI (utoipa); only the HTTP layer turns it on.
openapi = ["dep:utoipa"]
# `SequentialIds`, the predictable ID source for tests. Only `[dev-dependencies]` switch it on.
fake-ids = []
# The settings that only exist for tests (`settings::for_tests`), so the project level can be
# tested while no real setting is set on a project. Only `[dev-dependencies]` switch it on.
test-settings = []

[dependencies]
bb-macros = { path = "../bb-macros" }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-properties = { version = "0.1.4", default-features = false, features = [
  "general-category",
] }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["std"] }

[dev-dependencies]
# The zones that the wording tests name (the server turns the same data on in bb-app).
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
proptest = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
