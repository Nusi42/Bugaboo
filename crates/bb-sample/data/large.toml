comments = [
  "I can reproduce this on the latest build, the steps in the description are enough.",
  "The customer called again today and asked when this will be fixed.",
  "This looks like a side effect of the change we made last week, I will check the log.",
  "Could we split this into two smaller issues? The second half is not urgent.",
  "I tested the fix on a second device and the problem is gone.",
  "Please add the version number to the description so support can find it again.",
  "The error only shows up for accounts with more than one language, which explains why we missed it.",
  "We agreed in the planning meeting to move this to the next release.",
  "I wrote a test that fails without the change and passes with it.",
  "The numbers in the report do not match the invoice, the difference is exactly the tax.",
  "Searching for the order number returns nothing, but the order is in the list.",
  "The page is slow when the list has more than a thousand rows.",
  "This works as designed, but the wording on the button is confusing, so I changed it.",
  "Thanks for the quick answer, this unblocks the release.",
  "I could not reproduce it, can you send a screenshot and the time it happened?",
