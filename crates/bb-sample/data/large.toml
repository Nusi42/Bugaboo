# The words of the large dataset (architecture §11, "Large dataset"), written for Bugaboo. English
# titles and descriptions come from issues.toml; the German ones, and the names of the projects
# and teams of the large dataset, are here. Comments are whole sentences so full-text search finds
# real words in both languages. Nothing here names a real company, product or person.

