# The words of the sample issues, written for Bugaboo (no third-party text). The titles,
# descriptions and comments of the sample are put together from these lists with the sample's own
# random numbers, so the same seed makes the same text. A word in curly braces is replaced:
# {thing} by a thing of the project's area, {when} and {noun} by a word of the lists below,
# {mention} by an @-mention of a person, {person} by the plain name of a person.
# Nothing here names a real company, product or person.

