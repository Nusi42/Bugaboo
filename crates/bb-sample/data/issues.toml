[bug]
titles = [
  "{Thing} crashes when {when}",
  "{Thing} shows the wrong {noun}",
  "{Thing} does not save the {noun}",
  "{Thing} is slow when {when}",
  "{Thing} freezes when {when}",
  "{Thing} looks broken on small screens",
  "{Thing} loses the {noun} when {when}",
  "{Thing} shows an error for no reason",
  "{Thing} ignores the {noun}",
  "Wrong {noun} in {thing}",
]
happens = [
  "The {thing} does not do what people expect when {when}.",
  "People told us that the {noun} in the {thing} is wrong when {when}.",
  "We saw the {thing} fail three times this week, always when {when}.",
  "Support got a call about the {thing}: the {noun} is not kept when {when}.",
]
steps = [
  "Open the {thing}.",
  "Sign in with a test account.",
  "Switch to a second language.",
  "Fill in the {noun} and press Save.",
  "Wait for ten seconds.",
  "Go back and open it again.",
  "Turn off the network.",
  "Scroll to the end of the list.",
]
expected = [
  "The {noun} is kept and shown as typed.",
  "Nothing is lost and no error shows.",
  "The page answers within a second.",
  "The same as on the other screens.",
]

[task]
titles = [
  "{Verb} the {thing} for {reason}",
  "{Verb} the {thing}",
  "{Verb} the {noun} in the {thing}",
  "Prepare the {thing} for {reason}",
]
about = [
  "This is needed for {reason}.",
  "Part of the clean-up before the next release.",
  "Small job; nobody should be blocked by it.",
  "Agreed in the last planning meeting.",
]

[feature]
titles = [
  "Let people {action}",
  "{Thing}: {action}",
  "Add {action} to the {thing}",
  "Show the {noun} in the {thing}",
]
about = [
  "Customers asked for this several times.",
  "It would make the {thing} much easier to use.",
  "We could start small and add more later.",
  "A competitor has it; ours should be simpler.",
]

[goal]
titles = [
  "Make the {thing} {quality}",
  "{Thing}: ready for {segment}",
  "Launch the new {thing} for {segment}",
]
about = [
  "The goal is reached when every sub-issue is done.",
  "This goal collects the work of the quarter.",
  "We measure it with the numbers of the monthly report.",
]

