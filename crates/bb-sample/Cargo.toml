[package]
name = "bb-sample"
description = "Developer tool: makes the fictional sample organization through the real use cases, the same every time from a seed (architecture §11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bb-sample"
path = "src/main.rs"

[dependencies]
# The sample organization is made by one process without an attacker: no limit on failed tries.
bb-app = { path = "../bb-app", features = ["testing"] }
bb-auth = { path = "../bb-auth" }
bb-core = { path = "../bb-core" }
bb-dev-words = { path = "../bb-dev-words" }
# The sample makes its files and their previews in its own process (`PreviewCommand::in_process`),
# which the feature `testing` offers; a developer tool, not the product.
bb-files = { path = "../bb-files", features = ["testing"] }
bb-searchlang = { path = "../bb-searchlang" }
bb-store = { path = "../bb-store", features = ["dataset"] }
clap = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
bb-testing = { path = "../bb-testing" }
tempfile = { workspace = true }

[lints]
workspace = true
