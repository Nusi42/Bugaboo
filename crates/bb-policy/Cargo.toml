[package]
name = "bb-policy"
description = "The authorization engine: permission catalogue, field masks, visibility and Authorized<T> (ADR-0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Describes the types of the API for OpenAPI (utoipa); only the HTTP layer turns it on.
openapi = ["dep:utoipa", "bb-core/openapi"]

[dependencies]
bb-core = { path = "../bb-core" }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
jiff = { workspace = true }
proptest = { workspace = true }
trybuild = { workspace = true }
bb-core = { path = "../bb-core", features = ["fake-ids"] }

[lints]
workspace = true
