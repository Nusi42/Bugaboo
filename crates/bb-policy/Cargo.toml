[package]
name = "bb-policy"
description = "The authorization engine: permission catalogue, field masks, visibility and Authorized<T> (ADR-0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Describes the types of the API for OpenAPI (utoipa); only the HTTP layer turns it on.
openapi = ["dep:utoipa", "bb-core/openapi"]
# `Authorized::into_value`, so a test can look at what a use case answered. Only `[dev-dependencies]`
# switch it on (ARCH-AUTHZ-ONLY).
peek = []

[dependencies]
bb-core = { path = "../bb-core" }
bb-macros = { path = "../bb-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
jiff = { workspace = true }
proptest = { workspace = true }
trybuild = { workspace = true }
bb-core = { path = "../bb-core", features = ["fake-ids"] }

[lints]
workspace = true
