# Git hooks (ADR-0014). They only call the check runner. `cargo xtask setup` installs them
# with the pinned lefthook from tools/dev/tools.toml.
pre-commit:
  commands:
    checks:
      run: cargo xtask check staged

pre-push:
  commands:
    checks:
      run: cargo xtask check push {1} {2}

commit-msg:
  commands:
    conventional-commits:
      run: cargo xtask check commit-msg {1}
