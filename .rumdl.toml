# Markdown style (FMT-MD). Defaults of rumdl, except as noted; every change has its reason.

[MD013]
# The docs are written one paragraph per line (diff-friendly, no re-wrapping on edits), so prose is
# not wrapped (this also exempts list items and blockquotes, which rumdl treats as paragraphs).
# Headings still have to fit the line length; tables are exempt (default).
paragraphs = false
line-length = 100
# Diagrams (Mermaid) and directory trees cannot be wrapped.
code-blocks = false

[per-file-ignores]
# Agent memory files (ADR-0024 amendment) follow Claude Code's own format: YAML front matter and a
# one-line-per-memory index, never a title heading.
".claude/memory/*.md" = ["MD041"]
# The sanitizer corpus (SEC-13) is hostile text on purpose: raw HTML, bad links, tabs, a missing
# title, images without a description. Each file must stay as written; the renderer test reads it.
"crates/bb-markdown/tests/corpus/*.md" = [
  "MD010",
  "MD033",
  "MD034",
  "MD040",
  "MD041",
  "MD045",
  "MD057",
  "MD059",
  "MD062",
  "MD076",
]
