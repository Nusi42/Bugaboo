# Copies of code that stand for now (LINT-DRY, coding-standards section 1). Each entry names the two
# files that hold the same block, the fingerprint of that block (a number; the finding of LINT-DRY prints it)
# and a reason that names the follow-up that removes the copy. An entry covers that block and no
# other one the two files may come to share. An entry that no copy needs any more fails, so the file
# shrinks as the copies go.
