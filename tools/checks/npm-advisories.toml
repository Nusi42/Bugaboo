# Accepted npm advisories (SEC-ADVISORIES, COMP-03): the packages that `npm audit` names, which
# Bugaboo accepts because no fix exists and it is not affected. One line each, the way `ignore` is
# written in deny.toml: an `id` (the GitHub advisory ID) and a `reason` that names the register
# (docs/third-party/README.md § Accepted risks). META-SUPPRESS counts every line.
accepted = [
  { id = "GHSA-fc5q-39xc-vjpf", reason = "picomatch ReDoS in the build and test tools only (vite, vitest, stylelint); they match the repository's own file patterns, never input from people; no fixed picomatch exists. See docs/third-party/README.md § Accepted risks" },
]
