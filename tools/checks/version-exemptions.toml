# Changes that take no version in their body (ARCH-VERSIONED, ADR-0019 amendment M3). Every other
# change takes the version it read as `version`, and a save of long text also takes `lock_token`.
# Each entry names routes (`METHOD /path`, as the API description writes them) and says why a
# version makes no sense for them. An entry for a route that is gone, or one that takes a version
# now, fails, so the file shrinks as routes are fixed and cannot go stale. A route that saves long
# text is never listed here.

[[exempt]]
routes = [
  "POST /api/v1/saved-searches",
  "DELETE /api/v1/saved-searches/{search}",
  "POST /api/v1/saved-searches/{search}/restore",
  "POST /api/v1/saved-searches/{search}/copy",
  "POST /api/v1/saved-searches/{search}/shares",
  "DELETE /api/v1/saved-searches/{search}/shares/{kind}/{id}",
  "PUT /api/v1/projects/{project}/list",
]
reason = "A saved search is made, or put into the trash and taken out, by its maker alone, and a share or a choice is set to a value and can be set again: a version would only protect a change of the text, which has one (M5 WP-06)."

[[exempt]]
routes = [
  "POST /api/v1/auth/sign-in",
  "POST /api/v1/auth/sign-up",
  "POST /api/v1/auth/setup",
  "POST /api/v1/auth/sign-out",
  "DELETE /api/v1/auth/sessions",
  "DELETE /api/v1/auth/sessions/{session}",
  "POST /api/v1/auth/password",
  "POST /api/v1/auth/second-step",
  "POST /api/v1/auth/second-step/passkey",
  "POST /api/v1/auth/second-step/passkey/options",
  "POST /api/v1/auth/passkey/sign-in",
  "POST /api/v1/auth/passkey/sign-in/options",
  "POST /api/v1/auth/passkeys",
  "POST /api/v1/auth/passkeys/options",
  "POST /api/v1/auth/passkeys/{passkey}/remove",
  "POST /api/v1/auth/two-step/code-app",
  "POST /api/v1/auth/two-step/code-app/confirm",
  "POST /api/v1/auth/two-step/code-app/remove",
  "POST /api/v1/auth/two-step/backup-codes",
  "POST /api/v1/auth/invitations/accept",
  "POST /api/v1/auth/invitations/lookup",
]
reason = "Signing in and a person's own sign-in data have no stored version: each step answers for itself (a password or a code that is right or wrong, a session that ends), and nobody else can have changed it meanwhile."

[[exempt]]
routes = ["DELETE /api/v1/me/settings/{key}"]
reason = "*Reset to default* takes a person's own choice away: there is no value left to protect, and the next change reads the setting again (the change of a value takes a version, M5-F97)."

[[exempt]]
routes = [
  "POST /api/v1/access-keys",
  "POST /api/v1/assignments",
  "POST /api/v1/fields",
  "POST /api/v1/auth/invitations",
  "POST /api/v1/groups",
  "POST /api/v1/issue-types",
  "POST /api/v1/label-groups",
  "POST /api/v1/labels",
  "POST /api/v1/relation-kinds",
  "POST /api/v1/issues/{issue}/relations",
  "POST /api/v1/issues/{issue}/comments",
  "POST /api/v1/projects",
  "POST /api/v1/projects/{project}/assignments",
  "POST /api/v1/projects/{project}/issues",
  "POST /api/v1/projects/{project}/sub-projects",
  "POST /api/v1/roles",
  "POST /api/v1/roles/{role}/copy",
]
reason = "Making a new record has no earlier version that could be stale; a name that is taken is refused on its own (name.taken)."

[[exempt]]
routes = [
  "DELETE /api/v1/access-keys/{access_key}",
  "DELETE /api/v1/assignments/{assignment}",
  "DELETE /api/v1/auth/invitations/{invitation}",
  "DELETE /api/v1/groups/{group}",
  "DELETE /api/v1/issues/{issue}",
  "POST /api/v1/issues/{issue}/restore",
  "DELETE /api/v1/relations/{relation}",
  "DELETE /api/v1/comments/{comment}",
  "POST /api/v1/comments/{comment}/restore",
  "PUT /api/v1/issues/{issue}/follow",
  "DELETE /api/v1/issues/{issue}/follow",
  "DELETE /api/v1/roles/{role}",
  "PUT /api/v1/groups/{group}/members/{person}",
  "DELETE /api/v1/groups/{group}/members/{person}",
]
reason = "Taking one row away (or putting one in) is the same however often it is asked and holds no text to lose: a second removal answers resource.not-found, and a row that is there already is there. An issue or a comment goes to the trash and comes back whole with its text, so the trash and its undo hold nothing to overwrite. A relation is one fact between two issues, and following an issue is a mark of one person: neither has text to lose."

[[exempt]]
routes = ["POST /api/v1/projects/{project}/move"]
reason = "A move carries the version of its preview, which names the project, both parents and who has which role (ADR-0025 decision 13); it is refused as project.preview-changed, or edit.version-changed when the project changed first."

[[exempt]]
routes = [
  "POST /api/v1/projects/{project}/move-preview",
  "POST /api/v1/own-access/check-change",
  "POST /api/v1/versions/check",
]
reason = "These only read: they are sent as POST because they carry a body, and they change nothing."

[[exempt]]
routes = [
  "POST /api/v1/edit-locks",
  "POST /api/v1/edit-locks/renew",
  "POST /api/v1/edit-locks/let-go",
  "POST /api/v1/edit-locks/ask-to-finish",
  "POST /api/v1/edit-locks/edit-anyway",
  "POST /api/v1/edit-locks/let-go-stuck",
  "PUT /api/v1/drafts",
  "POST /api/v1/drafts/throw-away",
]
reason = "The lease on a thing being edited and the private draft of a person are the state of an open editor, not a change of the record: they name the record but never overwrite it. The save of the text itself takes the version and the lock token (ADR-0019)."

[[exempt]]
routes = [
  "PUT /api/v1/settings/{key}",
  "DELETE /api/v1/settings/{key}",
  "PUT /api/v1/settings/{key}/lock",
  "DELETE /api/v1/settings/{key}/lock",
  "PUT /api/v1/projects/{project}/settings/{key}",
  "DELETE /api/v1/projects/{project}/settings/{key}",
  "PUT /api/v1/field-permissions/{role}/{field}",
  "PUT /api/v1/people-visibility/{role}/{people_kind}",
]
reason = "Accepted for now (M3-F31): each route sets one single value, one setting or one level cell, from a screen that applies the change at once and does not carry the version of each row yet. Nothing else is overwritten with it, the last writer wins, and the event and the security log say who set it."

[[exempt]]
routes = [
  "POST /api/v1/issues/{issue}/tags",
  "DELETE /api/v1/issues/{issue}/tags/{tag}",
  "POST /api/v1/issues/{issue}/labels",
  "DELETE /api/v1/issues/{issue}/labels/{label}",
]
reason = "A tag or a label is put on an issue and taken off one at a time, like a relation: the change is a member of a set that the person names, not a new value of a field, so two people who add different ones never overwrite each other and the same one twice changes nothing. A change that is made counts the version of the issue up on the version stored now, so a preview that read the version sees that the issue changed (M3 WP-08)."

[[exempt]]
routes = [
  "POST /api/v1/tags/{tag}/preview",
  "POST /api/v1/labels/{label}/preview",
  "POST /api/v1/many-changes/preview",
  "POST /api/v1/workflows/{workflow}/publish-preview",
]
reason = "Changes nothing: it only says what a rename, a combine or a change to many issues would do, and the change that follows takes the versions the preview read (M3 WP-08). The preview of a publish says which statuses would be dropped and which issues are in them; the publish that follows takes the version of the workflow (ADR-0031 amendment 12)."

[[exempt]]
routes = ["POST /api/v1/many-changes"]
reason = "Every issue of the change has its own version in the body (`issues[].version`), which a list of many changes needs and a single `version` cannot say (ADR-0019, M3 WP-08)."

[[exempt]]
routes = ["POST /api/v1/many-changes/runs/{run}/stop"]
reason = "Stops a run that goes on in the background and changes no record of its own: the run has no version, and stopping a run that is over changes nothing (M3 WP-12)."

[[exempt]]
routes = ["POST /api/v1/layouts"]
reason = "Makes the layout of a place as a copy of the one in force (a new record); a place that has one is shown as it is, and two people who make it at the same moment get one (the second is told version_changed)."

[[exempt]]
routes = ["DELETE /api/v1/layouts/{layout}"]
reason = "A delete has no body: it takes the version the person looked at in the query (`?version=`), and a layout that changed since is refused with edit.version-changed."

[[exempt]]
routes = [
  "POST /api/v1/issues/{issue}/uploads",
  "PUT /api/v1/uploads/{upload}",
  "DELETE /api/v1/uploads/{upload}",
  "POST /api/v1/uploads/{upload}/finish",
]
reason = "An upload is a new record that only its own person writes: starting one has nothing earlier to be stale, a part names the offset it starts at and is refused as file.wrong-part when the server's copy ends elsewhere (that offset is its version, ADR-0032), and finishing or discarding it is the same however often it is asked. (M4 WP-05)"

[[exempt]]
routes = [
  "DELETE /api/v1/attachments/{attachment}",
  "POST /api/v1/attachments/{attachment}/restore",
]
reason = "A file goes to the trash and comes back whole, like a comment: the trash and its undo hold no text to overwrite, and a second deletion answers resource.not-found. (M4 WP-05)"

[[exempt]]
routes = ["POST /api/v1/workflows"]
reason = "Makes the workflow of a place as a copy of the one in force (a new record); two people who make it at the same moment get one (the second is told version_changed)."

[[exempt]]
routes = ["PUT /api/v1/workflows/uses"]
reason = "The last choice wins: the use of a place is one row replaced as a whole, with no content of its own to overwrite unseen. The workflows themselves are changed only by Publish, which takes the version."

[[exempt]]
routes = ["DELETE /api/v1/workflows/{workflow}"]
reason = "A delete has no body: it takes the version the person looked at in the query (`?version=`), and a workflow that changed since is refused with edit.version-changed."

[[exempt]]
routes = ["PUT /api/v1/mail/password"]
reason = "Sets or removes the one mail password of the organization, which no answer ever shows, so no person has read a version of it; the change is a security log entry."

[[exempt]]
routes = ["POST /api/v1/mail/test"]
reason = "Sends one e-mail to the person who asks and changes nothing."

[[exempt]]
routes = ["PUT /api/v1/me/handle"]
reason = "The person changes their own handle; a handle that is taken is refused with a sentence, and two changes by the same person at once are the person's own."

[[exempt]]
routes = ["POST /api/v1/notifications/read"]
reason = "Marks notifications of the person as read; marking one again changes nothing, and nobody else edits them."
