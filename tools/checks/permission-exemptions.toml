# Permissions of the catalogue that no route asks for yet: the engine decides them inside use
# cases that have no route of their own so far (ARCH-PERMS, architecture section 7). Each entry
# names the permission and a reason that names the follow-up that tracks it. An entry for a
# permission that a route asks for fails, so the file shrinks as the routes arrive.

[[engine-only]]
permission = "change-own-issues"
reason = "Judged by Evaluation::may_change_issue inside the route that declares change-issues (PATCH /api/v1/issues/{issue}): a person with only this permission changes the issues they reported. It has no route of its own and stays here for good (M3-F01)."

[[engine-only]]
permission = "manage-fields"
reason = "Field routes come in M3 WP-05 (docs/milestones/M3/WP-05-own-fields.md); tracked by M3-F01."

[[engine-only]]
permission = "comment"
reason = "Comment routes come in M3 WP-07 (docs/milestones/M3/WP-07-relations-comments-history-follow.md); tracked by M3-F01."

[[engine-only]]
permission = "move-issues"
reason = "Moving issues comes in M3 WP-08 (docs/milestones/M3/WP-08-tags-labels-and-many-at-once.md); tracked by M3-F01."

[[engine-only]]
permission = "manage-labels"
reason = "Label and tag routes come in M3 WP-08 (docs/milestones/M3/WP-08-tags-labels-and-many-at-once.md); tracked by M3-F01."
