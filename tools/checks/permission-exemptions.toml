# Permissions of the catalogue that no route asks for yet: the engine decides them inside use
# cases that have no route of their own so far (ARCH-PERMS, architecture section 7). Each entry
# names the permission and a reason that names the follow-up that tracks it. An entry for a
# permission that a route asks for fails, so the file shrinks as the routes arrive.

[[engine-only]]
permission = "decide-roles"
reason = "Judged by the use cases of Who has which role and by the engine itself (kept above a No access, the preview of a move); its routes come with the Organization settings screens of WP-11 (M2-F60)."

[[engine-only]]
permission = "manage-people"
reason = "Decides who sees e-mail addresses and may correct names; the routes of People come with WP-11 (M2-F60)."

[[engine-only]]
permission = "manage-groups"
reason = "Judged by the use cases of groups; the routes of Groups come with WP-11 (M2-F60)."
