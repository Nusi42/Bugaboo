# Settings of PERF-BENCH (PERF-01, architecture section 11): the budgets of the benchmarks live
# here and nowhere else. `cargo xtask gen bench-budgets` writes them into the TypeScript of the
# benchmarks and of the speed tests (web/tooling/bench/budgets.generated.ts).
#
# A budget is the most a request may take at the 95th percentile, in milliseconds. Every scenario
# in web/tooling/bench/scenarios.ts names one of them. The budgets count on the computer of the
# nightly run until a reference server exists.

# An issue page (the reads the browser makes at once), a list of issues, a saved search, the
# notifications and the project list.
[budgets.page]
p95_ms = 100

# A complex search, for example `statusGroup is not Done and priority is High` across 500 projects
# (architecture section 8).
[budgets.search]
p95_ms = 300

# The timeline of the biggest project, a page of rows with their bars, dependencies and warnings,
# with and without *Plan by effort* (PLAN-01, PERF-01, M8). Measured by hand on a quiet computer at
# the exit of the milestone.
[budgets.timeline]
p95_ms = 300

# The preview of a change to the most issues one change names, 5,000 (M3-F133): it judges every issue
# of the selection, so it takes seconds and has a budget of its own. Set from the measurement on the
# large dataset with a margin (the numbers are in architecture section 11); it is held down by the
# count of the statements for each issue (`perf_many_changes.rs`).
[budgets.preview]
p95_ms = 8000

# A name a scenario takes instead of a budget while its length is only written down: a new kind of
# work whose budget waits for the numbers of a few milestones. A run tells the length and never fails
# on it. Each entry has its reason; a name is never a budget and a written-down length at once.
[written_down.backup]
reason = "a backup of the 1 M dataset copies the whole database and every file while people work (OPS-07); its length is written down in architecture section 11 at each exit until a budget is decided"

# A scenario that is over its budget on one database and is accepted for now (maintainer decision).
# The nightly run tells it as a known gap and fails it only over its limit; the budget above stays as it is.
# The limit must be above the budget of the scenario.
# This is the one place for such an acceptance: each entry names the database, the follow-up that
# closes it, the most it may take (over that the run fails) and the reason. An entry is removed when its follow-up is done.
[known_gaps.search-groups-assigned-to]
database = "sqlite"
p95_ms_at_most = 700
follow_up = "M5-F89"
reason = "SQLite reads the whole table of the issues for the IDs of the about 116,000 that match; reading the IDs from an index, only the rows found, and parallel slices were measured and each failed another scenario or did not help; kept counts come later (numbers: architecture section 11)"

[known_gaps.project-time-totals.sqlite]
p95_ms_at_most = 1500
follow_up = "M6-F186"
reason = "the totals of the biggest project sum the minutes spent with one probe of the entries by issue for each of its about 260,000 issues, and work out the time left of the about 73,000 of them with an estimate; one statement reads each issue once (numbers and cause: architecture section 11, M6-F186)"

[known_gaps.project-time-totals.postgres]
p95_ms_at_most = 700
follow_up = "M6-F186"
reason = "the same cause as on SQLite: one probe of the entries by issue for each issue of the biggest project, and the time left of those with an estimate; accepted at 650 ms on 2026-11-16, since the one statement leaves no room under 600, and at 700 ms on 2026-11-24, since runs on 1 M issues took 630 to 679 ms (numbers and cause: architecture section 11, M6-F186)"
