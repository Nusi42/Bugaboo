# Settings of PERF-BENCH (PERF-01, architecture section 11): the budgets of the benchmarks live
# here and nowhere else. `cargo xtask gen bench-budgets` writes them into the TypeScript of the
# benchmarks and of the speed tests (web/tooling/bench/budgets.generated.ts).
#
# A budget is the most a request may take at the 95th percentile, in milliseconds. Every scenario
# in web/tooling/bench/scenarios.ts names one of them. The budgets count on the computer of the
# nightly run until a reference server exists.

# An issue page (the reads the browser makes at once), a list of issues, a saved search, the
# notifications and the project list.
[budgets.page]
p95_ms = 100

# A complex search, for example `statusGroup is not Done and priority is High` across 500 projects
# (architecture section 8).
[budgets.search]
p95_ms = 300

# The preview of a change to the most issues one change names, 5,000 (M3-F133): it judges every issue
# of the selection, so it takes seconds and has a budget of its own. Set from the measurement on the
# large dataset with a margin (the numbers are in architecture section 11); it is held down by the
# count of the statements for each issue (`perf_many_changes.rs`).
[budgets.preview]
p95_ms = 8000

# A scenario that is over its budget on one database and is accepted for now (maintainer decision).
# The nightly run tells it as a known gap and fails it only over its limit; the budget above stays as it is.
# The limit must be above the budget of the scenario.
# This is the one place for such an acceptance: each entry names the database, the follow-up that
# closes it, the most it may take (over that the run fails) and the reason. An entry is removed when its follow-up is done.
[known_gaps.search-groups-assigned-to]
database = "sqlite"
p95_ms_at_most = 700
follow_up = "M5-F89"
reason = "each of the about 109,000 issues that match needs a lookup in the index of the people assigned to it; kept counts or parallel slices come later (numbers: architecture section 11)"
