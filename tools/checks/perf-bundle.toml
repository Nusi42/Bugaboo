# Settings of PERF-BUNDLE (PERF-04, ADR-0009): the budget lives here and nowhere else.

# The folder the browser build writes, and the manifest inside it (Vite `build.manifest`).
dist = "web/app/dist"
manifest = ".vite/manifest.json"

# The most JavaScript the first page may load, after Brotli, in bytes (1 KB is 1000 bytes). The
# quality is the server's (tools/dev/compression.json).
budget_bytes = 250000

# The most each WebAssembly module of the build may have, after Brotli at the same quality, by the
# name of its file without the hash (a list should not fetch the module of Markdown, nor an editor
# the search language: each module has its own line, ADR-0005 amendment M5). The browser fetches a
# module only when its feature first opens. A module without a line here fails the check.
[wasm_budget_bytes]
# Markdown, the wording of changes and notifications, the rule of the same name (architecture §8),
# and since M6 the reader of typed lengths of time and the writers of a length on the clock and in a
# sentence, measured at 150.1 KB (the module takes the words of the units from the browser, so it
# carries no catalog); and since M6 the sentence of time booked on an issue, which the history of
# the browser says, measured at 152.7 KB (it takes its three values as they are, not as JSON, so the
# module carries no reader of its own for them); and since the security fix of pulldown-cmark
# (0.13.6), measured at 153.5 KB; and since M6-F68 (the standard library is built again for size and
# a panic stops at once, which takes serde's float formatting and the Debug panic text out of the
# module, `cargo xtask wasm`), measured at 133.1 KB; and since M8 the readability of an own theme
# for the theme editor (THM-03, ADR-0026 update M8: the contrast maths of `bb-core`, the rules of the
# base theme file as Rust data and the colors of the built-in themes), measured at 164.0 KB, of
# which about 9.7 KB is the reading of the values of a theme and about 21 KB the rating with its
# rules and colors (M8-F44: the maintainer chooses this budget or a module of its own for the editor).
bb_wasm_bg = 166000
# The search language, measured at 88.9 KB (M5 WP-02, with the Issue ID rules of bb-core) and at 90.3 KB with `contains` on its own (M5 WP-04), and at 71.5 KB since the standard library is built for size (M6-F68); ADR-0005 allows at most 100 KB.
bb_wasm_search_bg = 73000
