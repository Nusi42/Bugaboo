# Fields that show a person's name or address outside `PersonRef` (ARCH-PERSON-REF, architecture
# section 7). Each is the person's own account or an address that belongs to nobody yet, with the
# reason. The type is the struct in the code and the schema in the API description; an entry that
# matches neither fails.

[[exempt]]
type = "PersonBody"
field = "email"
reason = "The person who signed in sees their own address: the answer of signing in is about their own account."

[[exempt]]
type = "MeBody"
field = "email"
reason = "Who is signed in is the person's own account; a person always sees their own address."

[[exempt]]
type = "InvitationItem"
field = "email"
reason = "The address an invitation is for belongs to nobody yet, because there is no account. Only people who hold Invite people see the list."

[[exempt]]
type = "InvitationBody"
field = "email"
reason = "The address an invitation is for belongs to nobody yet, because there is no account. Only people who hold Invite people see it."

[[exempt]]
type = "EmailBody"
field = "email"
reason = "The page of an invitation link shows the address the invitation is for to whoever holds the secret link, who is that person. There is no account yet. The same body carries the address of a request to invite or to sign up, which only goes in."

[[exempt]]
type = "PersonLine"
field = "email"
reason = "E-mail addresses belong to Manage people (M2-Q3): the list and the page of a person need that permission, so whoever gets this answer may see every address."

[[exempt]]
type = "PersonItem"
field = "email"
reason = "E-mail addresses belong to Manage people (M2-Q3): the list and the page of a person need that permission, so whoever gets this answer may see every address."

[[exempt]]
type = "MailJob"
field = "email"
reason = "The payload of the job that answers a sign-up holds the address the person typed, because no account exists for it: it is only in the queue until the e-mail has gone (and with a dead job for its keep period), never in an answer, and the address is the recipient of the e-mail itself."

# Functions that read the name or the address of a person from a record (the second reading of
# ARCH-PERSON-REF: any read of `.display_name` or `.email`, or a destructuring that names them, in
# bb-api or bb-app). Each entry names the file and the function with the number of reads; one more
# read, or a read in another function, is a finding. The reason says why the read is right.

[[read]]
file = "crates/bb-app/src/search/names.rs"
function = "people_matching"
reads = 3
reason = "A search compares the name typed in it with the name of a candidate by the one rule of the same name, to turn the name into an ID before the statement is made; no name is shown or kept. Who may be named is decided before (names_other_people)."

[[read]]
file = "crates/bb-app/src/search/names.rs"
function = "people_name_choices"
reads = 2
reason = "The names a suggestion offers are only those people_matching found for the person, by the same rule that accepts a search naming them (names_other_people for every person field); the name is what the person is allowed to write into a search."

[[read]]
file = "crates/bb-api/src/api/auth.rs"
function = "from"
reads = 2
reason = "The bodies of the person's own account (PersonBody, MeBody) are made from the record of the person who asks: a person always sees their own name and address."

[[read]]
file = "crates/bb-api/src/api/auth_people.rs"
function = "complete_setup"
reads = 1
reason = "The first account (SetupBody) carries the name and address of the person who makes their own account."

[[read]]
file = "crates/bb-api/src/api/auth_people.rs"
function = "create_invitation"
reads = 1
reason = "The address an invitation is for belongs to nobody yet, and only people who hold Invite people make one."

[[read]]
file = "crates/bb-api/src/api/auth_people.rs"
function = "from"
reads = 2
reason = "The answers of the invitation (InvitationBody) and the sign-up are made from the record of an invitation or of the person's own new account."

[[read]]
file = "crates/bb-api/src/api/auth_people.rs"
function = "look_up_invitation"
reads = 1
reason = "The page of an invitation link shows the address the invitation is for to whoever holds the secret link, who is that person."

[[read]]
file = "crates/bb-api/src/api/auth_people.rs"
function = "sign_up"
reads = 1
reason = "Signing up on one's own takes the address that the person typed for the link that goes there."

[[read]]
file = "crates/bb-api/src/api/auth_sign_in.rs"
