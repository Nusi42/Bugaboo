# Lists that are plain arrays and not paged `items` (ARCH-LEAN, architecture section 10).
# Each is small by nature and has a hard cap instead; its answer says when the cap cut it off
# (`truncated`). The reason names the follow-up that tracks it. An entry that matches no list
# in the API description fails. `whole_value = true` marks an array that is the value of one
# setting, bounded when it is written; it needs no `truncated` flag.

[[exempt]]
route = "GET /api/v1/auth/sessions"
property = "sessions"
reason = "The sessions of one person are few; the list has a hard cap and says when it was cut (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/two-step"
property = "passkeys"
reason = "A person has at most 20 passkeys; the list has a hard cap and says when it was cut (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/sign-up-policy"
property = "domains"
whole_value = true
reason = "The domains are the value of one setting, read and written as a whole; writing more than 100 is refused (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/me"
property = "permissions"
whole_value = true
reason = "The permissions of one person are at most as many as the catalogue has (14 in M2): a list bounded by the code, not one that grows with data, and the browser needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "trail"
reason = "The way down to one project is as long as the tree is deep and at most 16 steps; the list has a hard cap and says when it was cut (M2-F25)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "permissions"
whole_value = true
reason = "The permissions of one person at one project are at most as many as the catalogue has (14 in M2): a list bounded by the code, not one that grows with data (M2-F20)."
