# Lists that are plain arrays and not paged `items` (ARCH-LEAN, architecture section 10).
# Each is small by nature and has a hard cap instead; its answer says when the cap cut it off
# (`truncated`). The reason names the follow-up that tracks it. An entry that matches no list
# in the API description fails. `whole_value = true` marks an array that is the value of one
# setting, bounded when it is written; it needs no `truncated` flag.

[[exempt]]
route = "GET /api/v1/auth/sessions"
property = "sessions"
reason = "The sessions of one person are few; the list has a hard cap and says when it was cut (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/two-step"
property = "passkeys"
reason = "A person has at most 20 passkeys; the list has a hard cap and says when it was cut (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/sign-up-policy"
property = "domains"
whole_value = true
reason = "The domains are the value of one setting, read and written as a whole; writing more than 100 is refused (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/me"
property = "permissions"
whole_value = true
reason = "The permissions of one person are at most as many as the catalogue has (14 in M2): a list bounded by the code, not one that grows with data, and the browser needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/settings"
property = "settings"
whole_value = true
reason = "The settings of one level are at most as many as the registry declares (ADR-0018): a list bounded by the code, not one that grows with data, and a form needs all of a topic at once; the same reason as the permissions of one person (M2-F20)."

[[exempt]]
route = "GET /api/v1/projects/{project}/settings"
property = "settings"
whole_value = true
reason = "The settings of one level are at most as many as the registry declares (ADR-0018): a list bounded by the code, not one that grows with data, and a form needs all of a topic at once; the same reason as the permissions of one person (M2-F20)."

[[exempt]]
route = "GET /api/v1/me/settings"
property = "settings"
whole_value = true
reason = "The settings of one level are at most as many as the registry declares (ADR-0018): a list bounded by the code, not one that grows with data, and a form needs all of a topic at once; the same reason as the permissions of one person (M2-F20)."

[[exempt]]
route = "GET /api/v1/issues/{issue}"
property = "changeable"
whole_value = true
reason = "The fields a person may change in one issue are at most as many as the field catalogue has (16): a list bounded by the code, not one that grows with data, and the issue page needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "trail"
reason = "The way down to one project is as long as the tree is deep and at most 16 steps; the list has a hard cap and says when it was cut (M2-F25)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "permissions"
whole_value = true
reason = "The permissions of one person at one project are at most as many as the catalogue has (14 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/access-keys/rules"
property = "permissions"
whole_value = true
reason = "The single permissions a key can be limited to are those of the catalogue that a key may hold (at most 14 in M2): a list bounded by the code, not one that grows with data, and the form of an access key needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/permissions"
property = "permissions"
whole_value = true
reason = "The permissions of the catalogue are as many as the code declares (14 in M2): a list bounded by the code, not one that grows with data, and the role page needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-permissions"
property = "rows"
whole_value = true
reason = "The fields are at most as many as the field catalogue has (16 in M2): a list bounded by the code, not one that grows with data, and the screen needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-permissions"
property = "levels"
whole_value = true
reason = "The choices of a cell are the words of one vocabulary (field levels, three in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-permissions"
property = "roles"
reason = "The columns are the roles, which an administrator makes and which stay a few dozen: the table holds at most 100 and says when it cut the list off (`truncated`); paging columns of a matrix is not worth it before an organization has more (M2-F90)."

[[exempt]]
route = "GET /api/v1/people-visibility"
property = "rows"
whole_value = true
reason = "The kinds of people information are at most as many as the catalogue of kinds has (10 in M2): a list bounded by the code, not one that grows with data, and the screen needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/people-visibility"
property = "levels"
whole_value = true
reason = "The choices of a cell are the words of one vocabulary (levels of people information, three in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/people-visibility"
property = "roles"
reason = "The columns are the roles, which an administrator makes and which stay a few dozen: the table holds at most 100 and says when it cut the list off (`truncated`); paging columns of a matrix is not worth it before an organization has more (M2-F90)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "permissions"
whole_value = true
reason = "The answer holds one entry for each permission of the catalogue that counts in the place (at most 14 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "fields"
whole_value = true
reason = "The answer holds one entry for each field of the catalogue (16 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "kinds"
whole_value = true
reason = "The answer holds one entry for each kind of people information (10 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-types"
property = "kinds"
whole_value = true
reason = "The kinds of information a field can hold are as many as the code declares (15 in M3): a list bounded by the code, not one that grows with data, and the screen that makes a field needs all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/fields"
property = "fields"
whole_value = true
reason = "A field is refused when the organization already has 200 (FIELDS_MAX), so the list is bounded when it is written, and the screens that show or fill in fields need all of them at once; the items hold the choices and rules of a field, which the value editors need (M3-F48)."

[[exempt]]
route = "GET /api/v1/fields/{field}"
property = "choices"
whole_value = true
reason = "A choice is refused when the field already has 200 (CHOICES_MAX), so the list is bounded when it is written, and the page of the field needs all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/fields/{field}/used-by"
property = "projects"
reason = "The projects named under 'Used in N projects' are cut at 100 (USAGE_PROJECTS_MAX); the answer holds the number of all of them and says when the list was cut (M3-F48)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "changeable_fields"
whole_value = true
reason = "The fields a person may change in one project are at most as many as the field catalogue and the own fields have (at most 200 own fields, FIELDS_MAX): a list bounded when it is written, and the project page needs all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/content/image-hosts"
property = "hosts"
whole_value = true
reason = "The hosts are the value of one setting (content.image-hosts), read as a whole; the setting allows at most 50 and the preview needs all of them at once (M3-F11)."
