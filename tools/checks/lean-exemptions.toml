# Lists that are plain arrays and not paged `items` (ARCH-LEAN, architecture section 10).
# Each is small by nature and has a hard cap instead; its answer says when the cap cut it off
# (`truncated`). The reason names the follow-up that tracks it. An entry that matches no list
# in the API description fails. `whole_value = true` marks an array that is the value of one
# setting, bounded when it is written; it needs no `truncated` flag.

[[exempt]]
route = "GET /api/v1/auth/sessions"
property = "sessions"
reason = "The sessions of one person are few; the list has a hard cap and says when it was cut (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/two-step"
property = "passkeys"
reason = "A person has at most 20 passkeys; the list has a hard cap and says when it was cut (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/sign-up-policy"
property = "domains"
whole_value = true
reason = "The domains are the value of one setting, read and written as a whole; writing more than 100 is refused (M1-F44)."

[[exempt]]
route = "GET /api/v1/auth/me"
property = "permissions"
whole_value = true
reason = "The permissions of one person are at most as many as the catalogue has (14 in M2): a list bounded by the code, not one that grows with data, and the browser needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/settings"
property = "settings"
whole_value = true
reason = "The settings of one level are at most as many as the registry declares (ADR-0018): a list bounded by the code, not one that grows with data, and a form needs all of a topic at once; the same reason as the permissions of one person (M2-F20)."

[[exempt]]
route = "GET /api/v1/projects/{project}/settings"
property = "settings"
whole_value = true
reason = "The settings of one level are at most as many as the registry declares (ADR-0018): a list bounded by the code, not one that grows with data, and a form needs all of a topic at once; the same reason as the permissions of one person (M2-F20)."

[[exempt]]
route = "GET /api/v1/me/settings"
property = "settings"
whole_value = true
reason = "The settings of one level are at most as many as the registry declares (ADR-0018): a list bounded by the code, not one that grows with data, and a form needs all of a topic at once; the same reason as the permissions of one person (M2-F20)."

[[exempt]]
route = "GET /api/v1/issues/{issue}"
property = "changeable"
whole_value = true
reason = "The fields a person may change in one issue are at most as many as the field catalogue has (16): a list bounded by the code, not one that grows with data, and the issue page needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "trail"
reason = "The way down to one project is as long as the tree is deep and at most 16 steps; the list has a hard cap and says when it was cut (M2-F25)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "permissions"
whole_value = true
reason = "The permissions of one person at one project are at most as many as the catalogue has (14 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/access-keys/rules"
property = "permissions"
whole_value = true
reason = "The single permissions a key can be limited to are those of the catalogue that a key may hold (at most 14 in M2): a list bounded by the code, not one that grows with data, and the form of an access key needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/permissions"
property = "permissions"
whole_value = true
reason = "The permissions of the catalogue are as many as the code declares (14 in M2): a list bounded by the code, not one that grows with data, and the role page needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-permissions"
property = "rows"
whole_value = true
reason = "The fields are at most as many as the field catalogue has (16 in M2): a list bounded by the code, not one that grows with data, and the screen needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-permissions"
property = "levels"
whole_value = true
reason = "The choices of a cell are the words of one vocabulary (field levels, three in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-permissions"
property = "roles"
reason = "The columns are the roles, which an administrator makes and which stay a few dozen: the table holds at most 100 and says when it cut the list off (`truncated`); paging columns of a matrix is not worth it before an organization has more (M2-F90)."

[[exempt]]
route = "GET /api/v1/people-visibility"
property = "rows"
whole_value = true
reason = "The kinds of people information are at most as many as the catalogue of kinds has (10 in M2): a list bounded by the code, not one that grows with data, and the screen needs all of them at once (M2-F20)."

[[exempt]]
route = "GET /api/v1/people-visibility"
property = "levels"
whole_value = true
reason = "The choices of a cell are the words of one vocabulary (levels of people information, three in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/people-visibility"
property = "roles"
reason = "The columns are the roles, which an administrator makes and which stay a few dozen: the table holds at most 100 and says when it cut the list off (`truncated`); paging columns of a matrix is not worth it before an organization has more (M2-F90)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "permissions"
whole_value = true
reason = "The answer holds one entry for each permission of the catalogue that counts in the place (at most 14 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "fields"
whole_value = true
reason = "The answer holds one entry for each field of the catalogue (16 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "issue_types"
whole_value = true
reason = "The answer holds the issue types the question may ask about: those the place offers and that are not retired, at most the limit of types of each place on the chain of the place (ISSUE_TYPES_MAX, M4 WP-11): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/check-access/people/{person}"
property = "kinds"
whole_value = true
reason = "The answer holds one entry for each kind of people information (10 in M2): a list bounded by the code, not one that grows with data (M2-F20)."

[[exempt]]
route = "GET /api/v1/field-types"
property = "kinds"
whole_value = true
reason = "The kinds of information a field can hold are as many as the code declares (15 in M3): a list bounded by the code, not one that grows with data, and the screen that makes a field needs all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/fields/{field}"
property = "choices"
whole_value = true
reason = "A choice is refused when the field already has 200 (CHOICES_MAX), so the list is bounded when it is written, and the page of the field needs all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/fields/{field}/used-by"
property = "projects"
reason = "The projects named under 'Used in N projects' are cut at 100 (USAGE_PROJECTS_MAX); the answer holds the number of all of them and says when the list was cut (M3-F48)."

[[exempt]]
route = "GET /api/v1/projects/{project}"
property = "changeable_fields"
whole_value = true
reason = "The fields a person may change in one project are at most as many as the field catalogue and the own fields have (at most 200 own fields, FIELDS_MAX): a list bounded when it is written, and the project page needs all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/content/image-hosts"
property = "hosts"
whole_value = true
reason = "The hosts are the value of one setting (content.image-hosts), read as a whole; the setting allows at most 50 and the preview needs all of them at once (M3-F11)."

[[exempt]]
route = "GET /api/v1/issues/{issue}"
property = "own_fields_html"
whole_value = true
reason = "One entry for each long-text own field of the issue the person may see: at most as many as the 200 own fields (FIELDS_MAX), a list bounded when the fields are made, and the issue page draws all of them at once (M3-F48)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/labels-and-tags"
property = "tags"
whole_value = true
reason = "The tags of one issue: at most 30, refused when more are put on, so the list is bounded when it is written (M3 WP-08, M3-F120)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/labels-and-tags"
property = "labels"
whole_value = true
reason = "The labels of one issue: at most 30, refused when more are put on, so the list is bounded when it is written (M3 WP-08, M3-F120)."

[[exempt]]
route = "GET /api/v1/projects/{project}/tag-suggestions"
property = "tags"
whole_value = true
reason = "The tags to offer while a person types: a hard cap of ten, by the code, and the list is only ever the first of the matches (M3 WP-08, M3-F120)."

[[exempt]]
route = "GET /api/v1/many-changes/runs/{run}"
property = "skipped"
whole_value = true
reason = "The first 50 of the issues a run left alone: capped by the code, and the answer says how many there are in all (`skipped_count`) (M3 WP-08, M3-F120)."

[[exempt]]
route = "GET /api/v1/layouts/editor"
property = "sections"
whole_value = true
reason = "The sections of one layout: at most SECTIONS_MAX (20), a list bounded when the layout is saved; the editor needs all of them at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/layouts/editor"
property = "available"
whole_value = true
reason = "The fields that are on no section: at most PLACED_MAX, the 200 own fields (own_fields::FIELDS_MAX) and the built-in fields of a form; the editor lists them all. (M3-F106)"

[[exempt]]
route = "GET /api/v1/layouts/editor"
property = "roles"
whole_value = true
reason = "The roles of the organization, which the editor ticks; at most ROLES_MAX (100), the cut of the table of field permissions; the editor needs all of them for each field. (M3-F106)"

[[exempt]]
route = "GET /api/v1/layouts/form"
property = "sections"
whole_value = true
reason = "The sections of one layout for one person: at most SECTIONS_MAX (20); the form draws all of them. (M3-F106)"

[[exempt]]
route = "GET /api/v1/issues/{issue}/status-changes"
property = "changes"
whole_value = true
reason = "The status changes from one status of one workflow: a workflow has at most 300 (CHANGES_MAX), checked when it is published, and Try it needs all of them at once (M3-F106)"

[[exempt]]
route = "GET /api/v1/projects/{project}/statuses"
property = "changes"
whole_value = true
reason = "The status changes of the workflows of one project, each once by its words: a workflow has at most 300 (CHANGES_MAX) and a project has as many workflows as it has issue types; the choice of a status change for many issues needs them all at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/projects/{project}/who-may-change/{field}"
property = "roles"
whole_value = true
reason = "The roles of the organization that may change one field: at most as many as roles exist (ROLES_MAX caps them), and a sentence or the editor needs them all at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/workflows/editor"
property = "statuses"
whole_value = true
reason = "The statuses of one workflow: at most STATUSES_MAX (30), checked when it is published; the editor needs all of them at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/workflows/editor"
property = "changes"
whole_value = true
reason = "The status changes of one workflow: at most CHANGES_MAX (300), checked when it is published; the editor needs all of them at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/workflows/editor"
property = "roles"
whole_value = true
reason = "The roles of the organization, which *Who can do it* names; at most ROLES_MAX (100); the editor needs all of them at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/workflows/editor"
property = "groups"
whole_value = true
reason = "The groups *Who can do it* can name: all for a person who manages groups, the named ones otherwise; bounded like the groups of the organization, and the editor needs all of them at once. (M3-F106)"

[[exempt]]
route = "GET /api/v1/workflows/editor"
property = "fields"
whole_value = true
reason = "The fields a rule can name: the description, Assigned to and the own fields of the organization (at most 200, own_fields::FIELDS_MAX); the editor lists them all. (M3-F106)"

# Members of the items of a paged list that hold an object which is a part of the item itself and no
# other resource (`embedded = true`), so the list needs no `include`.

[[exempt]]
route = "GET /api/v1/issues/{issue}/history"
property = "change"
embedded = true
reason = "The change of a row of the history is the row's own value: the field and what it was and is. Every row of a change holds it, so asking for it separately would not make the list leaner (M4-F65, API change A2)."

[[exempt]]
route = "GET /api/v1/notifications"
property = "change"
embedded = true
reason = "The change of a notification is its own value, the same shape as in the history: the field and what it was and is (M4-F65, API change A2)."

[[exempt]]
route = "GET /api/v1/fields"
property = "choices"
embedded = true
reason = "The choices of a field are part of its definition; a field has at most 200 (M4-F171), and `fields=` leaves them out for a list that does not need them."

[[exempt]]
route = "GET /api/v1/fields"
property = "rules"
embedded = true
reason = "The rules of a field are part of its definition, a small value (M4-F179)."

[[exempt]]
route = "GET /api/v1/fields"
property = "scope"
embedded = true
reason = "Where a field is used is part of its definition; the projects in it are references (M4-F179)."

[[exempt]]
route = "GET /api/v1/saved-searches/{search}"
property = "shared_with"
whole_value = true
reason = "A saved search is shared with at most 100 places, bounded when it is shared, and only its maker is told; paging it is M5-F60."

[[exempt]]
route = "GET /api/v1/search/issues/groups"
property = "groups"
reason = "The groups are the values of one field and the answer holds at most 200 of them; it says when it cut the list off (`truncated`); narrowing the search is the way to see the rest (M5-F44)."

[[exempt]]
route = "GET /api/v1/search/fields"
property = "fields"
reason = "The fields a person may search by are the fields of the organization, a few dozen; the answer is a menu of the editor and holds at most 500 and says when it cut the list off (`truncated`) (M5-F44)."

[[exempt]]
route = "GET /api/v1/search/names"
property = "names"
reason = "The names a suggestion offers are a short list of plain names (at most 20, the request names the number): a menu of the editor, which has no fields to leave out."
