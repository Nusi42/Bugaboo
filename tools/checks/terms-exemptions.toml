  "userDocs/privacy/keep-and-delete.md",
  "userDocs/notifications/customize.md",
  "userDocs/notifications/mail-server.md",
]
phrases = [
  "copies the link",
  "the link works once",
  "is a link that",
  "send them the link",
  "the link is shown only once",
  "send them the link yourself",
  "sends a link to it",
  "gives the link to the issue",
  "with the link to open",
  "sends the link that lets",
  "send link",
  "the link in it",
  "no link can be sent",
  "links that confirm a new e-mail address",
  "a link that was opened",
  "replaces a link you asked for",
  "the newest link works",
  "the link of the first e-mail",
]
reason = "The web link of an invitation (the glossary term Link)."

