# Places where a word of the glossary's "Don't say" column is right, because it is used in its
# ordinary sense and not in the sense the glossary forbids (TXT-TERMS, glossary rule 4). The term
# is written as in the glossary; `at` names the places (`messages/en.json#key`,
# `userDocs/file.md`, `api:property Schema.name`, and for a name the code declares
# `crates/bb-app/src/file.rs#fn name` or `web/app/src/file.ts#function name`; `*` matches anything);
# the reason says which sense is meant. An entry that matches nothing fails, so the file cannot go
# stale.

[[allow]]
term = "link"
at = [
  "messages/en.json#invitation.incomplete",
  "messages/en.json#invitations.*",
  "messages/en.json#invitation.ask-again",
  "messages/en.json#sign-up.check-text",
  "messages/en.json#sign-up.check-nothing",
  "messages/en.json#sign-up.resend",
  "messages/en.json#sign-up.resend-in",
  "messages/en.json#sign-up.resent",
  "messages/en.json#mail.open",
  "messages/en.json#mail.open-notifications",
  "messages/en.json#mail.open-project-settings",
  "messages/en.json#mail.sign-up-text",
  "messages/en.json#setting.auth.sign-up-enabled.help",
  "messages/en.json#service.settings-is-link",
  "messages/en.json#service.data-folder-real",
  "api:property CreatedInvitationBody.link_path",
  "api:enum LogBreakBody broken-link",
]
reason = "A web link that a person sends or opens (the glossary term Link), a link in the file system, or a link in the chain of the security log (an entry that does not point to the one before it). Not the connection between two issues, which is a Relation."

# The user docs: only the phrases named here, not the whole page.
[[allow]]
term = "link"
at = [
  "userDocs/sign-in/sign-in.md",
  "userDocs/people/people.md",
  "userDocs/notifications/customize.md",
  "userDocs/notifications/mail-server.md",
]
phrases = [
  "copies the link",
  "the link works once",
  "is a link that",
  "send them the link",
  "the link is shown only once",
  "send them the link yourself",
  "sends a link to it",
  "gives the link to the issue",
  "with the link to open",
  "sends the link that lets",
]
reason = "The web link of an invitation (the glossary term Link)."

[[allow]]
term = "link"
at = ["userDocs/install/linux.md"]
phrases = ["must not be a link", "the data folder is a link"]
reason = "A link in the file system (a symbolic link), which the install refuses or follows."

[[allow]]
term = "link"
at = ["userDocs/cookies.md"]
phrases = ["from a link on another website"]
reason = "A web link on another website, which the browser follows to Bugaboo."

[[allow]]
term = "network"
at = [
  "messages/en.json#sessions.network",
  "messages/en.json#config.tls-off-public",
  "api:property SessionBody.network",
]
reason = "The computer network a request came from or travels over. Not a Relation map."

[[allow]]
term = "screen"
at = [
  "messages/en.json#setting.appearance.mode.help",
  "messages/en.json#second-step.passkey-help",
  "messages/en.json#passkeys.intro",
]
reason = "The display of the device and the screen lock of the device. Not a Layout."

[[allow]]
term = "screen"
at = ["userDocs/sign-in/first-sign-in.md", "userDocs/sign-in/sign-in.md"]
phrases = ["screen lock"]
reason = "The screen lock of the device. Not a Layout."

[[allow]]
term = "challenge"
at = [
  "api:schema ChallengeBody",
  "api:property ChallengeBody.challenge_id",
  "api:property AddPasskeyBody.challenge_id",
  "api:property PasskeyAnswerBody.challenge_id",
]
reason = "The WebAuthn challenge: the random value the server sends so that the answer of a passkey cannot be used a second time. It is a field name of the protocol that only scripts and the app see; a person never reads it (renaming it touches the generated client and the app)."

[[allow]]
term = "token"
at = ["api:enum ErrorCode request.wrong-token"]
reason = "The name of the error code for the CSRF token that the browser app sends back in a header, a name for scripts and the app; the message a person reads says to sign in again."

[[allow]]
term = "token"
at = [
  "api:property TakenLockBody.lock_token",
  "api:property HeartbeatBody.lock_token",
  "api:property ReleaseLockBody.lock_token",
  "api:property SaveTextBody.lock_token",
  "api:property SaveLayoutBody.lock_token",
  "api:property PublishWorkflowBody.lock_token",
]
reason = "The lock token of ADR-0019 proves that a save or a heartbeat comes from the editor that holds an edit lock. It is not the token of a sign-in session, which the glossary entry Session rules out."

[[allow]]
term = "link"
at = ["messages/en.json#markdown.link", "messages/en.json#markdown.link-text"]
reason = "The button of the Markdown editor that writes a web link into the text, and the placeholder for its text. Not the connection between two issues, which is a Relation."

[[allow]]
term = "link"
at = ["userDocs/writing/markdown.md"]
reason = "The Link button of the Markdown editor and the web addresses it writes into a text. Not the connection between two issues, which is a Relation."
