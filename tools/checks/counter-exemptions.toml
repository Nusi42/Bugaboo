# Numbers in answers that count only what the viewer may see, and the folders of code that may
# count (ARCH-NO-COUNTERS, architecture section 7 "No counts that leak", ADR-0021).
#
# [[exempt]]: a route (`GET /api/v1/...`), the property of its answer and a reason that says why
# the number holds only what the viewer may see. An entry that matches no property fails.
#
# [[counting]]: a folder or file whose code may make numbers that count up. Only the counting issue IDs of
# a project (ADR-0021, M3) and labels that nobody sees belong here. An entry with nothing that counts fails.

[[counting]]
folder = "crates/bb-store/src/issues.rs"
reason = "The counter of the counting issue IDs of a project: the one counter of the product, raised inside the change that makes the issue (ADR-0021, ISS-01a). Random IDs are the default."

[[counting]]
folder = "crates/bb-store/src/migrations/m0007_issues.rs"
reason = "Makes the table of that counter (ADR-0021, ISS-01a)."

[[exempt]]
route = "GET /api/v1/roles/{role_id}/second-step-gap"
property = "still_to_set_up"
reason = "Counts only the people the viewer may see: the answer needs Manage roles, and whoever holds it sees names everywhere in Organization settings (M2-Q3, M2-F47)."

[[exempt]]
route = "GET /api/v1/admin/status"
property = "entries"
reason = "The number of the server's own log entries, shown only to people with See how the server is doing, who may see all of the log."

[[exempt]]
route = "GET /api/v1/admin/status"
property = "write_failures"
reason = "A count of the server's own failed writes, shown only to people with See how the server is doing, who may see everything about the server."

[[exempt]]
route = "GET /api/v1/auth/two-step"
property = "backup_codes_left"
reason = "The caller's own backup codes: a person may see everything about their own sign-in data."

[[counting]]
folder = "crates/bb-sample/src/dump.rs"
reason = "The labels of the dump of the sample organization (person#1) only let two dumps be compared; they are never shown to anybody and never stored (TEST-SAMPLE-DATA)."

[[exempt]]
route = "GET /api/v1/groups/{group_id}"
property = "projects"
reason = "Counts only the projects the viewer can see: a row on a project the viewer may not know about is left out (PRIV-13, `Ctx::rows_seen_by`, test priv_13_used_by_counts_only_what_the_viewer_may_see)."

[[exempt]]
route = "GET /api/v1/groups/{group_id}"
property = "members"
reason = "The answer needs Manage groups, and whoever holds it sees every member of every group by name (M2-Q3), so the number holds nothing the viewer may not see."

[[exempt]]
route = "GET /api/v1/roles/{role_id}"
property = "projects"
reason = "Counts only the projects the viewer can see: a row on a project the viewer may not know about is left out (PRIV-13, `Ctx::rows_seen_by`, test priv_13_used_by_counts_only_what_the_viewer_may_see)."

[[exempt]]
route = "GET /api/v1/roles/{role_id}"
property = "people"
reason = "Counts only the people named by rows in the whole organization and in projects the viewer can see, and whoever holds Manage roles sees names there (M2-Q3, PRIV-13)."

[[exempt]]
route = "GET /api/v1/roles/{role_id}"
property = "groups"
reason = "Counts only the groups named by rows in the whole organization and in projects the viewer can see (PRIV-13)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/relations"
property = "total"
reason = "Counts only the sub-issues the viewer may see, in the projects where the viewer may see them: an issue they may not see is left out of the list and of this number alike (PRIV-13, ISS-03, test iss_03_progress_counts_only_the_sub_issues_you_see)."

[[exempt]]
route = "PUT /api/v1/issues/{issue}/parent"
property = "total"
reason = "The same progress as GET /api/v1/issues/{issue}/relations: it counts only the sub-issues the viewer may see (PRIV-13, ISS-03)."

[[exempt]]
route = "GET /api/v1/fields/{field}/used-by"
property = "project_count"
reason = "Counts only the projects the viewer may see: every project is checked for the viewer before it is counted, and the answer needs Manage fields (CF-03, M3 WP-05)."

[[exempt]]
route = "POST /api/v1/bulk/preview"
property = "will_change"
reason = "Counts the issues the person named themselves in the request; an issue they may not see counts as skipped, exactly as one that does not exist does, so it tells them nothing they did not send (PRIV-13)."

[[exempt]]
route = "POST /api/v1/bulk/preview"
property = "skipped"
reason = "Counts the issues the person named themselves in the request; an issue they may not see counts as skipped, exactly as one that does not exist does, so it tells them nothing they did not send (PRIV-13)."

[[exempt]]
route = "POST /api/v1/bulk/changes"
property = "changed"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "POST /api/v1/bulk/changes"
property = "done"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "POST /api/v1/bulk/changes"
property = "skipped_count"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "POST /api/v1/bulk/changes"
property = "total"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "GET /api/v1/bulk/runs/{run}"
property = "changed"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "GET /api/v1/bulk/runs/{run}"
property = "done"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "GET /api/v1/bulk/runs/{run}"
property = "skipped_count"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "GET /api/v1/bulk/runs/{run}"
property = "total"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "POST /api/v1/tags/{tag}/preview"
property = "will_change"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/tags/{tag}/preview"
property = "skipped"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/labels/{label}/preview"
property = "will_change"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/labels/{label}/preview"
property = "skipped"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/projects/{project}/move-preview"
property = "will_change"
reason = "Counts only the people in the projects the person sees: the answer says so (PRIV-13, M2C-F80)."

[[exempt]]
route = "POST /api/v1/projects/{project}/move-preview"
property = "skipped"
reason = "Counts only the people in the projects the person sees: the answer says so (PRIV-13, M2C-F80)."
