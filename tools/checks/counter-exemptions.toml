# Numbers in answers that count only what the viewer may see, and the folders of code that may
# count (ARCH-NO-COUNTERS, architecture section 7 "No counts that leak", ADR-0021).
#
# [[exempt]]: a route (`GET /api/v1/...`), the property of its answer and a reason that says why
# the number holds only what the viewer may see. An entry that matches no property fails.
#
# [[counting]]: a folder or file whose code may make numbers that count up. Only the counting issue IDs of
# a project (ADR-0021, M3) and labels that nobody sees belong here. An entry with nothing that counts fails.

[[counting]]
folder = "crates/bb-store/src/issues.rs"
reason = "The counter of the counting issue IDs of a project: the one counter of the product, raised inside the change that makes the issue (ADR-0021, ISS-01a). Random IDs are the default."

[[counting]]
folder = "crates/bb-store/src/migrations/m0007_issues.rs"
reason = "Makes the table of that counter (ADR-0021, ISS-01a)."

[[exempt]]
route = "GET /api/v1/roles/{role}/second-step-gap"
property = "still_to_set_up"
reason = "Counts only the people the viewer may see: the answer needs Manage roles, and whoever holds it sees names everywhere in Organization settings (M2-Q3, M2-F47)."

[[exempt]]
route = "GET /api/v1/admin/status"
property = "entries"
reason = "The number of the server's own log entries, shown only to people with See how the server is doing, who may see all of the log."

[[exempt]]
route = "GET /api/v1/admin/status"
property = "write_failures"
reason = "A count of the server's own failed writes, shown only to people with See how the server is doing, who may see everything about the server."

[[exempt]]
route = "GET /api/v1/auth/two-step"
property = "backup_codes_left"
reason = "The caller's own backup codes: a person may see everything about their own sign-in data."

[[exempt]]
route = "GET /api/v1/groups/{group}"
property = "projects"
reason = "Counts only the projects the viewer can see: a row on a project the viewer may not know about is left out (PRIV-13, `Ctx::rows_seen_by`, test priv_13_used_by_counts_only_what_the_viewer_may_see)."

[[exempt]]
route = "GET /api/v1/groups/{group}"
property = "members"
reason = "The answer needs Manage groups, and whoever holds it sees every member of every group by name (M2-Q3), so the number holds nothing the viewer may not see."

[[exempt]]
route = "GET /api/v1/roles/{role}"
property = "projects"
reason = "Counts only the projects the viewer can see: a row on a project the viewer may not know about is left out (PRIV-13, `Ctx::rows_seen_by`, test priv_13_used_by_counts_only_what_the_viewer_may_see)."

[[exempt]]
route = "GET /api/v1/roles/{role}"
property = "people"
reason = "Counts only the people named by rows in the whole organization and in projects the viewer can see, and whoever holds Manage roles sees names there (M2-Q3, PRIV-13)."

[[exempt]]
route = "GET /api/v1/roles/{role}"
property = "groups"
reason = "Counts only the groups named by rows in the whole organization and in projects the viewer can see (PRIV-13)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/relations"
property = "total"
reason = "Counts only the sub-issues the viewer may see, in the projects where the viewer may see them: an issue they may not see is left out of the list and of this number alike (PRIV-13, ISS-03, test iss_03_progress_counts_only_the_sub_issues_you_see)."

[[exempt]]
route = "PUT /api/v1/issues/{issue}/parent"
property = "total"
reason = "The same progress as GET /api/v1/issues/{issue}/relations: it counts only the sub-issues the viewer may see (PRIV-13, ISS-03)."

[[exempt]]
route = "GET /api/v1/fields/{field}/used-by"
property = "project_count"
reason = "Counts only the projects the viewer may see: every project is checked for the viewer before it is counted, and the answer needs Manage fields (CF-03, M3 WP-05)."

[[exempt]]
route = "POST /api/v1/many-changes/preview"
property = "will_change"
reason = "Counts the issues the person named themselves in the request; an issue they may not see counts as skipped, exactly as one that does not exist does, so it tells them nothing they did not send (PRIV-13)."

[[exempt]]
route = "POST /api/v1/many-changes/preview"
property = "skipped"
reason = "Counts the issues the person named themselves in the request; an issue they may not see counts as skipped, exactly as one that does not exist does, so it tells them nothing they did not send (PRIV-13)."

[[exempt]]
route = "POST /api/v1/many-changes"
property = "changed"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "POST /api/v1/many-changes"
property = "done"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "POST /api/v1/many-changes"
property = "skipped_count"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "POST /api/v1/many-changes"
property = "total"
reason = "Counts the issues the person named themselves in the request, as the run takes them; an issue they may not see counts as skipped like one that does not exist, so it adds nothing about issues they did not name (PRIV-13)."

[[exempt]]
route = "GET /api/v1/many-changes/runs/{run}"
property = "changed"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "GET /api/v1/many-changes/runs/{run}"
property = "done"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "GET /api/v1/many-changes/runs/{run}"
property = "skipped_count"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "GET /api/v1/many-changes/runs/{run}"
property = "total"
reason = "Counts the issues the person named in the request that started the run, which only they may see; an issue they may not see counts as skipped like one that does not exist (PRIV-13)."

[[exempt]]
route = "POST /api/v1/tags/{tag}/preview"
property = "will_change"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/tags/{tag}/preview"
property = "skipped"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/labels/{label}/preview"
property = "will_change"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/labels/{label}/preview"
property = "skipped"
reason = "Counts only the issues the person sees: an issue they may not see is not counted (PRIV-13, M3-Q8)."

[[exempt]]
route = "POST /api/v1/projects/{project}/move-preview"
property = "will_change"
reason = "Counts only the people in the projects the person sees: the answer says so (PRIV-13, M2C-F80)."

[[exempt]]
route = "POST /api/v1/projects/{project}/move-preview"
property = "skipped"
reason = "Counts only the people in the projects the person sees: the answer says so (PRIV-13, M2C-F80)."

[[exempt]]
route = "GET /api/v1/notifications/unread"
property = "unread"
reason = "Counts only the notifications the person may still see: each of the newest hundred unread ones is checked again against the issue and the fields the person sees now, and a hidden one is not counted (ADR-0033 §2, `unread_notifications`)."

[[exempt]]
route = "POST /api/v1/workflows/{workflow}/publish-preview"
property = "unseen"
reason = "Counts issues the viewer may not see on purpose, and only counts them: they are in a status that publishing would drop, and the publish is refused for them with the same fact (workflow.status-in-use). The answer needs Manage workflows wherever the workflow is used, and no issue is named or described (ADR-0031 amendment 12, decided with the lead)."

[[exempt]]
route = "POST /api/v1/workflows/{workflow}/publish-preview"
property = "blocked"
reason = "Counts the issues the publisher could not move, among them ones they may not see; only the number is told, for the same reason as `unseen` (ADR-0031 amendment 12)."

[[exempt]]
route = "POST /api/v1/workflows/{workflow}/publish-preview"
property = "issues"
reason = "Counts the issues in a status that publishing would drop, among them ones the viewer may not see, and only counts them; the publish is refused for them with the same fact (workflow.status-in-use). The answer needs Manage workflows wherever the workflow is used (ADR-0031 amendment 12)."

[[counting]]
folder = "crates/bb-store/src/dataset.rs"
reason = "Says where the counter of the counting issue IDs of a project stands after the large dataset wrote its issues in one go; the same counter as in issues.rs, set once (ADR-0021)."

[[exempt]]
route = "GET /api/v1/search/issues/count"
property = "issues"
reason = "Counts only issues the viewer may read: the same statement that finds them starts from the sight of the viewer (ADR-0004), so an issue of a place the viewer may not see is never counted (QRY-05)."

[[exempt]]
route = "GET /api/v1/search/issues/groups"
property = "issues"
reason = "Counts only issues the viewer may see and read: the groups are made by the same statement, which starts from the sight of the viewer (ADR-0004), and a field the viewer may not read is refused instead of grouped (QRY-05)."

[[counting]]
folder = "crates/bb-store/src/migrations/m0022_text_index.rs"
reason = "The row number of the index of the text search: a row number that stays when a file is compacted, which the external-content table of SQLite needs. It is never shown, never in an answer and names no public record (ADR-0016)."

[[exempt]]
route = "GET /api/v1/me/work-days"
property = "totals"
reason = "The time the person worked and their breaks, summed from their own work days only: the person sees every day it counts (ADR-0035, decisions 5 and 8)."

[[exempt]]
route = "POST /api/v1/me/work-days/start"
property = "totals"
reason = "The time the person worked and their breaks, summed from their own work days only: the person sees every day it counts (ADR-0035, decisions 5 and 8)."

[[exempt]]
route = "POST /api/v1/me/work-days/break/start"
property = "totals"
reason = "The time the person worked and their breaks, summed from their own work days only: the person sees every day it counts (ADR-0035, decisions 5 and 8)."

[[exempt]]
route = "POST /api/v1/me/work-days/break/end"
property = "totals"
reason = "The time the person worked and their breaks, summed from their own work days only: the person sees every day it counts (ADR-0035, decisions 5 and 8)."

[[exempt]]
route = "POST /api/v1/me/work-days/end"
property = "totals"
reason = "The time the person worked and their breaks, summed from their own work days only: the person sees every day it counts (ADR-0035, decisions 5 and 8)."

[[exempt]]
route = "PATCH /api/v1/me/work-days/{date}"
property = "totals"
reason = "The time the person worked and their breaks, summed from their own work days only: the person sees every day it counts (ADR-0035, decisions 5 and 8)."

[[exempt]]
route = "GET /api/v1/me/work-days"
property = "totals_only"
reason = "A yes-or-no, not a count: whether Totals only hides days the viewer would otherwise see; always no for one's own days (ADR-0035, decision 8)."

[[exempt]]
route = "GET /api/v1/people/{person}/work-days"
property = "totals"
reason = "The sums of one person's work days for a holder of See working hours of others, who may see every day of that person (ADR-0035, decision 8); under Totals only the answer has the week totals and nothing else."

[[exempt]]
route = "GET /api/v1/people/{person}/work-days"
property = "totals_only"
reason = "A yes-or-no, not a count: whether Totals only hides the days of the person from the viewer, who may see them otherwise (ADR-0035, decision 8)."

[[exempt]]
route = "PATCH /api/v1/people/{person}/work-days/{date}"
property = "totals"
reason = "The sums of the one day the holder of Change working hours of others just changed, every part of which they may see (ADR-0035, decision 8)."

[[exempt]]
route = "GET /api/v1/work-days/old"
property = "count"
reason = "How many work days are older than the keep period, for each person and in total, for a holder of Change organization settings, who may see and delete every one of them: the settings page shows them so that deleting them is one step (ADR-0035, decision 7). No day is named."

[[exempt]]
route = "GET /api/v1/work-days/old"
property = "total"
reason = "How many work days are older than the keep period, for each person and in total, for a holder of Change organization settings, who may see and delete every one of them: the settings page shows them so that deleting them is one step (ADR-0035, decision 7). No day is named."

[[exempt]]
route = "DELETE /api/v1/work-days/old"
property = "deleted"
reason = "How many work days the holder of Change organization settings just deleted, all of which they may see counted on the settings page before (ADR-0035, decision 7)."

[[exempt]]
route = "GET /api/v1/issues/{issue}"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "PATCH /api/v1/issues/{issue}"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "PUT /api/v1/issues/{issue}/description"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "PUT /api/v1/issues/{issue}/fields/{field}/text"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "POST /api/v1/issues/{issue}/move"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "POST /api/v1/issues/{issue}/restore"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/time"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on this issue and, with its sub-issues, only on the issues under it that the viewer sees, summed by the compiled search with the viewer's sight and fields (ADR-0004, ADR-0035 decision 4, PRIV-13)."

[[exempt]]
route = "GET /api/v1/projects/{project}/issues"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "POST /api/v1/projects/{project}/issues"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "GET /api/v1/search/issues"
property = "time_spent"
reason = "Minutes, not a count of things: the time booked on one issue the viewer sees, only in a list that asks for it (one issue reads it through /time), shown only to a reader of Time spent (the field level). It names no person and no time entry, and a person's own entries are not told apart from others' (ADR-0035, decision 4)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/time"
property = "estimated_time"
reason = "Minutes, not a count of things: the sum over the issue and the sub-issues under it that the viewer sees, in any project, by the compiled search with the viewer's sight; a field the viewer may not read where the sub-issues are is left out of the total (ADR-0004, ADR-0035 decision 4, PRIV-13)."

[[exempt]]
route = "GET /api/v1/issues/{issue}/time"
property = "time_left"
reason = "Minutes, not a count of things: the sum over the issue and the sub-issues under it that the viewer sees, in any project, by the compiled search with the viewer's sight; a field the viewer may not read where the sub-issues are is left out of the total (ADR-0004, ADR-0035 decision 4, PRIV-13)."

[[exempt]]
route = "GET /api/v1/projects/{project}/time"
property = "estimated_time"
reason = "Minutes, not a count of things: the sum over the issues of the project and its sub-projects that the viewer sees, by the compiled search of its list with the viewer's sight, only of a field the viewer may read in all of them (ADR-0004, ADR-0035 decision 4, PRIV-13)."

[[exempt]]
route = "GET /api/v1/projects/{project}/time"
property = "time_left"
reason = "Minutes, not a count of things: the sum over the issues of the project and its sub-projects that the viewer sees, by the compiled search of its list with the viewer's sight, only of a field the viewer may read in all of them (ADR-0004, ADR-0035 decision 4, PRIV-13)."

[[exempt]]
route = "GET /api/v1/projects/{project}/time"
property = "time_spent"
reason = "Minutes, not a count of things: the sum over the issues of the project and its sub-projects that the viewer sees, by the compiled search of its list with the viewer's sight, only of a field the viewer may read in all of them (ADR-0004, ADR-0035 decision 4, PRIV-13)."
