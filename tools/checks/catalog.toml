# Bugaboo check catalogue — the single source of every automated check.
#
# `cargo xtask` implements each entry; lefthook, Claude Code hooks and CI only ever call xtask.
# The meta checks (META-*) keep this file, the implementations and the docs in sync.
#
# Fields:
#   id      stable ID, referenced from docs ("Enforced by: ARCH-04")
#   title   what it catches, in plain words
#   rule    where the rule is written down (doc § or ADR)
#   tool    how it is checked
#   when    edit (Claude Code hook after each edit) · commit · push · ci · nightly · release
#   files   which files trigger it (globs); "*" = always
#   status  planned · active   (all planned until the M0 milestone builds xtask)

# ───────────── Formatting ─────────────
[[check]]
id = "FMT-RUST"
title = "Rust code is formatted"
rule = "coding-standards §3"
tool = "rustfmt (rustfmt.toml)"
when = ["edit", "commit", "ci"]
files = ["**/*.rs"]
status = "active"

[[check]]
id = "FMT-TS"
title = "TypeScript, JavaScript and JSON are formatted"
rule = "coding-standards §4"
tool = "oxfmt"
when = ["edit", "commit", "ci"]
files = [
  "web/**/*.{ts,tsx,js,mjs,json}",
  "tools/**/*.{js,mjs,json}",
  "messages/**/*.json",
  "*.{json,mjs,ts}",
  ".oxfmtrc.json",
  ".oxlintrc.json",
  "docs/design/*.js",
]
status = "active"

[[check]]
id = "FMT-CSS"
title = "CSS is formatted"
rule = "coding-standards §4"
tool = "oxfmt (formats CSS too, so the Biome fallback is not needed)"
when = ["edit", "commit", "ci"]
files = ["**/*.css"]
status = "active"

[[check]]
id = "FMT-TOML"
title = "TOML files are formatted"
rule = "coding-standards §2"
tool = "taplo"
when = ["edit", "commit", "ci"]
files = ["**/*.toml"]
status = "active"

[[check]]
id = "FMT-MD"
title = "Markdown docs follow one style"
rule = "coding-standards §2"
tool = "rumdl"
when = ["edit", "commit", "ci"]
files = ["**/*.md"]
status = "active"

# ───────────── Linting ─────────────
[[check]]
id = "LINT-RUST"
title = "Clippy finds no warnings (selected pedantic lints on), for the Windows and the Linux code"
rule = "coding-standards §3"
tool = "cargo clippy -D warnings"
when = ["push", "ci"]
files = ["**/*.rs", "**/Cargo.toml"]
status = "active"

[[check]]
id = "LINT-TS"
title = "oxlint finds no problems, including type-aware rules (TypeScript 7)"
rule = "coding-standards §4"
tool = "oxlint + oxlint-tsgolint"
when = ["edit", "commit", "ci"]
files = ["web/**/*.{ts,tsx,js,mjs}", "docs/design/*.js", "*.{mjs,ts}"]
status = "active"

[[check]]
id = "LINT-CSS"
title = "Styles use only token variables; no raw colors, sizes or !important"
rule = "ADR-0010, ADR-0026"
tool = "stylelint (the compiled rules of design/theme.kdl)"
when = ["edit", "commit", "ci"]
files = ["design/theme.kdl", "stylelint*.mjs"]
status = "active"

[[check]]
id = "LINT-HTML"
title = "Hand-written HTML pages are valid and accessible"
rule = "coding-standards §7"
tool = "html-validate (recommended and a11y presets)"
when = ["edit", "commit", "ci"]
files = ["docs/02-ux-design.html", "docs/mockups/*.html", "web/app/index.html"]
status = "active"

[[check]]
id = "LINT-TYPES"
title = "TypeScript type check passes"
rule = "coding-standards §4"
tool = "tsc (TypeScript 7) --noEmit"
when = ["push", "ci"]
files = ["web/**/*.{ts,tsx}", "web/**/tsconfig.json"]
status = "active"

[[check]]
id = "LINT-SPELL"
title = "No spelling mistakes in code, UI text and docs"
rule = "coding-standards §2"
tool = "typos"
when = ["commit", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "LINT-LINKS"
title = "Links in the docs point somewhere real"
rule = "coding-standards §2"
tool = "lychee (offline mode for repo links)"
when = ["ci"]
files = ["**/*.md"]
status = "active"

[[check]]
id = "LINT-CI"
title = "CI workflow files are valid"
rule = "ADR-0014"
tool = "actionlint"
when = ["commit", "ci"]
files = [".github/workflows/*.yml"]
status = "active"

[[check]]
id = "LINT-DRY"
title = "No copy-pasted code blocks above the duplication threshold"
rule = "coding-standards §1 (DRY)"
tool = "jscpd (Rust and TypeScript; .jscpd.json, tools/checks/dry-exemptions.toml)"
when = ["ci"]
files = ["crates/**/*.rs", "xtask/**/*.rs", "web/**/*.{ts,tsx}"]
status = "active"

[[check]]
id = "LINT-HYGIENE"
title = "No console.log, no any, no non-null !, no @ts-ignore, no TODO without an issue number, no dbg!/println!"
rule = "coding-standards §2, §3, §4"
tool = "oxlint rules + ast-grep"
when = ["edit", "commit", "ci"]
files = ["crates/**/*.rs", "xtask/**/*.rs", "web/**/*.{ts,tsx}"]
status = "planned"

[[check]]
id = "LINT-API-TYPES"
title = "No hand-written API response types in the browser app"
rule = "ADR-0008"
tool = "xtask (type and interface names in web/app against the schemas of the generated OpenAPI document, and names that say they are server answers)"
when = ["edit", "commit", "ci"]
files = ["web/app/**/*.{ts,tsx}", "web/packages/api-client/openapi.json"]
status = "active"

# ───────────── Text, words and style ─────────────
[[check]]
id = "TXT-LITERAL"
title = "No hard-coded user-facing text in components"
rule = "UX-07, coding-standards §4"
tool = "oxlint (react/jsx-no-literals, one configuration with LINT-TS): JSX text and the string values of aria-*, title, alt and placeholder"
when = ["edit", "commit", "ci"]
files = ["web/**/*.tsx"]
status = "active"

[[check]]
id = "TXT-CATALOG"
title = "Message catalog: no missing, unused or duplicate keys; placeholders match; every area imports its part"
rule = "UX-07, ADR-0028"
tool = "xtask (parses messages/en.json and code references; the entry of every feature with a message part imports it)"
when = ["edit", "commit", "ci"]
files = ["messages/**", "web/**/*.{ts,tsx}", "crates/**/*.rs"]
status = "active"

[[check]]
id = "TXT-TERMS"
title = "No words from the glossary's 'Don't say' column in UI text, user docs, API names or the names the code declares"
rule = "glossary.md"
tool = "xtask (reads glossary tables)"
when = ["edit", "commit", "ci"]
files = [
  "docs/glossary.md",
  "messages/**",
  "userDocs/**",
  "crates/**/*.rs",
  "xtask/**/*.rs",
  "web/**/*.{ts,tsx}",
  "web/packages/api-client/openapi.json",
  "tools/checks/terms-exemptions.toml",
]
status = "active"

[[check]]
id = "STY-TOKENS"
title = "Only design tokens in code: no hex/rgb colors in the app or in a rule of the theme file"
rule = "ADR-0010, ADR-0026"
tool = "xtask (no color values in the TypeScript and CSS of the app, nor in the rules of design/theme.kdl; sizes are LINT-CSS, styles from code are THEME-ONLY)"
when = ["edit", "commit", "ci"]
files = ["web/**/*.{ts,tsx,css}", "design/theme.kdl"]
status = "active"

[[check]]
id = "THEME-ONLY"
title = "The look lives in design/theme.kdl only: no style=, no className, no CSS file but the generated one (also in the pages of docs/)"
rule = "ADR-0026, coding-standards §4"
tool = "xtask (the TypeScript and CSS files of the app, and no style element or attribute in the pages of docs/; nothing is exempt)"
when = ["edit", "commit", "ci"]
files = ["web/**/*.{ts,tsx,css,scss,sass,less}", "docs/**/*.html"]
status = "active"

[[check]]
id = "STY-CONTRAST"
title = "Every text/background pair in the built-in themes passes WCAG AA"
rule = "THM-03, UX-04"
tool = "xtask (reads design/theme.kdl: every theme, in the usual mode and with more contrast)"
when = ["commit", "ci"]
files = ["design/theme.kdl"]
status = "active"

# ───────────── Architecture ─────────────
[[check]]
id = "ARCH-DEPS"
title = "Crates depend only on what the module map allows"
rule = "architecture §4 (dependency rules), ADR-0001"
tool = "xtask (cargo metadata vs allowed edges)"
when = ["push", "ci"]
files = ["**/Cargo.toml"]
status = "active"

[[check]]
id = "ARCH-PURE"
title = "bb-core, bb-searchlang and bb-markdown do no I/O (no tokio, sqlx, std::fs, std::net)"
rule = "architecture §4, ADR-0005, ADR-0011"
tool = "xtask (reads the dependencies of the three crates) + clippy (disallowed methods and types of the standard library that reach the world, in a clippy.toml per crate that `cargo xtask gen clippy` writes, held by DOC-GENERATED; clippy runs on push and in CI)"
when = ["edit", "push", "ci"]
files = ["crates/bb-core/**", "crates/bb-searchlang/**", "crates/bb-markdown/**", "clippy.toml"]
status = "active"

[[check]]
id = "ARCH-WASM"
title = "The crates shared with the browser (bb-core, bb-searchlang, bb-markdown) and bb-wasm still build for WebAssembly, and the wasm-bindgen program is the version of the library"
rule = "ADR-0001, ADR-0005, ADR-0011"
tool = "xtask (cargo check --target wasm32-unknown-unknown; compares the wasm-bindgen version in tools/dev/tools.toml with Cargo.lock). The size of the module, PERF-04, is measured in the browser build by PERF-BUNDLE"
when = ["push", "ci"]
files = [
  "crates/bb-core/**",
  "crates/bb-searchlang/**",
  "crates/bb-markdown/**",
  "crates/bb-wasm/**",
  "Cargo.toml",
]
status = "active"

[[check]]
id = "ARCH-AUTHZ-ONLY"
title = "Authorized<T> is only created inside bb-policy"
rule = "ADR-0004"
tool = "xtask (reads the code: no copy, literal or constructor of Authorized outside bb-policy, no call of evaluate outside bb-app/src/access and no literal of Inputs outside bb-store, no private field made public, the test feature only for dev-dependencies) + private constructor (a compile-fail test in bb-policy builds it from outside and must fail)"
when = ["edit", "commit", "ci"]
files = ["crates/**/*.rs", "crates/**/Cargo.toml"]
status = "active"

[[check]]
id = "ARCH-API-OUT"
title = "API and MCP handlers return only Authorized views, never domain or database types"
rule = "ADR-0004"
tool = "xtask (answer_authorized and Page::of_authorized take only an Authorized<T>; the check finds handlers that answer through the wrappers that take any value, or with axum::Json, unless tools/checks/api-out-exemptions.toml names them with a reason)"
when = ["edit", "commit", "ci"]
files = ["crates/bb-api/**", "crates/bb-mcp/**", "tools/checks/api-out-exemptions.toml"]
status = "active"

[[check]]
id = "ARCH-HTTP-EDGE"
title = "Only bb-api and bb-mcp use HTTP crates; only bb-server, bb-sample and bb-load-check depend on the adapters"
rule = "architecture §4"
tool = "xtask (cargo metadata: normal and build dependencies on HTTP crates and on the adapter crates)"
when = ["push", "ci"]
files = ["**/Cargo.toml"]
status = "active"

[[check]]
id = "ARCH-SQL-EDGE"
title = "Only bb-store touches the database; no SQL text built with format! anywhere"
rule = "ADR-0003, SEC-17"
tool = "xtask (cargo metadata for dependencies; source scan for sqlx calls and SQL built as text)"
when = ["edit", "commit", "ci"]
files = ["crates/**/*.rs", "**/Cargo.toml"]
status = "active"

[[check]]
id = "ARCH-EVENTS"
title = "Every command use case appends a domain event"
rule = "ADR-0007"
tool = "xtask (every command use case in bb-app calls record_change of the ChangeStore port, or Ctx::save_text, which calls it; comments and strings do not count); every public command must be named in the table of crates/bb-app/src/tests/events.rs, whose test runs each command against the in-memory store and asserts exactly one event (M1-F18)"
when = ["edit", "commit", "ci"]
files = ["crates/bb-app/**"]
status = "active"

[[check]]
id = "ARCH-VERSIONED"
title = "Every change endpoint takes a version in its body and long-text endpoints an edit-lock token"
rule = "ADR-0019"
tool = "xtask (reads the generated OpenAPI document: every operation but a read has `version` in its request body, or is named with a reason in tools/checks/version-exemptions.toml; a route marked x-long-text also has `lock_token` and is never exempt; a route that takes a version documents the structured conflict as its 409; an exemption for a route that is gone or has a version fails)"
when = ["push", "ci"]
files = ["crates/bb-api/**", "tools/checks/version-exemptions.toml"]
status = "active"

[[check]]
id = "ARCH-API-FREEZE"
title = "Nothing in /api/v1 is renamed or removed after the API freeze"
rule = "ADR-0008"
tool = "xtask (compares the generated OpenAPI document with the frozen copy stored at m4-done: a path, operation, schema, property, parameter, enum value or error code that is gone fails; additions pass)"
when = ["push", "ci"]
files = ["crates/bb-api/**", "web/packages/api-client/openapi.json"]
status = "planned"

[[check]]
id = "ARCH-LEAN"
title = "Every list endpoint supports fields=, cursor paging and a page-size cap; every GET documents ETag and 304"
rule = "PERF-02"
tool = "xtask (reads the generated OpenAPI document: every GET with a list, that is any array property or an answer that is a bare array (refused: it has no room for next_cursor), takes fields, cursor and a limit with a maximum and answers next_cursor; the few small lists named in tools/checks/lean-exemptions.toml have a hard cap and a truncated flag; every GET documents the ETag header and the 304 answer (except a route marked x-never-stored); a list embeds another object only when it declares include with the names that may be embedded, and declares include only then)"
when = ["push", "ci"]
files = [
  "crates/bb-api/**",
  "web/packages/api-client/openapi.json",
  "tools/checks/lean-exemptions.toml",
]
status = "active"

[[check]]
id = "ARCH-PERMS"
title = "Every endpoint and MCP tool declares its permission; every permission is used and explained"
rule = "SEC-01, ADR-0004"
tool = "xtask (reads x-permission in the generated API description, the permission catalogue in bb-policy, the message catalog and tools/checks/permission-exemptions.toml)"
when = ["push", "ci"]
files = [
  "crates/bb-api/**",
  "crates/bb-mcp/**",
  "crates/bb-policy/**",
  "messages/en.json",
  "tools/checks/permission-exemptions.toml",
  "web/packages/api-client/openapi.json",
]
status = "active"

[[check]]
id = "ARCH-ERRORS"
title = "Every error code has a message key; API errors are problem+json with a code"
rule = "architecture §7 (Errors)"
tool = "xtask (reads the code table with syn and the catalog; finds error answers built from a text written in the code, also across lines and with more elements, and bare error statuses; reads the generated OpenAPI document: the ErrorCode schema equals the table and every route documents the standard problem+json answers)"
when = ["push", "ci"]
files = [
  "crates/bb-core/**",
  "messages/**",
  "crates/bb-api/**",
  "crates/bb-server/**",
  "web/packages/api-client/openapi.json",
]
status = "active"

[[check]]
id = "ARCH-SETTINGS"
title = "Settings are only read and written through the settings registry"
rule = "ADR-0018"
tool = "xtask (declarations and key literals in Rust and in the browser app, except generated files, migrations and the argument of a message lookup; the tables of setting values are named in the settings repository only)"
when = ["edit", "commit", "ci"]
files = ["crates/**/*.rs", "xtask/**/*.rs", "web/**/*.{ts,tsx}"]
status = "active"

[[check]]
id = "ARCH-AI-TOOLS"
title = "AI tools exist only in the tool registry and never reach people-ranking, assignment or working-hours use cases"
rule = "ADR-0013, COMP-10"
tool = "xtask (registry allow list) + ast-grep"
when = ["edit", "commit", "ci"]
files = ["crates/bb-ai/**", "crates/bb-mcp/**"]
status = "planned"

[[check]]
id = "ARCH-WEB-API"
title = "The browser app calls the server only through @bugaboo/api-client (no raw fetch)"
rule = "ADR-0008"
tool = "xtask (scans web/ outside the client package for fetch, XMLHttpRequest, WebSocket, EventSource, sendBeacon, HTTP libraries and imports into the client package); oxlint no-restricted-globals in .oxlintrc.json is a second guard"
when = ["edit", "commit", "ci"]
files = ["web/**/*.{ts,tsx}"]
status = "active"

[[check]]
id = "ARCH-WEB-FEATURES"
title = "Browser feature folders import each other only through their public index; shared code and packages never import features or the app"
rule = "architecture §4 (browser app)"
tool = "xtask (imports of web/app/src and web/packages)"
when = ["edit", "commit", "ci"]
files = ["web/**/*.{ts,tsx}"]
status = "active"

[[check]]
id = "ARCH-MAP-SYNC"
title = "The module map in the architecture docs lists exactly the crates and packages that exist"
rule = "architecture §4, COMP-06"
tool = "xtask (parses 04-building-blocks.md vs workspace)"
when = ["push", "ci"]
files = ["**/Cargo.toml", "web/**/package.json", "docs/architecture/04-building-blocks.md"]
status = "active"

[[check]]
id = "ARCH-DOC-CHANGE"
title = "Changed boundaries, interfaces or dependencies come with a doc or decision-record change"
rule = "COMP-06, coding-standards §5"
tool = "xtask (diff against main)"
when = ["push", "ci"]
files = ["**/Cargo.toml", "web/**/package.json", "crates/bb-api/**"]
status = "planned"

[[check]]
id = "ARCH-NO-UNSAFE"
title = "Every crate forbids unsafe code unless an ADR allows it"
rule = "coding-standards §3"
tool = "xtask (checks #![forbid(unsafe_code)] in crate roots)"
when = ["commit", "ci"]
files = ["**/Cargo.toml", "crates/*/src/lib.rs", "crates/*/src/main.rs", "xtask/src/main.rs"]
status = "active"

[[check]]
id = "ARCH-DB-PARITY"
title = "Repository tests ran on both SQLite and PostgreSQL"
rule = "ADR-0003"
tool = "xtask (`db run` checks target/db-parity.txt right after the tests; the check verifies ci runs the tests through `db run`)"
when = ["ci"]
files = ["crates/bb-store/**", "crates/bb-testing/**"]
status = "active"

[[check]]
id = "ARCH-PERSON-REF"
title = "People are only shown through PersonRef, resolved for the viewer (names, role only or Someone)"
rule = "ADR-0022, PRIV-12"
tool = "xtask (reads the code of bb-api and bb-app, and the generated API description: no name or address outside PersonRef; exemptions with a reason in person-ref-exemptions.toml)"
when = ["edit", "commit", "ci"]
files = [
  "crates/bb-api/**/*.rs",
  "crates/bb-app/**/*.rs",
  "tools/checks/person-ref-exemptions.toml",
  "web/packages/api-client/openapi.json",
]
status = "active"

[[check]]
id = "ARCH-NO-COUNTERS"
title = "No public identifier or label counts up (IDs, former-user labels); no totals that include hidden items"
rule = "ADR-0021, PRIV-13"
tool = "xtask (finds counting columns, sequences and count-plus-one numbers in product code, and count properties in the answers of the generated API description, unless tools/checks/counter-exemptions.toml names them with a reason)"
when = ["commit", "ci"]
files = [
  "crates/**/*.rs",
  "tools/checks/counter-exemptions.toml",
  "web/packages/api-client/openapi.json",
]
status = "active"

[[check]]
id = "TEST-ISSUE-IDS"
title = "Counting and random IDs: unique, readable alphabet, old IDs redirect after moves and mode changes"
rule = "ADR-0021"
tool = "xtask (the unit, property and two-database tests of the rules about issue IDs exist by name; the two-database ones run through each_database)"
when = ["ci"]
files = ["crates/**"]
status = "active"

# ───────────── Security ─────────────
[[check]]
id = "SEC-SECRETS"
title = "No keys, tokens or passwords committed"
rule = "SEC-16"
tool = "gitleaks"
when = ["commit", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "SEC-PRIVATE"
title = "Nothing private about the owner in Git: no profile paths with an account name, no session IDs or links, no links to published pages, no account or computer names"
rule = "coding-standards §2"
tool = "xtask (every file, name and text, the examples of other checks too; commit-msg hook: `check commit-msg <file>`; push and CI: also the messages of every branch, tag and HEAD, annotated tag messages, ref names, and what the commits not on a remote add; reads the optional list ~/.config/bugaboo/private-words.txt; exemptions in tools/checks/private-exemptions.toml)"
when = ["commit", "push", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "SEC-RICHTEXT"
title = "Text written by people is rendered only by bb-markdown: no second Markdown or HTML library, HTML is set from a string in one file only and only SafeHtml reaches it, the corpus tests exist, and the CSP allows exactly the one policy, whose name is written once"
rule = "coding-standards §4, ADR-0011, SEC-13"
tool = "xtask (reads Cargo manifests and the browser code) + the corpus tests `sec_13_the_sanitizer_corpus_renders_every_attack_as_text` and `sec_13_server_and_browser_render_the_same_html`"
when = ["edit", "commit", "ci"]
files = [
  "crates/**/Cargo.toml",
  "crates/bb-markdown/**",
  "crates/bb-api/src/headers.rs",
  "web/**/*.{ts,tsx}",
  "web/**/package.json",
  "package.json",
]
status = "active"

[[check]]
id = "SEC-PATTERNS"
title = "No unwrap/expect/panic/unreachable/todo/dbg in Rust code that ships; no eval, new Function, document.write or timer with a string in the browser code"
rule = "coding-standards §3, §4"
tool = "xtask (reads the Rust code that ships, without comments, strings and #[cfg(test)] code, and the browser code)"
when = ["edit", "push", "ci"]
files = ["crates/**/*.rs", "xtask/**/*.rs", "web/**/*.{ts,tsx}"]
status = "active"

[[check]]
id = "SEC-MATRIX"
title = "Generated permission matrix passes for every entry point (UI API, search, MCP, assistant, e-mail, webhooks, exports)"
rule = "ADR-0004"
tool = "generated tests (crates/bb-server/src/tests/matrix runs every route of the API description for every actor and writes tools/checks/sec-matrix-record.txt) + xtask (holds the record and the table of examples against the API description)"
when = ["push", "ci"]
files = ["crates/**", "tools/checks/sec-matrix-record.txt", "web/packages/api-client/openapi.json"]
status = "active"

[[check]]
id = "SEC-HEADERS"
title = "Running server sends the required security headers and CSP"
rule = "SEC-11"
tool = "xtask (the header table in crates/bb-api/src/headers.rs has every header SEC-11 requires with an allowed value, a permissions policy that turns off camera, microphone and location, no weak CSP source, no includeSubDomains, and HSTS lifetimes within one day and one year) + integration tests in crates/bb-api/tests, which read the table"
when = ["edit", "commit", "ci"]
files = ["crates/bb-api/**"]
status = "active"

[[check]]
id = "SEC-COOKIES"
title = "Cookies are set only by the cookie module, with a __Host- name and a stated purpose"
rule = "COMP-13, PRIV-01"
tool = "xtask (reads the cookie table in crates/bb-api/src/cookies.rs; finds Set-Cookie, cookie libraries and document.cookie writes elsewhere)"
when = ["edit", "commit", "ci"]
files = ["crates/**/*.rs", "web/**/*.{ts,tsx}", "messages/**"]
status = "active"

[[check]]
id = "SEC-ADVISORIES"
title = "No known vulnerabilities without a VEX statement"
rule = "COMP-03"
tool = "cargo-deny advisories + OSV for npm"
when = ["ci", "nightly"]
files = ["Cargo.lock", "**/package-lock.json"]
status = "planned"

# ───────────── Data and privacy ─────────────
[[check]]
id = "DATA-MARKS"
title = "Every stored field is marked as personal data or not"
rule = "ADR-0015, PRIV-02"
tool = "derive macro (compile error) + xtask report"
when = ["edit", "ci"]
files = ["crates/**/*.rs", "docs/privacy/**"]
status = "active"

[[check]]
id = "DATA-LOGS"
title = "No names, e-mail addresses or free text in log statements"
rule = "architecture §7 (Observability), PRIV-01"
tool = "xtask (reads every tracing macro in product code)"
when = ["edit", "commit", "ci"]
files = ["crates/**/*.rs"]
status = "active"

[[check]]
id = "DATA-MIGRATIONS"
title = "Schema is defined once; migrations run on both databases from one source"
rule = "ADR-0003"
tool = "xtask (no .sql migration files; migration test on both)"
when = ["ci"]
files = ["crates/bb-store/**"]
status = "active"

# ───────────── Dependencies and compliance ─────────────
[[check]]
id = "DEP-REGISTER"
title = "Every direct dependency has a third-party register entry, and every entry a dependency"
rule = "COMP-02, coding-standards §5"
tool = "xtask (lockfiles vs docs/third-party)"
when = ["push", "ci"]
files = ["Cargo.lock", "**/package-lock.json", "docs/third-party/**"]
status = "active"

[[check]]
id = "DEP-LICENSES"
title = "Only licenses on the allow list ship"
rule = "architecture §1 (licenses)"
tool = "cargo-deny licenses + npm license check against the same list"
when = ["push", "ci"]
files = ["Cargo.lock", "**/package-lock.json", "deny.toml"]
status = "active"

[[check]]
id = "DEP-UNUSED"
title = "No unused dependencies"
rule = "coding-standards §2"
tool = "cargo-machete + knip-style check for npm"
when = ["ci"]
files = ["**/Cargo.toml", "**/package.json"]
status = "planned"

[[check]]
id = "DEP-SBOM"
title = "Release has CycloneDX and SPDX SBOMs and third-party notices"
rule = "COMP-01, COMP-02"
tool = "cargo-cyclonedx + @cyclonedx/cyclonedx-npm + cargo-about"
when = ["release"]
files = ["*"]
status = "planned"

[[check]]
id = "DOC-GENERATED"
title = "Generated files are up to date (API client, style sheet, theme names, message types, docs HTML)"
rule = "SSOT"
tool = "xtask (regenerates the docs pages and compares)"
when = ["push", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "DOC-ADR-ENFORCED"
title = "Every decision record says how it is enforced (check IDs, or 'review' with a reason)"
rule = "META, ADR template"
tool = "xtask (parses docs/adr)"
when = ["commit", "ci"]
files = ["docs/adr/**"]
status = "active"

# ───────────── Performance and quality ─────────────
[[check]]
id = "PERF-BUNDLE"
title = "Initial JavaScript stays within its budget (Brotli)"
rule = "PERF-04"
tool = "xtask (reads the Vite manifest of the built app, adds up the JavaScript of the entry and what it imports at once, compresses each file with Brotli at the quality the server uses (tools/dev/compression.json) and fails above the budget in tools/checks/perf-bundle.toml; the WebAssembly modules of the build, together, have their own budget there)"
when = ["ci"]
files = ["web/**", "tools/checks/perf-bundle.toml", "tools/dev/compression.json"]
status = "active"

[[check]]
id = "PERF-N1"
title = "List endpoints run a bounded number of queries"
rule = "PERF-05"
tool = "tests with a query counter"
when = ["ci"]
files = ["crates/bb-store/**", "crates/bb-app/**"]
status = "planned"

[[check]]
id = "PERF-BENCH"
title = "Latency budgets hold on the 1 M-issue dataset"
rule = "PERF-01"
tool = "xtask dataset + benchmarks"
when = ["nightly"]
files = ["*"]
status = "planned"

[[check]]
id = "TEST-A11Y"
title = "No accessibility violations on key screens in all four themes"
rule = "UX-04"
tool = "Playwright + axe (web/app/e2e/a11y*.spec.ts); xtask checks that every address in paths.ts has an entry there, the suite itself runs in cargo xtask ci"
when = ["commit", "ci"]
files = ["web/app/src/shared/paths.ts", "web/app/e2e/a11y*.spec.ts"]
status = "active"

[[check]]
id = "TEST-SEARCH-ROUNDTRIP"
title = "Simple ⇄ Advanced search never loses information"
rule = "QRY-02, ADR-0005"
tool = "proptest: parse(print(tree)) == tree"
when = ["ci"]
files = ["crates/bb-searchlang/**"]
status = "planned"

[[check]]
id = "TEST-EDIT-LOCKS"
title = "Edit locks and confirmed saves: lost lock, take-over, conflict and offline cases keep the person's text"
rule = "ADR-0019, ISS-17"
tool = "integration tests on both databases (the server part: the tests named iss_17_* and iss_11_*, with a record kind that exists only in tests); the Playwright scenarios of three people at one description and of a lock holder whose network drops are in web/app/e2e/concurrent/locks.spec.ts"
when = ["ci"]
files = ["crates/bb-app/**", "crates/bb-server/**", "web/**"]
status = "active"

[[check]]
id = "DEV-PORTS"
title = "No default framework ports; every port comes from tools/dev/ports.json and is strict"
rule = "ADR-0023"
tool = "xtask (scans vite, vitest and playwright configs)"
when = ["edit", "commit", "ci"]
files = [
  "web/**/vite.config.*",
  "web/**/vitest.config.*",
  "web/**/playwright.config.*",
  "tools/dev/ports.json",
  "package.json",
  "web/**/package.json",
  "crates/**/*.rs",
  "xtask/**/*.rs",
  "**/*.toml",
]
status = "active"

[[check]]
id = "TEST-SAMPLE-DATA"
title = "The sample organization builds from its seed, is identical on both databases, and contains only fictional data"
rule = "architecture §11, ADR-0023"
tool = "xtask dataset sample --check"
when = ["ci"]
files = ["xtask/**", "crates/bb-store/**", "crates/bb-sample/**"]
status = "active"

[[check]]
id = "TEST-CONCURRENT"
title = "Ten people working at once: no lost text, no half-saved changes, locks expire, conflicts explained"
rule = "architecture §11, ADR-0019"
tool = "xtask (the browser scenarios of ten Playwright contexts, the invariants test on both databases and the short run of `cargo xtask load` in ci are there and not switched off); the runs themselves: Playwright, the Rust tests and `cargo xtask load --people 10`, short in ci, `--nightly` for 30 minutes"
when = ["ci", "nightly"]
files = ["crates/**", "web/**", "xtask/src/ci.rs", "xtask/src/load/**", "tools/dev/load.json"]
status = "active"

[[check]]
id = "PLAN-TRACE"
title = "Every M and V1 feature is in exactly one milestone, MVP features only in MVP milestones, and every work package names its features"
rule = "04-milestones.md"
tool = "xtask (parses the feature list, the milestones and docs/milestones/**)"
when = ["commit", "ci"]
files = ["docs/01-feature-list.md", "docs/04-milestones.md", "docs/milestones/**"]
status = "active"

[[check]]
id = "BUILD-LOCATION"
title = "Nothing is built, installed or tested inside a OneDrive folder (the master repository); work happens in the work root"
rule = "ADR-0024"
tool = "xtask (path check before every build, test, dev and install command)"
when = ["edit", "commit", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "GIT-COMMIT-MSG"
title = "Commit messages follow Conventional Commits"
rule = "coding-standards §2"
tool = "xtask (commit-msg hook: `check commit-msg <file>`; push and CI: commits not on main)"
when = ["push", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "GIT-FILES"
title = "No large binaries and no CRLF line endings committed"
rule = "coding-standards §7"
tool = "xtask"
when = ["commit", "ci"]
files = ["*"]
status = "active"

# ───────────── Meta: checks that guard the checks ─────────────
[[check]]
id = "META-CATALOG"
title = "Every check in this catalogue is implemented in xtask, and every implemented check is in this catalogue"
rule = "architecture §10"
tool = "xtask self-test"
when = ["commit", "ci"]
files = ["tools/checks/catalog.toml", "xtask/**"]
status = "active"

[[check]]
id = "META-FIXTURES"
title = "Every check has a 'bad' example that must fail and a 'good' example that must pass"
rule = "architecture §10"
tool = "xtask self-test over tools/checks/fixtures/<ID>/"
when = ["ci"]
files = ["tools/checks/**", "xtask/**"]
status = "active"

[[check]]
id = "META-COVERAGE"
title = "Every file is covered by a formatter or linter, is generated, or is listed with a reason in tools/checks/coverage-exemptions.toml — a new file type means a new check"
rule = "architecture §10"
tool = "xtask (project files vs the 'files' globs above, the generated marker and tools/checks/coverage-exemptions.toml)"
when = ["commit", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "META-NEW-MODULE"
title = "Every crate, package and top-level folder is listed in the module map (the dependency rules are ARCH-DEPS' job)"
rule = "architecture §10, ARCH-MAP-SYNC"
tool = "xtask"
when = ["commit", "ci"]
files = ["**/Cargo.toml", "**/package.json"]
status = "active"

[[check]]
id = "META-RULE-TRACE"
title = "Every rule in coding standards, ADRs and the architecture (must, shall, has to, may only …) names its check ID or says 'review' with a reason"
rule = "architecture §10"
tool = "xtask (parses docs for Enforced-by markers)"
when = ["commit", "ci"]
files = ["docs/**/*.md"]
status = "active"

[[check]]
id = "META-WIRING"
title = "lefthook, Claude Code hooks and CI call exactly the xtask commands they should, and only those; CI actions are pinned to a commit"
rule = "ADR-0014"
tool = "xtask (reads lefthook.yml, .claude/settings.json, CI workflow)"
when = ["commit", "ci"]
files = ["lefthook.yml", ".claude/settings.json", ".github/workflows/**"]
status = "active"

[[check]]
id = "META-SUPPRESS"
title = "Every suppression (allow, expect, eslint/oxlint/stylelint-disable, @ts-ignore, ast-grep ignore, the allow marker of the secret scan, accepted advisories) has a reason that names an issue or a doc section; the total is compared with tools/checks/suppressions.txt and may only change together with that file"
rule = "architecture §10"
tool = "xtask (counts and compares with tools/checks/suppressions.txt)"
when = ["commit", "ci"]
files = ["*"]
status = "active"

[[check]]
id = "META-SPEED"
title = "Checks stay fast: every edit-time check under 3 s on one file and all commit-time checks under 10 s on a sample of files on a quiet PC; on a busy PC the budgets grow with a reference workload timed alongside, and the best of 3 attempts counts"
rule = "architecture §10"
tool = "xtask (times the checks itself)"
when = ["ci"]
files = ["*"]
status = "active"
