# Files that no formatter or linter covers, each with the reason (META-COVERAGE, architecture §10).
# An entry is an exact path or a path glob. Generated files need no entry: they are in the
# generator's output list (`docs::generated_paths`) and DOC-GENERATED keeps them up to date. An entry that matches no file fails.

[[exempt]]
path = "Cargo.lock"
reason = "Written by Cargo; never edited by hand."

[[exempt]]
path = ".gitignore"
reason = "A plain list of patterns; no formatter exists, and review reads every change."

[[exempt]]
path = ".gitattributes"
reason = "A plain list of patterns; no formatter exists, and review reads every change."

[[exempt]]
path = ".codegraph/.gitignore"
reason = "Written by the CodeGraph tool; not part of Bugaboo."

[[exempt]]
path = "tools/checks/sec-matrix-record.txt"
reason = "Written by the permission matrix test, which fails when the file differs from what ran; SEC-MATRIX holds it against the API description."

[[exempt]]
path = "tools/checks/suppressions.txt"
reason = "Written by `cargo xtask suppressions` and compared with the code by META-SUPPRESS."

[[exempt]]
path = ".editorconfig"
reason = "A plain list of editor settings; no formatter exists, and review reads every change."

[[exempt]]
path = ".node-version"
reason = "One line with the Node version, read by CI and checked by the tool installer."

[[exempt]]
path = ".npmrc"
reason = "A few npm settings; no formatter exists, and review reads every change."

[[exempt]]
path = "lefthook.yml"
reason = "Checked by META-WIRING, which allows only the exact xtask commands."

[[exempt]]
path = ".claude/settings.json"
reason = "Checked by META-WIRING, which allows only the exact hook command and matcher."

[[exempt]]
path = "tools/checks/fixtures/**"
reason = "Deliberately bad and good examples of checks; only those checks look at them."

[[exempt]]
path = "crates/*/tests/ui/*.stderr"
reason = "The compiler messages that the compile-fail tests expect (DATA-MARKS); written by trybuild and compared with the real output on every test run."

[[exempt]]
path = "tools/dev/refuse-build.cmd"
reason = "Three-line Windows batch file that only refuses builds in the master (ADR-0024); no batch linter exists, review reads every change."

[[exempt]]
path = "crates/bb-auth/data/breached-passwords.txt"
reason = "Data, not code: a sorted list of leaked passwords; the unit tests in bb-auth check that it is sorted and has no short lines (AUTH-01)."

[[exempt]]
path = "crates/bb-markdown/tests/corpus/*.html"
reason = "The exact HTML the renderer must write for the corpus case of the same name (SEC-13); the corpus test compares byte for byte, so no formatter may touch it."

[[exempt]]
path = "crates/bb-markdown/tests/corpus/*.hosts"
reason = "The allowed image hosts of the corpus case of the same name, one per line; read by the corpus test."
