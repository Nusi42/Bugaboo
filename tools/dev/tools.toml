# External tools — the single source for every tool version (ADR-0014, ADR-0024).
# `cargo xtask setup` installs them into `.tools/` inside the work folder (never machine-wide).
# npm-based tools are pinned in the root package.json / package-lock.json instead.
#
# kind = "cargo"    → cargo install --locked --root .tools <crate>@<version>
# kind = "download" → fetch the archive for this platform, verify sha256, unpack the binary into .tools/bin

[[tool]]
name = "cargo-deny"
kind = "cargo"
crate = "cargo-deny"
version = "0.20.2"

[[tool]]
name = "cargo-machete"
kind = "cargo"
crate = "cargo-machete"
version = "0.9.2"

[[tool]]
name = "taplo"
kind = "cargo"
crate = "taplo-cli"
version = "0.10.0"

[[tool]]
name = "typos"
kind = "cargo"
crate = "typos-cli"
version = "1.50.3"

[[tool]]
name = "rumdl"
kind = "cargo"
crate = "rumdl"
version = "0.2.78"

[[tool]]
name = "lychee"
kind = "cargo"
crate = "lychee"
version = "0.24.2"

