# External tools — the single source for every tool version (ADR-0014, ADR-0024).
# `cargo xtask setup` installs them into `.tools/` inside the work folder (never machine-wide).
# npm-based tools are pinned in the root package.json / package-lock.json instead.
#
# kind = "cargo"    → cargo install --locked --root .tools <crate>@<version>
# kind = "download" → fetch the archive (.zip, .tar.gz) or single .gz program for this platform,
#                     verify sha256, put the binary into .tools/bin
# kind = "bundle"   → fetch the archive for this platform, verify sha256, unpack the listed `folders`
#                     into .tools/<name>/. A platform without a download entry uses the program
#                     already installed on the machine (`system-programs`); `system-hint` says how
#                     to install it. The programs are looked up on the PATH and in `system-folders`.

[[tool]]
name = "cargo-deny"
kind = "cargo"
crate = "cargo-deny"
version = "0.20.2"

[[tool]]
name = "cargo-machete"
kind = "cargo"
crate = "cargo-machete"
version = "0.9.2"

[[tool]]
name = "taplo"
kind = "cargo"
crate = "taplo-cli"
version = "0.10.0"

[[tool]]
name = "typos"
kind = "cargo"
crate = "typos-cli"
version = "1.50.3"

[[tool]]
name = "rumdl"
kind = "cargo"
crate = "rumdl"
version = "0.2.78"

[[tool]]
name = "lychee"
kind = "cargo"
crate = "lychee"
version = "0.24.2"

[[tool]]
name = "gitleaks"
kind = "download"
version = "8.30.1"
windows-x64 = { url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip", sha256 = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e" }
linux-x64 = { url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz", sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" }

[[tool]]
name = "actionlint"
kind = "download"
version = "1.7.12"
windows-x64 = { url = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip", sha256 = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9" }
linux-x64 = { url = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz", sha256 = "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" }

# Git hooks (ADR-0014): `cargo xtask setup` installs the hooks from lefthook.yml with it.
# The sha256 values are lefthook's published lefthook_checksums.txt for v2.1.16.
[[tool]]
name = "lefthook"
kind = "download"
version = "2.1.16"
windows-x64 = { url = "https://github.com/evilmartians/lefthook/releases/download/v2.1.16/lefthook_2.1.16_Windows_x86_64.gz", sha256 = "8fc291f266423bdf6eee1eebce8a83b01122715637b2a0cea07b4c2a2733a67f" }
linux-x64 = { url = "https://github.com/evilmartians/lefthook/releases/download/v2.1.16/lefthook_2.1.16_Linux_x86_64.gz", sha256 = "bcf67d241ebb062a4fe9053ef0d7fde6692f846e504843ed33ab39b08334f299" }

# PostgreSQL for the repository tests (ADR-0003, `cargo xtask db`). Windows: the official EDB
# binaries. EDB publishes no checksum, so the sha256 below was computed once by us from the
# downloaded file (`sha256sum postgresql-18.6-1-windows-x64-binaries.zip`, 343,808,005 bytes,
# 2026-10-04). Only bin, lib and share are unpacked (the archive also holds pgAdmin and docs).
# Linux: the system PostgreSQL, as installed on GitHub's Ubuntu runners.
[[tool]]
name = "postgresql"
kind = "bundle"
version = "18.6"
folders = ["bin", "lib", "share"]
system-programs = ["initdb", "pg_ctl", "pg_isready", "psql", "postgres"]
system-folders = ["/usr/lib/postgresql/*/bin"]
system-hint = "Install PostgreSQL 16 or newer, for example `sudo apt-get install postgresql postgresql-client` (the server is not started; xtask runs its own cluster)."
windows-x64 = { url = "https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip", sha256 = "fbe23da234ee31547bf8a36d29dfd81e82b849df2d2b78d2eecb43d360252f8c" }
