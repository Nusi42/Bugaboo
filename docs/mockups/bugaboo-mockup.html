<title>Bugaboo Clickable Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="components.css">
<style>
/* Mockup app layout: sidebar | main | side panel; phone: single pane + bottom bar. Tokens and shared components come from ../design/. */
html,body{height:100%}
/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr) auto;overflow:hidden;position:relative}
.sidebar{background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 8px;font-weight:700;font-size:var(--fs-md);letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.side-scroll{flex:1;overflow:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:2px}
.side-search{display:flex;align-items:center;gap:8px;margin:6px 10px 8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--bg-raised);color:var(--fg-muted);text-align:left;width:calc(100% - 20px)}
.side-search kbd{margin-left:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-ctl);border:0;background:none;text-align:left;width:100%;color:var(--fg)}
.nav-item:hover{background:var(--bg-hover)}
.nav-item[aria-current="true"]{background:var(--bg-selected);color:var(--accent-fg);font-weight:600}
.nav-item .count{margin-left:auto;font-size:var(--fs-xs);background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px;font-weight:600}
.nav-label{font-size:var(--fs-xs);color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px;font-weight:600}
.nav-sub{padding-left:30px}
.side-foot{border-top:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px}
.timer-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-ctl);background:var(--accent-soft);color:var(--accent-fg);border:0;width:100%;text-align:left}
.timer-chip .t{margin-left:auto;font-weight:600}
.timer-chip.off{background:transparent;color:var(--fg-muted);border:1px dashed var(--border)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-canvas)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);min-height:56px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--fg-muted);min-width:0;flex:1 1 auto}
.crumbs b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
select.look{padding:6px 8px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--bg-raised)}
.content{flex:1;overflow:auto;padding:20px 24px 40px;min-height:0}
.content.flush{padding:0}

/* ---------- search bar ---------- */
.searchbar{display:flex;align-items:flex-start;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border-subtle);background:var(--bg-canvas);flex-wrap:wrap}
.adv{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.adv textarea{width:100%;min-height:62px;resize:vertical;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--bg-raised);font-family:var(--mono);font-size:var(--fs-sm);line-height:1.55}
.adv .err{color:var(--danger);font-size:var(--fs-sm);display:flex;gap:6px;align-items:center}
.adv .hint{color:var(--fg-muted);font-size:var(--fs-xs)}
.ask{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.ask input{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--accent);border-radius:var(--r-ctl);background:var(--bg-raised)}
.ask-result{flex-basis:100%;border:1px solid var(--border);background:var(--accent-soft);border-radius:var(--r-ctl);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ask-result code{font-family:var(--mono);font-size:var(--fs-sm);flex:1;min-width:0}

/* ---------- list ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--fg-subtle);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--bg-hover)}
.tbl tr.row.sel td{background:var(--bg-selected)}
.tbl .title{font-weight:500}
.group-h td{background:var(--bg-surface);font-weight:600;font-size:var(--fs-sm);color:var(--fg-muted)}
.cards{display:none}
.bulkbar{position:sticky;bottom:12px;margin:12px auto 0;width:max-content;max-width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg-raised);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--r-card);padding:8px 10px}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding:16px 24px 24px;min-height:100%;align-items:start}
.col{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-card);display:flex;flex-direction:column;min-height:200px}
.col.drop-ok{outline:2px dashed var(--accent);outline-offset:-2px}
.col.drop-no{opacity:.45}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600}
.col-h .lim{margin-left:auto;font-size:var(--fs-xs);color:var(--fg-muted);font-weight:500}
.col-h .lim.over{color:var(--warning);font-weight:700}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px}
.card{background:var(--bg-raised);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:var(--accent)}
.card .title{font-weight:500}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-sm)}
.card .move{margin-left:auto}
.board-tabs{display:none}

/* ---------- timeline ---------- */
.tl-wrap{overflow-x:auto;padding:16px 24px 24px}
.tl{min-width:760px;display:grid;grid-template-columns:260px 1fr;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;background:var(--bg-raised)}
.tl-h{display:contents}
.tl-h>div{background:var(--bg-surface);border-bottom:1px solid var(--border);padding:8px 10px;font-size:var(--fs-xs);color:var(--fg-muted);font-weight:600}
.tl-weeks{display:grid;grid-template-columns:repeat(5,1fr);padding:0!important}
.tl-weeks span{padding:8px 10px;border-left:1px solid var(--border-subtle)}
.tl-name{padding:8px 10px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.tl-name:hover{background:var(--bg-hover)}
.tl-name .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-name.goal{font-weight:600;background:var(--bg-surface)}
.tl-name.child{padding-left:28px}
.tl-lane{position:relative;border-bottom:1px solid var(--border-subtle);min-height:38px;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(20% - 1px),var(--border-subtle) calc(20% - 1px),var(--border-subtle) 20%)}
.bar{position:absolute;top:9px;height:20px;border-radius:5px;background:var(--st-ip);color:var(--on-accent);font-size:11px;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;border:0}
.bar.ns{background:var(--fg-subtle)}
.bar.done{background:var(--st-done)}
.bar.goal{background:var(--accent);height:10px;top:14px;border-radius:3px}
.bar.goal .prog{position:absolute;inset:0 auto 0 0;background:var(--accent-fg);opacity:.55}
.ms{position:absolute;top:11px;width:16px;height:16px;transform:translateX(-8px) rotate(45deg);background:var(--warning);border-radius:2px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.7;pointer-events:none}
.today-label{position:absolute;top:2px;font-size:10px;color:var(--danger);font-weight:700;transform:translateX(4px)}
.tl-list{display:none}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:var(--fs-sm);color:var(--fg-muted);align-items:center}
.tl-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* ---------- side panel ---------- */
.panel{width:440px;border-left:1px solid var(--border);background:var(--bg-canvas);display:flex;flex-direction:column;min-height:0}
.panel[hidden]{display:none!important}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);min-height:56px}
.panel-tabs{display:flex;gap:4px}
.panel-b{flex:1;overflow:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:18px;min-height:0}
.issue-title{font-size:var(--fs-lg);font-weight:700;line-height:1.3;border:1px solid transparent;border-radius:var(--r-ctl);padding:4px 6px;margin:-4px -6px;background:none;width:calc(100% + 12px);text-wrap:balance}
.issue-title:hover{border-color:var(--border)}
.fval{border:1px solid transparent;background:none;border-radius:var(--r-ctl);padding:5px 7px;margin-left:-7px;text-align:left;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.fval:hover{border-color:var(--border);background:var(--bg-raised)}
.fval.add{color:var(--fg-subtle)}
.ro{display:inline-flex;align-items:center;gap:6px;padding:5px 0}
.ro .lock{color:var(--fg-subtle)}
.ro-note{font-size:var(--fs-xs);color:var(--fg-muted);grid-column:2;margin-top:-4px}
.section-h{font-size:var(--fs-sm);font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.desc{line-height:1.6;max-width:65ch}
.desc ol{padding-left:20px;margin:6px 0}
.subs{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.subs button{display:flex;gap:10px;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--border-subtle);background:var(--bg-raised);text-align:left}
.subs button:last-child{border-bottom:0}
.subs button:hover{background:var(--bg-hover)}
.activity{display:flex;flex-direction:column;gap:12px}
.act{display:flex;gap:10px}
.act .body{flex:1;min-width:0}
.act .bubble{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:8px 12px;margin-top:4px}
.act.change{color:var(--fg-muted);font-size:var(--fs-sm);align-items:center}
.comment-box{display:flex;gap:8px;align-items:flex-end}
.comment-box textarea{flex:1;min-height:42px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--bg-raised);resize:vertical}
.back-btn{display:none}

/* ---------- assistant ---------- */
.ai-ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-sm)}
.ai-src{font-size:var(--fs-sm);background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-ctl);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bg-surface);border:1px solid var(--border-subtle);border-bottom-left-radius:4px}
.msg ul{margin:6px 0;padding-left:18px}
.ai-label{font-size:var(--fs-xs);color:var(--fg-subtle);display:flex;gap:4px;align-items:center}
.proposal{border:1px solid var(--accent);border-radius:var(--r-card);padding:12px;background:var(--bg-raised);display:flex;flex-direction:column;gap:10px}
.proposal .diff{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proposal .old{text-decoration:line-through;color:var(--fg-muted)}
.ai-input{display:flex;gap:8px;border-top:1px solid var(--border);padding:12px 14px}
.ai-input input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--bg-raised)}

/* ---------- home / generic ---------- */
.page-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.page-h h1{font-size:var(--fs-xl);margin:0;text-wrap:balance}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.box{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.box-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border-subtle);font-weight:700}
.box-h .muted{font-weight:400;margin-left:auto;font-size:var(--fs-sm)}
.box-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border:0;border-bottom:1px solid var(--border-subtle);background:none;width:100%;text-align:left}
.box-row:last-child{border-bottom:0}
.box-row:hover{background:var(--bg-hover)}
.box-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-big{display:flex;align-items:center;gap:14px;padding:16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-card);margin-bottom:18px;flex-wrap:wrap}
.timer-big .clock{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--accent-fg)}
.checklist{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:14px;border:1px dashed var(--border);border-radius:var(--r-card)}
.checklist .step{display:flex;align-items:center;gap:8px}
.done-mark{width:20px;height:20px;border-radius:50%;background:var(--success);color:var(--bg-canvas);display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- docs ---------- */
.docs{display:grid;grid-template-columns:240px minmax(0,1fr) 240px;min-height:100%}
.doc-tree{border-right:1px solid var(--border);padding:14px 10px;background:var(--bg-surface);display:flex;flex-direction:column;gap:2px}
.doc-tree .nav-item{font-size:var(--fs-sm)}
.doc-page{padding:28px 36px 48px;min-width:0}
.doc-page h1{font-size:30px;margin:4px 0 6px;text-wrap:balance}
.doc-page h2{font-size:var(--fs-lg);margin:24px 0 8px}
.doc-page p,.doc-page li{max-width:68ch;line-height:1.65}
.doc-toolbar{display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-ctl);padding:4px;margin:12px 0 20px;width:max-content;max-width:100%;background:var(--bg-surface)}
.doc-toolbar button{border:0;background:none;padding:4px 8px;border-radius:4px;font-size:var(--fs-sm)}
.doc-toolbar button:hover{background:var(--bg-hover)}
.live-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg-raised);vertical-align:1px;font-size:var(--fs-sm)}
.doc-side{border-left:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:18px;font-size:var(--fs-sm)}
.ver{display:flex;gap:8px;align-items:center;padding:4px 0}
.lockbadge{display:inline-flex;gap:4px;align-items:center;font-size:var(--fs-xs);color:var(--warning);margin-left:auto}

/* ---------- time ---------- */
.ts-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-card);background:var(--bg-raised)}
.ts{border-collapse:collapse;width:100%;min-width:720px}
.ts th,.ts td{padding:8px 8px;border-bottom:1px solid var(--border-subtle);text-align:center;font-variant-numeric:tabular-nums}
.ts th{font-size:var(--fs-xs);color:var(--fg-muted);font-weight:600;background:var(--bg-surface)}
.ts th.today{color:var(--accent-fg)}
.ts td:first-child,.ts th:first-child{text-align:left}
.ts input{width:64px;padding:6px;text-align:center;border:1px solid var(--border-subtle);border-radius:var(--r-ctl);background:var(--bg-canvas);font-family:var(--mono)}
.ts input:focus{border-color:var(--accent)}
.ts input.bad{border-color:var(--danger);background:var(--danger-soft)}
.ts tfoot td{font-weight:700;background:var(--bg-surface)}

/* ---------- settings ---------- */
.perm{border-collapse:collapse;width:100%;min-width:640px}
.perm th,.perm td{padding:10px;border-bottom:1px solid var(--border-subtle);text-align:left}
.perm th{font-size:var(--fs-xs);color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;background:var(--bg-surface)}
.perm select{padding:5px 8px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--bg-raised);font-size:var(--fs-sm)}
.perm select.hid{color:var(--fg-subtle)}
.perm select.see{color:var(--st-ip)}
.perm select.chg{color:var(--success);font-weight:600}
.explain{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:12px 14px;line-height:1.6}
.wf{display:flex;flex-direction:column;gap:10px}
.wf-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-card);background:var(--bg-raised)}
.wf-row .arrow{color:var(--fg-subtle)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.theme-card{border:2px solid var(--border);border-radius:var(--r-card);padding:0;overflow:hidden;background:none;text-align:left}
.theme-card[aria-pressed="true"]{border-color:var(--accent)}
.theme-card .pv{height:96px;display:grid;grid-template-columns:30% 1fr}
.theme-card .pv i{display:block}
.theme-card .pv .s{padding:8px 6px;display:flex;flex-direction:column;gap:5px}
.theme-card .pv .m{padding:10px;display:flex;flex-direction:column;gap:6px}
.theme-card .pv span{display:block;height:6px;border-radius:3px}
.theme-card .cap{padding:8px 10px;display:flex;flex-direction:column;background:var(--bg-raised)}
.theme-card .cap small{color:var(--fg-muted)}
.setting-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto}
.setting-tabs button{border:0;background:none;padding:8px 12px;color:var(--fg-muted);border-bottom:2px solid transparent;white-space:nowrap}
.setting-tabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.help{font-size:var(--fs-sm);color:var(--fg-muted);margin:-6px 0 14px;max-width:70ch}

/* ---------- overlays ---------- */
.pop{position:fixed;z-index:50;min-width:220px;max-width:min(320px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:6px}
.pop-h{font-size:var(--fs-xs);color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px 4px;font-weight:600}
.pop-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;background:none;width:100%;text-align:left;border-radius:var(--r-ctl)}
.pop-item:hover,.pop-item:focus-visible{background:var(--bg-hover)}
.pop-item small{color:var(--fg-muted);margin-left:auto}
.pop-note{font-size:var(--fs-xs);color:var(--fg-muted);padding:6px 10px;border-top:1px solid var(--border-subtle);margin-top:4px}
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:60;display:grid;place-items:start center;padding:10vh 16px 16px}
.dialog{background:var(--bg-raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:80vh;overflow:auto;display:flex;flex-direction:column}
.dialog-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border-subtle)}
.dialog-h h2{margin:0;font-size:var(--fs-md)}
.dialog-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dialog-f{padding:12px 18px;border-top:1px solid var(--border-subtle);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.qs-input{width:100%;padding:14px 18px;border:0;border-bottom:1px solid var(--border);background:none;font-size:var(--fs-md)}
.qs-input:focus{outline:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg-canvas);border-radius:var(--r-card);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px 6px}
.mock-note{font-size:var(--fs-xs);color:var(--fg-subtle);padding:8px 24px;border-top:1px solid var(--border-subtle)}
.bottombar{display:none}

/* ---------- relations, relation map, calendar ---------- */
.seg{max-width:100%;overflow-x:auto}
.rel-ph{min-width:104px;font-size:var(--fs-sm)}
.pop-find{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--bg-canvas);margin:2px 0 6px}

const FIELD_ALIASES = {project:"project",status:"status",assignedto:"assignedTo",priority:"priority",type:"type",label:"label",labels:"label"};
function clauseText(c){ return c.raw ? c.raw : `${c.f} ${c.op} ${/\s/.test(c.v) ? '"'+c.v+'"' : c.v}`; }
function toText(){
  const body = S.filters.map(clauseText).join(" and ");
  return body + (S.sort ? `\nsort by ${S.sort}` : "");
}
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}} return d[b.length]; }
function parse(text){
  let t = text.replace(/\s+/g," ").trim(), sort = "";
  const sm = t.match(/\s*sort by (.+)$/i);
  if(sm){ sort = sm[1].trim(); t = t.slice(0, sm.index).trim(); }
  const out = [];
  if(!t) return {filters:out, sort};
  for(const part of t.split(/\s+and\s+/i)){
    const m = part.match(/^([A-Za-z]+)\s+(is not|is|within)\s+"?([^"]+)"?$/i);
    if(!m){ out.push({raw:part}); continue; }
    const f = FIELD_ALIASES[m[1].toLowerCase()];
    if(!f){
      const names = Object.keys(FIELDS);
      const w = m[1].toLowerCase();
      const best = names.map(n => [n, n.toLowerCase().startsWith(w) && w.length >= 3 ? 0 : lev(w, n.toLowerCase())]).sort((a,b)=>a[1]-b[1])[0];
      return {error:`There is no field called "${m[1]}".` + (best[1] <= 3 ? ` Did you mean "${best[0]}"?` : "")};
    }
    let v = m[3].trim();
    const known = VALUES[f].find(x => x.toLowerCase() === v.toLowerCase());
    if(known) v = known;
    out.push({f, op:m[2].toLowerCase(), v});
  }
  return {filters:out, sort};
}
function matches(i){
  return S.filters.every(c => {
    if(c.raw || c.f === "project") return true;
    let val;
    switch(c.f){
      case "status": val = i.status === c.v; break;
      case "assignedTo": val = c.v === "me" ? i.who === ME : c.v === "nobody" ? !i.who : i.who === c.v; break;
      case "priority": val = i.prio === c.v; break;
      case "type": val = TYPES[i.type] === c.v; break;
      case "label": val = i.labels.includes(c.v); break;
      default: val = true;
    }
    return c.op === "is not" ? !val : val;
  });
}
function visibleIssues(){
  const list = issues.filter(matches);
  if(/priority/i.test(S.sort)) list.sort((a,b) => PRIORITIES.indexOf(a.prio) - PRIORITIES.indexOf(b.prio));
  return list;
}
function chipLabel(c){
  if(c.f === "project") return `<b>Project:</b> Website`;
  const v = c.f === "assignedTo" && c.v === "me" ? "me" : c.v;
  return `<b>${FIELDS[c.f]}:</b> ${c.op === "is not" ? "not " : ""}${esc(v)}`;
}

    ${unscheduled.map(u => `<div class="box-row">${typeTag(u,false)}<span class="key">${u.key}</span><span class="t">${esc(u.title)}</span><button type="button" class="btn sm" data-act="toast" data-msg="In the real app this opens a date picker for ${u.key}.">Set dates …</button></div>`).join("")}</div>`;
  const dated = issues.filter(i => i.start).sort((a,b) => a.start.localeCompare(b.start));
  const lst = `<div class="tl-list"><p class="muted" style="margin:0;font-size:var(--fs-sm)">On phones the timeline is a dated list. Change dates inside each issue.</p>

/* The issue view is built from parts (DRY); the side panel and the focus view arrange them differently. */
function issueParts(i){
  const running = S.timer && S.timer.key === i.key;
  const kids = issues.filter(k => k.parent === i.key);
  const parent = i.parent ? byKey(i.parent) : null;
  const rels = neighbors(i.key, new Set(Object.keys(RELATION_KINDS))).filter(n => n.rel.kind !== "part");
  const P = {};
  P.parent = parent ? `<button type="button" class="btn sm ghost" style="align-self:flex-start" data-act="open" data-key="${parent.key}">${ico("i-goal")}Part of: ${esc(parent.title)}</button>` : "";
  P.title = `<input type="text" class="issue-title" value="${esc(i.title)}" aria-label="Title" data-act-change="title" data-key="${i.key}">`;
  P.timer = `<button type="button" class="btn sm ${running?"primary":""}" data-act="${running?"timer-stop":"timer-start"}" data-key="${i.key}">${ico(running?"i-stop":"i-play")}${running?"Stop timer":"Start timer"}</button>`;
  P.status = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${statusPill(i)}${P.timer}</div>`;
  P.fields = `<dl class="fields">
        <dt>Assigned to</dt><dd><button type="button" class="fval" data-act="field-menu" data-field="who" data-key="${i.key}">${whoTag(i.who,"assigned")}</button></dd>
        <dt>Priority</dt><dd><button type="button" class="fval" data-act="field-menu" data-field="prio" data-key="${i.key}">${prioTag(i.prio)}</button></dd>
        ${i.sev ? `<dt>Severity</dt><dd><button type="button" class="fval" data-act="toast" data-msg="Opens the list of severities."><span class="tag ${i.sev==="S1"?"c1":i.sev==="S2"?"c4":"c2"}">${i.sev}</span></button></dd>` : ""}
        <dt>Labels</dt><dd>${i.labels.length ? `<span class="fval">${labelTags(i.labels)}</span>` : `<button type="button" class="fval add" data-act="toast" data-msg="Opens the label list.">Add a label</button>`}</dd>
        <dt>Planned for</dt><dd>${i.release ? `<span class="fval">Release ${i.release}</span>` : `<button type="button" class="fval add" data-act="toast" data-msg="Opens the release list.">Add a release</button>`}</dd>
        <dt>Due date</dt><dd>${i.due ? `<span class="fval num">${i.due}</span>` : `<button type="button" class="fval add" data-act="toast" data-msg="Opens a date picker.">Add a due date</button>`}</dd>
        <dt>Estimated time</dt><dd><span class="fval num">${i.est}</span></dd>
        <dt>Time spent</dt><dd><span class="fval num">${fmtSpent(i.spent + (running ? Math.floor((Date.now()-S.timer.start)/60000) : 0))}</span></dd>
        <dt>Cost center</dt><dd><span class="ro" title="Only team members and administrators can change Cost center.">4100 ${ico("i-lock","lock")}</span></dd>
        <dd class="ro-note">Only team members and administrators can change this.</dd>
        <dt>Activity</dt><dd><span class="tag c2">Development</span></dd>
        <dt>Reported by</dt><dd><span class="fval">${whoTag(i.by,"reported")}</span></dd>
        <dt>Followers</dt><dd><button type="button" class="fval" data-act="toast" data-msg="You're now following ${i.key}.">3 · Follow</button></dd>
        <dt></dt><dd><button type="button" class="fval add" data-act="add-field" data-key="${i.key}">${ico("i-plus")}Add a field</button></dd>
      </dl>`;
  P.facts = `<div class="facts" role="group" aria-label="Main details">${statusPill(i)}
      <button type="button" class="fact" data-act="field-menu" data-field="who" data-key="${i.key}"><span class="fl">Assigned to</span>${whoTag(i.who,"assigned")}</button>
      <button type="button" class="fact" data-act="field-menu" data-field="prio" data-key="${i.key}"><span class="fl">Priority</span>${prioTag(i.prio)}</button>
      ${i.due ? `<span class="fact"><span class="fl">Due</span><span class="num">${i.due}</span></span>` : ""}
      ${i.release ? `<span class="fact"><span class="fl">Planned for</span>${i.release}</span>` : ""}
      ${i.labels.length ? `<span class="fact"><span class="fl">Labels</span>${labelTags(i.labels)}</span>` : ""}
      ${P.timer}
      <button type="button" class="btn sm ghost fx-details-btn" data-act="fx-details">${S.detailsOpen ? "Hide details" : "All details"}</button></div>`;
  P.desc = descSection(i);
  P.subs = kids.length ? `<section><h3 class="section-h">Sub-issues (${kids.length})</h3><div class="subs">${kids.map(k=>`<button type="button" data-act="open" data-key="${k.key}">${typeTag(k,false)}<span class="key">${k.key}</span><span style="flex:1;min-width:0">${esc(k.title)}</span>${statusPill(k,false)}</button>`).join("")}</div></section>` : "";
  P.related = `<section><h3 class="section-h">Related issues (${rels.length})</h3>
        ${rels.length ? `<div class="subs">${rels.map(({rel, other}) => { const o = byKey(other); return `<button type="button" data-act="open" data-key="${other}"><span class="muted rel-ph">${relPhrase(rel, i.key)}</span><span class="key">${other}</span><span style="flex:1;min-width:0">${esc(o.title)}</span>${statusPill(o,false)}</button>`; }).join("")}</div>` : `<p class="subtle" style="margin:0">No related issues yet.</p>`}

  P.activity = `<section><h3 class="section-h">Activity</h3>

          ${S.panelTab!=="comments"&&S.panelTab!=="time" ? `<div class="act change">${personAvatar("Ana","author")}<span><b>${personLabel("Ana","author")}</b> changed the status from <b>Open</b> to <b>In progress</b> · 2 h ago</span></div>` : ""}
          ${S.panelTab==="all"||S.panelTab==="time" ? `<div class="act change">${ico("i-clock")}<span><b>${personLabel("Ana","author")}</b> added 1 h 20 min · “Found the token check” · Friday</span></div>` : ""}
        </div></section>`;
  P.comment = `<div class="comment-box"><textarea placeholder="Write a comment… Use @ to mention someone." aria-label="Comment"></textarea><button type="button" class="btn primary" data-act="toast" data-msg="Comment sent.">Send</button></div>`;
  return P;
}
const focusActive = () => !!S.open && S.issueLayout === "focus" && !narrow() && S.screen !== "map";

function renderPanel(){
  const p = $("#panel");
  if(S.panelMode === "assistant"){ p.hidden = false; p.innerHTML = renderAssistant(); return; }
  if(!S.open || focusActive()){ p.hidden = true; p.innerHTML = ""; return; }
  const i = byKey(S.open), P = issueParts(i);
  p.hidden = false;
  p.innerHTML = `<div class="panel-h">
      <button type="button" class="btn ghost back-btn" data-act="close">${ico("i-back")}Back</button>
      ${typeTag(i)}<button type="button" class="key" data-act="toast" data-msg="Link to ${i.key} copied." style="border:0;background:none">${i.key}</button>
      <span style="margin-left:auto"></span>
      <button type="button" class="btn ghost" data-act="assistant" aria-label="Ask the assistant about this issue">${ico("i-spark")}<span class="hide-phone">Ask</span></button>

    <div class="panel-b">${P.parent}${P.title}${P.status}${P.fields}${P.desc}${P.subs}${P.related}${P.activity}${P.comment}</div>`;
}

function renderFocus(){
  const i = byKey(S.open), P = issueParts(i);

}

/* ============ edit locks and confirmed saves (ADR-0019) ============ */
const LOCKS = {"WEB-139":{who:"Ben", since:"2 min"}};   // someone else is editing these descriptions
const DESCS = {};
function defaultDesc(i){
  return i.type === "bug"
    ? "After resetting the password, signing in with the new password shows “Something went wrong”.\n\nSteps to reproduce\n1. Click “Forgot password”.\n2. Open the e-mail link and set a new password.\n3. Sign in with the new password.\n\nExpected: signed in. Actually: error message."
    : `${i.title}. More details go here.`;
}
function descSection(i){
  const text = DESCS[i.key] ?? defaultDesc(i);
  const lock = LOCKS[i.key];
  const ed = S.editing === i.key;
  let body;
  if(lock && !ed){

/* ============ relation map ============ */
let MAP = null;
const NW = 172, NH = 52;
function buildGraph(center, depth, kinds){
  if(!center){
    const keys = new Set(visibleIssues().map(i => i.key));
    return {nodes:[...keys].map(key => ({key, depth:0})), edges:allRels().filter(r => kinds.has(r.kind) && keys.has(r.from) && keys.has(r.to)), prev:{}};
  }
  const seen = new Map([[center,0]]), prev = {}, q = [center];
  while(q.length){
    const k = q.shift(), d = seen.get(k);
    if(depth !== "all" && d >= depth) continue;
    for(const {rel, other} of neighbors(k, kinds)){
      if(!byKey(other) || seen.has(other) || seen.size >= 200) continue;
      seen.set(other, d+1); prev[other] = {via:k, rel}; q.push(other);
    }
  }
  const keys = new Set(seen.keys());
  return {nodes:[...seen].map(([key,depth]) => ({key, depth})), edges:allRels().filter(r => kinds.has(r.kind) && keys.has(r.from) && keys.has(r.to)), prev};
}
function layout(g, center){
  const N = g.nodes, pos = {}, rings = {}, fixed = k => !!center && k === center;
  N.forEach(n => (rings[n.depth] ||= []).push(n.key));
  for(const [d0, keys] of Object.entries(rings)){
    const d = +d0;
    keys.forEach((k, ix) => {
      if(center && d === 0){ pos[k] = {x:0, y:0}; return; }
      const r = center ? d*210 : Math.max(240, keys.length*48), a = ix/keys.length*Math.PI*2 + d*0.5;
      pos[k] = {x:Math.cos(a)*r*1.35, y:Math.sin(a)*r*0.8};
    });
  }
  for(let it = 0; it < 220; it++){
    const f = {}; N.forEach(n => f[n.key] = {x:0, y:0});
    for(let i = 0; i < N.length; i++) for(let j = i+1; j < N.length; j++){
      const A = N[i].key, B = N[j].key, a = pos[A], b = pos[B];
      const dx = a.x-b.x, dy = a.y-b.y, d2 = Math.max(dx*dx+dy*dy, 100), d = Math.sqrt(d2), rep = 70000/d2;
      f[A].x += dx/d*rep; f[A].y += dy/d*rep; f[B].x -= dx/d*rep; f[B].y -= dy/d*rep;
    }
    g.edges.forEach(e => { const a = pos[e.from], b = pos[e.to], dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 1, s = (d-240)*0.05;
      f[e.from].x += dx/d*s; f[e.from].y += dy/d*s; f[e.to].x -= dx/d*s; f[e.to].y -= dy/d*s; });
    N.forEach(n => { const k = n.key; if(fixed(k)) return;
      if(!center){ f[k].x -= pos[k].x*0.012; f[k].y -= pos[k].y*0.02; }
      pos[k].x += Math.max(-25, Math.min(25, f[k].x)); pos[k].y += Math.max(-25, Math.min(25, f[k].y)); });
  }
  for(let pass = 0; pass < 120; pass++){
    let moved = false;
    for(let i = 0; i < N.length; i++) for(let j = i+1; j < N.length; j++){
      const A = N[i].key, B = N[j].key, a = pos[A], b = pos[B];
      const dx = b.x-a.x, dy = b.y-a.y, ox = NW+28-Math.abs(dx), oy = NH+40-Math.abs(dy);
      if(ox > 0 && oy > 0){
        moved = true;
        const fa = fixed(A) ? 0 : fixed(B) ? 1 : 0.5, fb = 1-fa;
        if(ox/NW < oy/NH){ const s = (dx >= 0 ? 1 : -1)*ox; a.x -= s*fa; b.x += s*fb; }
        else { const s = (dy >= 0 ? 1 : -1)*oy; a.y -= s*fa; b.y += s*fb; }
      }
    }
    if(!moved) break;
  }
  return pos;
}
function renderMapSvg(g, pos, center){
  if(!g.nodes.length) return `<p class="muted" style="padding:20px;margin:0">Nothing to show with these settings.</p>`;
  const r1 = v => Math.round(v*10)/10;
  const xs = g.nodes.map(n => pos[n.key].x), ys = g.nodes.map(n => pos[n.key].y);
  const x0 = Math.min(...xs)-NW/2-30, x1 = Math.max(...xs)+NW/2+30, y0 = Math.min(...ys)-NH/2-30, y1 = Math.max(...ys)+NH/2+30;
  const clip = (p, q) => { const dx = q.x-p.x, dy = q.y-p.y; if(!dx && !dy) return p;
    const t = Math.min(dx ? Math.abs((NW/2+6)/dx) : Infinity, dy ? Math.abs((NH/2+6)/dy) : Infinity); return {x:p.x+dx*t, y:p.y+dy*t}; };
  const marks = ["blocks","cause","dup","part"].map(c => `<marker id="arr-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-${c}"/></marker>`).join("");
  const edges = g.edges.map(e => {
    const k = RELATION_KINDS[e.kind], a = clip(pos[e.from], pos[e.to]), b = clip(pos[e.to], pos[e.from]), pair = `${e.from}|${e.to}|${e.kind}`;
    return `<line class="edge k-${k.cls}" data-pair="${pair}" x1="${r1(a.x)}" y1="${r1(a.y)}" x2="${r1(b.x)}" y2="${r1(b.y)}"${k.cls !== "rel" ? ` marker-end="url(#arr-${k.cls})"` : ""}/>` +
      `<text class="elabel" data-pair="${pair}" x="${r1((a.x+b.x)/2)}" y="${r1((a.y+b.y)/2 - 5)}" text-anchor="middle">${k.out}</text>`;
  }).join("");
  const nodes = g.nodes.map(n => {
    const i = byKey(n.key), p = pos[n.key], t = i.title.length > 22 ? i.title.slice(0,21)+"…" : i.title;
    return `<g class="node ${n.key === center ? "center" : ""}" data-act="map-node" data-key="${n.key}" tabindex="0" role="button" aria-label="${n.key}: ${esc(i.title)}, ${i.status}" transform="translate(${r1(p.x-NW/2)},${r1(p.y-NH/2)})">` +
      `<rect width="${NW}" height="${NH}" rx="9"/><circle cx="14" cy="17" r="4.5" class="nd-${STATUS_GROUP[i.status]}"/>` +
      `<text x="25" y="21" class="nkey">${n.key} · ${i.status}</text><text x="12" y="40" class="ntitle">${esc(t)}</text></g>`;
  }).join("");
  return `<svg viewBox="${r1(x0)} ${r1(y0)} ${r1(x1-x0)} ${r1(y1-y0)}" role="img" aria-label="Relation map"><defs>${marks}</defs>${edges}${nodes}</svg>`;
}
function chainText(k){
  const c = MAP && MAP.center;
  if(!c) return "";
  if(k === c) return `<b class="mono">${c}</b> is the starting issue.`;
  const steps = []; let cur = k;
  while(cur !== c){ const p = MAP.g.prev[cur]; steps.unshift({from:p.via, rel:p.rel, to:cur}); cur = p.via; }
  return steps.map((st, ix) => `${ix === 0 ? `<b class="mono">${st.from}</b> ` : ", which "}${relPhrase(st.rel, st.from)} <b class="mono">${st.to}</b>`).join("") + ".";
}
function mapBody(center){
  const g = buildGraph(center, S.mapDepth, S.mapKinds), pos = layout(g, center);
  MAP = {g, center, pos};
  const ctl = `<div class="map-ctl">
    ${center ? `<span class="muted">How far:</span><div class="seg" role="group" aria-label="How many steps">${[1,2,3,"all"].map(d => `<button type="button" aria-pressed="${S.mapDepth === d}" data-act="map-depth" data-d="${d}">${d === "all" ? "Everything" : d + (d === 1 ? " step" : " steps")}</button>`).join("")}</div>` : ""}
    <span class="muted">Follow:</span>${Object.entries(RELATION_KINDS).map(([k,v]) => `<button type="button" class="chip kind-chip" aria-pressed="${S.mapKinds.has(k)}" data-act="map-kind" data-k="${k}"><span class="sw k-${v.cls}"></span><span class="lbl">${v.label}</span></button>`).join("")}
    <button type="button" class="btn sm" data-act="map-list">${S.mapList ? ico("i-map")+"Show as map" : ico("i-list")+"Show as list"}</button></div>`;
  let inner;
  if(S.mapList){
    if(center){
      const byDepth = {}; g.nodes.filter(n => n.depth > 0).forEach(n => (byDepth[n.depth] ||= []).push(n.key));
      inner = `<div class="chains">${Object.keys(byDepth).map(d => `<section><h4>${d} step${d === "1" ? "" : "s"} away</h4><ul>${byDepth[d].map(k => `<li>${chainText(k)} <button type="button" class="btn sm ghost" data-act="open" data-key="${k}">Open</button></li>`).join("")}</ul></section>`).join("") || `<p class="muted">No related issues with these settings.</p>`}</div>`;
    } else {
      inner = `<ul class="chains">${g.edges.map(e => `<li><b class="mono">${e.from}</b> ${RELATION_KINDS[e.kind].out} <b class="mono">${e.to}</b></li>`).join("") || `<li class="muted">These issues have no relations to each other.</li>`}</ul>`;
    }
  } else {
    inner = `<div class="map-canvas">${renderMapSvg(g, pos, center)}</div>
      <p class="map-info" id="map-info" aria-live="polite">${center ? `Point at an issue to see how it connects to <b class="mono">${center}</b>. Click an issue to move it to the middle.` : "Point at an issue to see its relations. Click it to open it."}</p>`;
  }
  return `<div class="map-wrap">${ctl}${inner}<p class="subtle" style="font-size:var(--fs-xs);margin:0">Only issues you're allowed to see are shown. Chains never pass through issues you can't see.</p></div>`;
}
function renderMapScreen(){
  const c = byKey(S.mapCenter);
  return topbar(`<span class="hide-phone">Website issues ›</span><b>Relation map</b>`) + `<div class="content flush">
    <div class="map-head"><button type="button" class="btn sm" data-act="map-back">${ico("i-back")}Back to issues</button>
      <span>Everything connected to ${typeTag(c,false)} <b class="key">${c.key}</b> ${esc(c.title)}</span></div>
    ${mapBody(c.key)}</div>`;

function attachMap(){
  const cv = document.querySelector(".map-canvas");
  if(!cv || !MAP) return;
  cv.querySelectorAll(".node").forEach(n => {
    const on = () => {
      const keys = new Set([n.dataset.key]), pairs = new Set();
      if(MAP.center){
        let cur = n.dataset.key;
        while(cur !== MAP.center && MAP.g.prev[cur]){ const p = MAP.g.prev[cur]; pairs.add(`${p.rel.from}|${p.rel.to}|${p.rel.kind}`); keys.add(p.via); cur = p.via; }
      } else {
        MAP.g.edges.forEach(e => { if(e.from === n.dataset.key || e.to === n.dataset.key){ pairs.add(`${e.from}|${e.to}|${e.kind}`); keys.add(e.from); keys.add(e.to); } });
      }
      cv.classList.add("hl-on");
      cv.querySelectorAll(".node").forEach(x => x.classList.toggle("hl", keys.has(x.dataset.key)));
      cv.querySelectorAll("[data-pair]").forEach(x => x.classList.toggle("hl", pairs.has(x.dataset.pair)));
      const info = $("#map-info");
      if(info && MAP.center) info.innerHTML = chainText(n.dataset.key);
    };
    const off = () => { cv.classList.remove("hl-on"); cv.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")); };
    n.addEventListener("mouseenter", on); n.addEventListener("mouseleave", off);
    n.addEventListener("focus", on); n.addEventListener("blur", off);
  });
}

/* ============ calendar ============ */
const CAL0 = Date.parse("2026-09-28");
const calDate = d => new Date(CAL0 + d*864e5);
function renderCalendar(list){
  const by = {};
  list.filter(i => i.end).forEach(i => { const d = Math.round((Date.parse(i.end)-CAL0)/864e5); if(d >= 0 && d < 35) (by[d] ||= []).push(i); });
  const cells = Array.from({length:35}, (_, d) => {
    const dt = calDate(d), n = dt.getUTCDate(), other = dt.getUTCMonth() !== 9;
    return `<div class="cal-d ${other ? "other" : ""} ${d === TODAY ? "today" : ""}" data-day="${d}"><span class="n">${n === 1 || d === 0 ? dt.toLocaleDateString("en",{month:"short",timeZone:"UTC"}) + " " : ""}${n}</span>` +
      (by[d] || []).map(i => `<button type="button" class="cal-i st-${STATUS_GROUP[i.status]}" draggable="true" data-cdrag="${i.key}" data-act="open" data-key="${i.key}" title="${i.key}: ${esc(i.title)}">${i.key} ${esc(i.title)}</button>`).join("") + `</div>`;
  }).join("");
  const agenda = Object.keys(by).map(Number).sort((a,b) => a-b).map(d =>
    `<div class="tl-day">${calDate(d).toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric",timeZone:"UTC"})}${d === TODAY ? " · today" : ""}</div>` +
    by[d].map(i => `<button type="button" class="lrow" data-act="open" data-key="${i.key}" style="border:1px solid var(--border);border-radius:var(--r-card);padding:10px 12px;background:var(--bg-raised)"><span style="min-width:0;flex:1"><span class="t">${esc(i.title)}</span><span class="m">${typeTag(i,false)}<span class="key">${i.key}</span>${statusPill(i,false)}</span></span></button>`).join("")).join("");
  const noDate = list.filter(i => !i.end).length;
  return `<div class="cal-wrap"><div class="cal-top"><b style="font-size:var(--fs-md)">October 2026</b><span class="muted" style="font-size:var(--fs-sm)">Issues on their due date. Drag one to another day to change it, or open it and use “Change due date”.</span></div>
    <div class="cal" role="grid" aria-label="October 2026">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x => `<div class="cal-h">${x}</div>`).join("")}${cells}</div>
    <div class="cal-agenda">${agenda}</div>
    ${noDate ? `<p class="muted" style="font-size:var(--fs-sm);margin:0">${noDate} issue${noDate === 1 ? " has" : "s have"} no due date and ${noDate === 1 ? "isn't" : "aren't"} shown.</p>` : ""}</div>`;
}

/* ============ board drag & drop ============ */
function attachDrag(){
  document.querySelectorAll("[data-cdrag]").forEach(b => b.addEventListener("dragstart", e => e.dataTransfer.setData("text/cal", b.dataset.cdrag)));
  document.querySelectorAll(".cal-d").forEach(c => {
    c.addEventListener("dragover", e => { e.preventDefault(); c.classList.add("drop-ok"); });
    c.addEventListener("dragleave", () => c.classList.remove("drop-ok"));
    c.addEventListener("drop", e => {
      e.preventDefault(); c.classList.remove("drop-ok");
      const k = e.dataTransfer.getData("text/cal"); if(!k) return;
      const i = byKey(k), old = [i.end, i.due], dt = calDate(+c.dataset.day);
      i.end = dt.toISOString().slice(0,10); i.due = dt.toLocaleDateString("en",{month:"short",day:"numeric",timeZone:"UTC"});
      render(); toast(`${k} is now due ${i.due}.`, () => { [i.end, i.due] = old; });
    });
  });

  document.querySelectorAll("[data-drag]").forEach(card => {
    card.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", card.dataset.drag);
      const from = byKey(card.dataset.drag).status;
      document.querySelectorAll(".col").forEach(c => {
        const ok = MOVES[from].some(([t]) => t === c.dataset.col);
        c.classList.toggle("drop-ok", ok); c.classList.toggle("drop-no", !ok && c.dataset.col !== from);
      });
    });
    card.addEventListener("dragend", () => document.querySelectorAll(".col").forEach(c => c.classList.remove("drop-ok","drop-no")));
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => e.preventDefault());
    col.addEventListener("drop", e => { e.preventDefault(); const k = e.dataTransfer.getData("text/plain"); if(byKey(k).status !== col.dataset.col) moveIssue(k, col.dataset.col); });
  });
}

    case "wd-break": S.workday.onBreak = true; S.workday.breakAt = Date.now(); closePop(); render(); toast("Break started. Enjoy it."); break;
    case "wd-break-end": S.workday.brk += Math.max(1, Math.round((Date.now()-S.workday.breakAt)/60000)); S.workday.onBreak = false; closePop(); render(); toast("Break ended."); break;
    case "wd-end": { const w = S.workday; closePop(); S.workday = null; if(S.timer){ toast("Stop your issue timer too — it's still running."); } render(); toast(`Work day ended: ${wdElapsedOf(w)} worked.`, () => { S.workday = w; }); break; }
    case "desc-edit": S.editing = key; S.draft = null; S.saveState = "editing"; renderPanel(); $("#desc-edit")?.focus(); break;
    case "desc-done": { const v = $("#desc-edit")?.value; if(v != null) DESCS[key] = v; S.editing = null; S.saveState = null; renderPanel(); toast("Description saved."); break; }
    case "lock-ask": toast(`${LOCKS[key].who} got a note: “Ana would like to edit the description.”`); break;
    case "lock-take": { const who = LOCKS[key].who; delete LOCKS[key]; S.editing = key; S.draft = null; S.saveState = "editing"; renderPanel(); toast(`You're editing now. ${who} was told, and their unsaved text is kept as their draft.`); break; }
    case "lock-lose": S.draft = $("#desc-edit")?.value; S.saveState = "lost"; renderPanel(); break;
    case "lock-compare": openDialog(`<div class="dialog-h"><h2>Compare and save</h2></div><div class="dialog-b">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
          <div><div class="section-h">Ben's newer version</div><div class="desc" style="white-space:pre-wrap;border:1px solid var(--border);border-radius:var(--r-ctl);padding:8px">${esc((DESCS[S.open] ?? defaultDesc(byKey(S.open))) + "\n\nUpdate: also happens with passkeys.")}</div></div>
          <div><div class="section-h">Your text</div><div class="desc" style="white-space:pre-wrap;border:1px solid var(--accent);border-radius:var(--r-ctl);padding:8px">${esc(S.draft ?? "")}</div></div></div></div>
        <div class="dialog-f"><button type="button" class="btn" data-act="cmp-theirs">Keep Ben's</button><button type="button" class="btn primary" data-act="cmp-mine">Use mine</button></div>`); break;
    case "cmp-mine": DESCS[S.open] = S.draft; S.editing = null; S.saveState = null; closeDialog(); renderPanel(); toast("Your text was saved. Ben's version stays in the history."); break;
    case "cmp-theirs": DESCS[S.open] = (DESCS[S.open] ?? defaultDesc(byKey(S.open))) + "\n\nUpdate: also happens with passkeys."; S.editing = null; S.saveState = null; closeDialog(); renderPanel(); toast("Kept Ben's version. Your text is still in your drafts."); break;
    case "layout": S.issueLayout = el.dataset.l; try{ localStorage.setItem("bugaboo-issue-layout", S.issueLayout); }catch(e){} render(); toast(S.issueLayout === "focus" ? "Focus view: the issue gets most of the screen. Change it any time in My settings › Appearance." : "Side panel view: the list stays visible next to the issue."); break;
    case "rail": S.railOpen = !S.railOpen; render(); break;
    case "fx-details": S.detailsOpen = !S.detailsOpen; render(); break;
    case "viewas": S.viewAs = el.dataset.v || null; render(); toast(S.viewAs ? "You're seeing Bugaboo as a Guest. Nothing can be changed in this view." : "Back to your own view."); break;
    case "idmode": S.idMode = el.dataset.m; render(); toast(S.idMode === "random" ? "New issues in Website get random IDs like WEB-K7Q2X. Existing IDs keep working." : "New issues in Website get counting IDs like WEB-149. Existing IDs keep working."); break;
    case "form-edit": formEditor(); break;
    case "add-field": { const role = viewerRole();
      const opts = [["Platforms","Team member,Contributor"],["Customer","Team member,Contributor"],["Found in release","Team member,Contributor,Guest"],["Due date","Team member"],["Time left","Team member"]].filter(([,r]) => r.split(",").includes(role));
      openPop(el, `<div class="pop-h">Add a field</div>` + opts.map(([f]) => `<button type="button" class="pop-item" data-act="toast" data-msg="${f} added to ${key}.">${f}</button>`).join("") + `<div class="pop-note">Only fields your role (${role}) may fill in are listed.</div>`); break; }
    case "more": openPop(el, `<div class="pop-h">More</div>
      <button type="button" class="pop-item" data-act="go" data-screen="saved">${ico("i-bookmark")}Saved searches</button>
      <button type="button" class="pop-item" data-act="go" data-screen="time">${ico("i-clock")}Time</button>
      <button type="button" class="pop-item" data-act="go" data-screen="docs">${ico("i-file")}Documents</button>
      <button type="button" class="pop-item" data-act="go" data-screen="settings">${ico("i-settings")}Settings</button>
      <button type="button" class="pop-item" data-act="go" data-screen="settings" data-tab="look">${ico("i-palette")}Theme</button>
      ${S.timer?`<button type="button" class="pop-item" data-act="timer-stop">${ico("i-stop")}Stop timer (${S.timer.key})</button>`:""}`); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-act-change]"); if(!el) return;
  const a = el.dataset.actChange;
  if(a === "look"){ S.look = el.value; persistLook(); applyLook(); render(); }
  if(a === "select"){ el.checked ? S.selected.add(el.dataset.key) : S.selected.delete(el.dataset.key); render(); }
  if(a === "title"){ const i = byKey(el.dataset.key), old = i.title; i.title = el.value.trim() || old; render(); toast("Title saved.", () => { i.title = old; }); }
  if(a === "perm"){ el.className = el.value; toast(`Saved. ${el.getAttribute("aria-label")}: ${el.options[el.selectedIndex].text}.`); }
  if(a === "ni-type"){ const box = $("#ni-fields"); if(box) box.innerHTML = newIssueFields(el.value); }
  if(a === "form-role"){ const f = NEW_FORM.find(x => x.id === el.dataset.f); if(f){ f.roles = el.checked ? [...new Set([...f.roles, el.dataset.r])] : f.roles.filter(r => r !== el.dataset.r); } }
  if(a === "ts-act"){ timesheet[+el.dataset.r].act = el.value; toast(`Activity set to ${el.value}.`); }
  if(a === "ts-cc"){ timesheet[+el.dataset.r].cc = el.value; toast(`Cost center set to ${el.options[el.selectedIndex].text}.`); }
  if(a === "wd"){
    const d = +el.dataset.d, k = el.dataset.k, v = el.value.trim();
    const m = v.match(/^(\d{1,2})[:.](\d{2})$/) ? (+v.split(/[:.]/)[0])*60 + (+v.split(/[:.]/)[1]) : (/^\d+$/.test(v) && k === "brk" ? +v : null);
    if(v && m == null){ el.classList.add("bad"); toast("Use a time like 8:05, or minutes like 30 for a break."); return; }
    const old = workdays[d] ? {...workdays[d]} : null;
    const w = workdays[d] || {start:480, end:960, brk:0};
    w[k] = v ? m : (k === "brk" ? 0 : w[k]);
    workdays[d] = w;
    if(d < 6){ render(); toast("Past work day changed. In Bugaboo you'd be asked for a reason, and the old value stays in the history.", () => { workdays[d] = old; }); }
    else render();
  }
  if(a === "ts"){
    const v = el.value.trim().toLowerCase(); let m = 0, ok = true;
    if(!v) m = 0;
    else if(/^\d+:\d{1,2}$/.test(v)){ const [h,mm] = v.split(":").map(Number); m = h*60+mm; }
    else if(/^\d+\s*m(in)?$/.test(v)) m = parseInt(v,10);
    else if(/^\d+([.,]\d+)?\s*h?$/.test(v)) m = Math.round(parseFloat(v.replace(",","."))*60);
    else ok = false;
    if(!ok){ el.classList.add("bad"); toast("Use a time like 1:30, 1.5 or 90m."); return; }
    timesheet[+el.dataset.r].m[+el.dataset.d] = m; render();
  }
});

function runAdvanced(){
  const r = parse($("#adv").value);
  S.advText = $("#adv").value;
  if(r.error){ S.advErr = r.error; render(); $("#adv").focus(); return; }
  S.advErr = ""; S.filters = r.filters.some(c => c.f === "project") ? r.filters : [{f:"project",op:"within",v:"WEB"}, ...r.filters]; S.sort = r.sort; render();
  toast("Search updated. Switch to Simple to see it as filter buttons.");
}

document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if(e.key === "Enter" && e.target.matches?.("[data-act]:not(button):not(input):not(textarea):not(select)")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); return; }
  if(e.key === "Escape"){ if($("#pop")) closePop(); else if($("#overlay").innerHTML) closeDialog(); else if(S.panelMode==="assistant"){ S.panelMode="issue"; render(); } else if(S.open){ S.open=null; render(); } return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); quickSearch(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "j"){ e.preventDefault(); S.panelMode = S.panelMode==="assistant"?"issue":"assistant"; render(); return; }
  if(e.target.id === "adv" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); runAdvanced(); return; }
  if(e.target.id === "ask" && e.key === "Enter"){ e.preventDefault(); $('[data-act="ask-run"]').click(); return; }
  if(e.target.id === "qs" && e.key === "Enter"){ e.preventDefault(); $("#qs-res .pop-item")?.click(); return; }
  if(typing) return;
  if(e.key === "c"){ e.preventDefault(); newIssue(); }
  if(e.key === "/" && S.screen === "issues"){ e.preventDefault(); $('[data-act="chip-add"]')?.focus(); }
  if((e.key === "j" || e.key === "k") && S.screen === "issues" && S.show === "list"){
    const l = visibleIssues(); if(!l.length) return;
    let ix = l.findIndex(i => i.key === S.open); ix = e.key === "j" ? Math.min(l.length-1, ix+1) : Math.max(0, ix-1);
    S.open = l[ix].key; S.panelMode = "issue"; render();
  }
});


document.addEventListener("input", e => {
  if(e.target.id !== "desc-edit" || S.saveState === "lost") return;
  S.draft = e.target.value; S.saveState = "saving";
  const st = $("#savestate"); if(st) st.innerHTML = saveStateHtml();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if(S.saveState !== "saving") return; DESCS[S.editing] = S.draft; S.saveState = "saved"; const el = $("#savestate"); if(el) el.innerHTML = saveStateHtml(); }, 900);
});
document.addEventListener("submit", e => {
  if(e.target.dataset.form === "ai"){ e.preventDefault(); const q = $("#ai-q").value.trim(); if(!q) return;
    const box = $("#panel .panel-b");
    box.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div><div><div class="ai-label">${ico("i-spark")}Assistant</div><div class="msg ai">This mockup only shows example answers. In Bugaboo the assistant would answer using only what you're allowed to see.</div></div>`);
    $("#ai-q").value = ""; box.scrollTop = box.scrollHeight; }
});

setInterval(() => { const wde = $("#wd-sidebar"); if(wde) wde.textContent = wdElapsed(); }, 15000);
setInterval(() => { const t = elapsed(); ["#timer-sidebar","#timer-home"].forEach(s => { const el = $(s); if(el) el.textContent = t; }); }, 1000);
addEventListener("resize", (() => { let w = narrow(); return () => { if(narrow() !== w){ w = narrow(); render(); } }; })());

applyLook();
try{ const l = localStorage.getItem("bugaboo-issue-layout"); if(l) S.issueLayout = l; }catch(e){}
S.open = narrow() ? null : "WEB-142";
render();
</script>
