    <rect class="tile" x="482" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="517.5" y="98" text-anchor="middle">M6</text>
    <text class="count" x="517.5" y="121" text-anchor="middle">10</text>
  </g>
  <g class="later" data-milestone="M7" data-features="14">
    <title>M7: Timeline and theme editor, 14 features</title>
    <rect class="tile" x="561" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="596.5" y="98" text-anchor="middle">M7</text>
    <text class="count" x="596.5" y="121" text-anchor="middle">14</text>
  </g>
  <g class="later" data-milestone="M8" data-features="24">
    <title>M8: Assistant, AI apps and agents, 24 features</title>
    <rect class="tile" x="640" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="675.5" y="98" text-anchor="middle">M8</text>
    <text class="count" x="675.5" y="121" text-anchor="middle">24</text>
  </g>
  <g class="later" data-milestone="M9" data-features="14">
    <title>M9: Privacy, operations and the first release, 14 features</title>
    <rect class="tile" x="719" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="754.5" y="98" text-anchor="middle">M9</text>
    <text class="count" x="754.5" y="121" text-anchor="middle">14</text>
  </g>
  <g class="later" data-milestone="M10" data-features="10">
    <title>M10: Board, calendar, relation map and dashboards, 10 features</title>
    <rect class="tile" x="798" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="833.5" y="98" text-anchor="middle">M10</text>
    <text class="count" x="833.5" y="121" text-anchor="middle">10</text>
  </g>
  <g class="later" data-milestone="M11" data-features="11">
    <title>M11: Documents, 11 features</title>
    <rect class="tile" x="877" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="912.5" y="98" text-anchor="middle">M11</text>
    <text class="count" x="912.5" y="121" text-anchor="middle">11</text>
  </g>
  <g class="later" data-milestone="M12" data-features="16">
    <title>M12: Teams, integrations and AI 1.0, 16 features</title>
    <rect class="tile" x="956" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="991.5" y="98" text-anchor="middle">M12</text>
    <text class="count" x="991.5" y="121" text-anchor="middle">16</text>
  </g>
  <g class="later" data-milestone="M13" data-features="15">
    <title>M13: Admin power tools, 15 features</title>
    <rect class="tile" x="1035" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="1070.5" y="98" text-anchor="middle">M13</text>
    <text class="count" x="1070.5" y="121" text-anchor="middle">15</text>
  </g>
  <g class="later" data-milestone="M14" data-features="15">
    <title>M14: Sold and served, 15 features</title>
    <rect class="tile" x="1114" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="1149.5" y="98" text-anchor="middle">M14</text>
    <text class="count" x="1149.5" y="121" text-anchor="middle">15</text>
  </g>
  <g class="later" data-milestone="M15" data-features="2">
    <title>M15: Live updates and 1.0, 2 features</title>
    <rect class="tile" x="1193" y="70" width="71" height="64" rx="12"/>
    <text class="code" x="1228.5" y="98" text-anchor="middle">M15</text>
    <text class="count" x="1228.5" y="121" text-anchor="middle">2</text>
  </g>
  <line class="flag-line" x1="475" y1="48" x2="475" y2="68"/>
  <text class="flag" x="475" y="38" text-anchor="middle">Now: 0.3.0</text>
  <line class="flag-line" x1="1193" y1="48" x2="1193" y2="68"/>
  <text class="flag" x="1193" y="38" text-anchor="end">0.9.0: every feature is built</text>
  <rect class="track" x="4" y="152" width="1272" height="14" rx="7"/>
  <rect class="bar" x="4" y="152" width="542.7" height="14" rx="7"/>
  <text class="legend" x="8" y="196">Tiles: milestones with the number of features each brings. Filled: done. Outlined: next.</text>
  <text class="legend" x="1272" y="196" text-anchor="end">1.0.0 follows M15</text>
</svg>