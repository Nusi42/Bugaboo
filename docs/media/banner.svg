<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Bugaboo</title>
  <desc id="desc">The name Bugaboo, a self-hosted issue tracker and project management for teams of people and AI agents, next to what it does: issues that follow your own workflow from Not started through In progress to Done, and, planned, Gantt charts and AI agents that share its memory, all built for the GDPR. A bug sits beside the workflow; a person works on the issue while it is In progress, an agent with its agent mark takes it to Done, and with both of them there the bug is shooed away with a boo, once.</desc>
  <style>
    /* The colors are the values of the tokens of the default themes (Daylight and Dusk) in design/theme.kdl,
       under the names of the tokens; a test (web/tooling/banner.test.ts) keeps them the same. */
    :root {
      --bg-canvas: #ffffff;
      --bg-surface: #f6f7f9;
      --bg-raised: #ffffff;
      --border: #dfe3e9;
      --fg: #16181d;
      --fg-muted: #565d6b;
      --accent: #5b3fd9;
      --accent-soft: #eeeafd;
      --st-ns: #565d6b;
      --st-ip: #1d5fd1;
      --st-done: #1f784c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #1d2027;
        --bg-surface: #252932;
        --bg-raised: #2d323c;
        --border: #3b414d;
        --fg: #e5e8ed;
        --fg-muted: #aeb5c1;
        --accent: #a495ff;
        --accent-soft: #37325a;
        --st-ns: #aeb5c1;
        --st-ip: #7fb0ff;
        --st-done: #6fd39a;
      }
    }
    text { font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .canvas { fill: var(--bg-surface); }
    .glow { fill: var(--accent-soft); }
    .name { fill: var(--fg); font-size: 92px; font-weight: 700; letter-spacing: -2px; }
    .name tspan { fill: var(--accent); }
    .line { fill: var(--fg-muted); font-size: 21px; }
    .note { fill: var(--fg-muted); font-size: 18px; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 170; stroke-dashoffset: 55; transform: rotate(-90deg); transform-origin: 80px 264px; }
    .ring-track { fill: none; stroke: var(--border); stroke-width: 6; }

    /* The tiles of what Bugaboo does: a title, a short line under it, and a small drawing. */
    .tile { fill: var(--bg-raised); stroke: var(--border); stroke-width: 2; }
    .tile-title { fill: var(--fg); font-size: 19px; font-weight: 600; }
    .tile-line { fill: var(--fg-muted); font-size: 14px; }
    .pill { fill: var(--bg-surface); stroke: var(--border); stroke-width: 1.5; }
    .pill-text { fill: var(--fg); font-size: 15px; }
    .here { fill: none; stroke: var(--accent); stroke-width: 3; }
    .step { fill: none; stroke: var(--fg-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: none; stroke-width: 3; }
    .ns .dot { stroke: var(--st-ns); stroke-dasharray: 3 3; }
    .ip .dot { stroke: var(--st-ip); }
    .ip .fill { fill: var(--st-ip); }
    .done .dot { stroke: var(--st-done); }
    .done .fill { fill: var(--st-done); }
    .bar-ip { fill: var(--st-ip); }
    .bar-accent { fill: var(--accent); }
    .bar-done { fill: var(--st-done); }
    .axis { stroke: var(--border); stroke-width: 2; }
    .memo { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .memo-line { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
    .spark { fill: var(--accent); }
    .shield { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
    .check { fill: none; stroke: var(--st-done); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Who works on the issue: a person's round face with initials, as in the app, and an agent's face
       with its agent mark, the spark of the AI agents tile. */
    .face { fill: var(--accent-soft); stroke: var(--bg-raised); stroke-width: 3; }
    .face-agent { fill: var(--bg-raised); stroke: var(--accent); stroke-width: 2; }
    .initials { fill: var(--accent); font-size: 13px; font-weight: 600; }
    .agent-mark { fill: var(--accent); stroke: var(--bg-raised); stroke-width: 1.5; stroke-linejoin: round; }

    .bug-body, .bug-head { fill: var(--accent); }
    .bug-spot { fill: var(--bg-raised); }
    .bug-leg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
    .boo-bubble { fill: var(--accent); }
    .boo-text { fill: var(--bg-raised); font-size: 30px; font-weight: 700; }

    /* One calm sequence that plays once and then rests. The tiles come in; a bug walks onto the
       workflow; the issue moves from Not started through In progress to Done, a person turns up
       on In progress and an agent on Done; at Done a big "Boo!" pops up and the bug scurries off the card. Nothing blinks and no color changes: only
       places, sizes and opacity move. */
    .tiles > g { animation: arrive 900ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
    .tiles > g:nth-of-type(2) { animation-delay: 250ms; }
    .tiles > g:nth-of-type(3) { animation-delay: 400ms; }
    .tiles > g:nth-of-type(4) { animation-delay: 550ms; }
    .walk { animation: walk 2200ms 1000ms cubic-bezier(0.3, 0.6, 0.4, 1) both; }
    .legs { animation: legs 275ms 1000ms 8 ease-in-out both; transform-origin: 0 0; }
    .here { animation: advance 2400ms 3400ms ease-in-out both; }
    .done .fill { animation: fill 500ms 5600ms ease-out both; transform-origin: 966px 104px; }
    .who { animation: fill 500ms 4300ms ease-out both; transform-origin: 892px 124px; }
    .who-agent { animation-delay: 5400ms; transform-origin: 1070px 124px; }
    .bug { animation: shoo 1400ms 6300ms cubic-bezier(0.5, 0, 0.8, 0.6) both; }
    .boo { animation: boo 3200ms 5900ms ease-out both; transform-origin: 1150px 82px; }

    @keyframes arrive { from { opacity: 0; transform: translateY(16px); } }
    @keyframes walk { from { transform: translateX(170px); } to { transform: translateX(0); } }
    @keyframes legs { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }
    @keyframes advance { 0%, 15% { transform: translateX(0); } 40%, 65% { transform: translateX(180px); } 90%, 100% { transform: translateX(360px); } }
    @keyframes fill { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
    @keyframes shoo { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 15% { transform: translate(-6px, 4px) rotate(-8deg); opacity: 1; } 100% { transform: translate(190px, -110px) rotate(40deg); opacity: 0; } }
    @keyframes boo { 0% { opacity: 0; transform: scale(0.4); } 12% { opacity: 1; transform: scale(1.12); } 20%, 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .tiles > g, .walk, .legs, .here, .done .fill, .who, .bug, .boo { animation: none; }
      .boo { opacity: 0; }
      .here { transform: translateX(360px); }
    }
  </style>

  <rect class="canvas" width="1280" height="320" rx="24"/>
  <circle class="glow" cx="1180" cy="20" r="150"/>

  <text class="name" x="64" y="114">Bug<tspan>aboo</tspan></text>
  <text class="line" x="68" y="156">A self-hosted issue tracker and</text>
  <text class="line" x="68" y="182">project management for teams</text>
  <text class="line" x="68" y="208">of people and AI agents.</text>
  <circle class="ring-track" cx="80" cy="264" r="27"/>
  <circle class="ring" cx="80" cy="264" r="27"/>
  <text class="note" x="126" y="262">Time and working hours come next.</text>
  <text class="note" x="126" y="286">Under development, before version 1.0.</text>

  <g class="tiles">
    <g>
      <rect class="tile" x="560" y="28" width="672" height="120" rx="16"/>
      <text class="tile-title" x="584" y="64">Issues and your own workflows</text>
      <g class="ns">
        <rect class="pill" x="584" y="86" width="140" height="36" rx="18"/>
        <circle class="dot" cx="606" cy="104" r="7"/>
        <text class="pill-text" x="622" y="109">Not started</text>
      </g>
      <path class="step" d="M732 104h22m-6-5 6 5-6 5"/>
      <g class="ip">
        <rect class="pill" x="764" y="86" width="140" height="36" rx="18"/>
        <circle class="dot" cx="786" cy="104" r="7"/>
        <path class="fill" d="M786 98a6 6 0 0 1 0 12z"/>
        <text class="pill-text" x="802" y="109">In progress</text>
      </g>
      <path class="step" d="M912 104h22m-6-5 6 5-6 5"/>
      <g class="done">
        <rect class="pill" x="944" y="86" width="140" height="36" rx="18"/>
        <circle class="dot" cx="966" cy="104" r="7"/>
        <circle class="fill" cx="966" cy="104" r="4"/>
        <text class="pill-text" x="982" y="109">Done</text>
      </g>
      <rect class="here" x="581" y="83" width="146" height="42" rx="21"/>
      <g class="who">
        <circle class="face" cx="892" cy="124" r="16"/>
        <text class="initials" x="892" y="129" text-anchor="middle">AB</text>
      </g>
      <g class="who who-agent">
        <circle class="face face-agent" cx="1070" cy="124" r="15"/>
        <text class="initials" x="1070" y="129" text-anchor="middle">F</text>
        <path class="agent-mark" d="M1084 101q1.6 7.4 9 9-7.4 1.6-9 9-1.6-7.4-9-9 7.4-1.6 9-9z"/>
      </g>
      <g transform="translate(1150 104)">
        <g class="walk">
          <g class="bug">
            <path class="legs bug-leg" d="M-13-6-25-13M-14 3-27 4M-13 12-23 21M13-6 25-13M14 3 27 4M13 12 23 21M-5-19-10-29M5-19 10-29"/>
            <ellipse class="bug-body" cx="0" cy="3" rx="14" ry="18"/>
            <circle class="bug-head" cx="0" cy="-17" r="8"/>
            <circle class="bug-spot" cx="-5.5" cy="0" r="3.2"/>
            <circle class="bug-spot" cx="5.5" cy="0" r="3.2"/>
            <circle class="bug-spot" cx="0" cy="11" r="2.6"/>
          </g>
        </g>
      </g>
      <g class="boo">
        <rect class="boo-bubble" x="1086" y="36" width="128" height="50" rx="25"/>
        <path class="boo-bubble" d="M1128 84h18l-12 12z"/>
        <text class="boo-text" x="1150" y="71" text-anchor="middle">Boo!</text>
      </g>
    </g>
    <g>
      <rect class="tile" x="560" y="164" width="214" height="128" rx="16"/>
      <line class="axis" x1="580" y1="228" x2="644" y2="228"/>
      <rect class="bar-ip" x="580" y="184" width="28" height="10" rx="5"/>
      <rect class="bar-accent" x="598" y="199" width="32" height="10" rx="5"/>
      <rect class="bar-done" x="618" y="214" width="26" height="10" rx="5"/>
      <text class="tile-title" x="580" y="262">Gantt charts</text>
      <text class="tile-line" x="580" y="282">Planned: plans on a timeline</text>
    </g>
    <g>
      <rect class="tile" x="789" y="164" width="214" height="128" rx="16"/>
      <rect class="memo" x="809" y="186" width="38" height="44" rx="6"/>
      <path class="memo-line" d="M817 200h22M817 210h22M817 220h14"/>
      <path class="spark" d="M855 178q2 9 11 11-9 2-11 11-2-9-11-11 9-2 11-11z"/>
      <text class="tile-title" x="809" y="262">AI agents</text>
      <text class="tile-line" x="809" y="282">Planned: shared memory</text>
    </g>
    <g>
      <rect class="tile" x="1018" y="164" width="214" height="128" rx="16"/>
      <path class="shield" d="M1058 182l20 7v15c0 13-9 21-20 25-11-4-20-12-20-25v-15z"/>
      <path class="check" d="M1049 206l7 7 12-13"/>
      <text class="tile-title" x="1038" y="262">Built for the GDPR</text>
      <text class="tile-line" x="1038" y="282">On your own server</text>
    </g>
  </g>
</svg>
