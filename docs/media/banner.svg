<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Bugaboo</title>
  <desc id="desc">The name Bugaboo, a self-hosted issue tracker, next to three issues of a made-up bicycle workshop: one done, one in progress, one not started. A small bug sits on the last row and is shooed away with a boo, once.</desc>
  <style>
    /* The colors are the values of the tokens of the default themes (Daylight and Dusk) in design/theme.kdl,
       under the names of the tokens; a test (web/tooling/banner.test.ts) keeps them the same. */
    :root {
      --bg-canvas: #ffffff;
      --bg-surface: #f6f7f9;
      --bg-raised: #ffffff;
      --border: #dfe3e9;
      --fg: #16181d;
      --fg-muted: #565d6b;
      --accent: #5b3fd9;
      --accent-soft: #eeeafd;
      --st-ns: #565d6b;
      --st-ip: #1d5fd1;
      --st-done: #1f784c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #1d2027;
        --bg-surface: #252932;
        --bg-raised: #2d323c;
        --border: #3b414d;
        --fg: #e5e8ed;
        --fg-muted: #aeb5c1;
        --accent: #a495ff;
        --accent-soft: #37325a;
        --st-ns: #aeb5c1;
        --st-ip: #7fb0ff;
        --st-done: #6fd39a;
      }
    }
    text { font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .canvas { fill: var(--bg-surface); }
    .glow { fill: var(--accent-soft); }
    .name { fill: var(--fg); font-size: 92px; font-weight: 700; letter-spacing: -2px; }
    .name tspan { fill: var(--accent); }
    .line { fill: var(--fg-muted); font-size: 26px; }
    .note { fill: var(--fg-muted); font-size: 18px; }
    .card { fill: var(--bg-raised); stroke: var(--border); stroke-width: 2; }
    .title { fill: var(--fg); font-size: 22px; }
    .chip { fill: var(--accent-soft); }
    .chip-text { fill: var(--accent); font-size: 15px; font-weight: 600; }
    .dot { fill: none; stroke-width: 4; }
    .done .dot { stroke: var(--st-done); }
    .progress .dot { stroke: var(--st-ip); }
    .waiting .dot { stroke: var(--st-ns); }
    .fill { stroke: none; }
    .done .fill { fill: var(--st-done); }
    .progress .fill { fill: var(--st-ip); }
    .waiting .fill { fill: none; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 170; stroke-dashoffset: 55; transform: rotate(-90deg); transform-origin: 80px 258px; }
    .ring-track { fill: none; stroke: var(--border); stroke-width: 6; }

    .bug-body, .bug-head { fill: var(--accent); }
    .bug-spot { fill: var(--bg-raised); }
    .bug-leg { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
    .boo-bubble { fill: var(--accent); }
    .boo-text { fill: var(--bg-raised); font-size: 17px; font-weight: 700; }
    /* One calm sequence that plays once and then rests: the rows come in, the bug is shooed away
       with a boo, and nothing moves again. Nothing blinks and no color changes. */
    .row { animation: arrive 900ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
    .row:nth-of-type(1) { animation-delay: 150ms; }
    .row:nth-of-type(2) { animation-delay: 400ms; }
    .row:nth-of-type(3) { animation-delay: 650ms; }
    .bug { animation: shoo 1800ms 2400ms ease-in both; }
    .boo { animation: boo 2600ms 2200ms ease-out both; transform-origin: 1175px 298px; }

    @keyframes arrive { from { opacity: 0; transform: translateX(32px); } }
    @keyframes shoo { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(220px, -30px) rotate(40deg); opacity: 0; } }
    @keyframes boo { 0% { opacity: 0; transform: scale(0.6); } 20%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .row, .bug, .boo { animation: none; }
      .boo { opacity: 0; }
    }
  </style>

  <rect class="canvas" width="1280" height="320" rx="24"/>
  <circle class="glow" cx="1180" cy="40" r="170"/>

  <text class="name" x="64" y="140">Bug<tspan>aboo</tspan></text>
  <text class="line" x="68" y="186">A self-hosted issue tracker for teams.</text>
  <circle class="ring-track" cx="80" cy="258" r="27"/>
  <circle class="ring" cx="80" cy="258" r="27"/>
  <text class="note" x="126" y="256">Time and working hours, privacy first.</text>
  <text class="note" x="126" y="280">Under development, before version 1.0.</text>

  <g class="row done">
    <rect class="card" x="700" y="40" width="520" height="68" rx="14"/>
    <circle class="dot" cx="742" cy="74" r="12"/>
    <circle class="fill" cx="742" cy="74" r="6"/>
    <text class="title" x="772" y="82">Chain snapped on a hill climb</text>
    <rect class="chip" x="1128" y="58" width="72" height="32" rx="16"/>
    <text class="chip-text" x="1164" y="79" text-anchor="middle">Gears</text>
  </g>
  <g class="row progress">
    <rect class="card" x="700" y="126" width="520" height="68" rx="14"/>
    <circle class="dot" cx="742" cy="160" r="12"/>
    <circle class="fill" cx="742" cy="160" r="6"/>
    <text class="title" x="772" y="168">Child seat mount is loose</text>
    <rect class="chip" x="1128" y="144" width="72" height="32" rx="16"/>
    <text class="chip-text" x="1164" y="165" text-anchor="middle">Frame</text>
  </g>
  <g class="row waiting">
    <rect class="card" x="700" y="212" width="520" height="68" rx="14"/>
    <circle class="dot" cx="742" cy="246" r="12"/>
    <circle class="fill" cx="742" cy="246" r="6"/>
    <text class="title" x="772" y="254">Try a moss green powder coat</text>
    <rect class="chip" x="1128" y="230" width="72" height="32" rx="16"/>
    <text class="chip-text" x="1164" y="251" text-anchor="middle">Paint</text>
    <g transform="translate(1100 246)">
      <g class="bug">
        <g>
          <path class="bug-leg" d="M-8-4-16-8M-9 2-17 3M-8 8-15 13M8-4 16-8M9 2 17 3M8 8 15 13M-3-12-7-19M3-12 7-19"/>
        </g>
        <ellipse class="bug-body" cx="0" cy="2" rx="9" ry="12"/>
        <circle class="bug-head" cx="0" cy="-11" r="5.5"/>
        <circle class="bug-spot" cx="-3.5" cy="0" r="2.2"/>
        <circle class="bug-spot" cx="3.5" cy="0" r="2.2"/>
        <circle class="bug-spot" cx="0" cy="8" r="1.8"/>
      </g>
    </g>
    <g class="boo">
      <rect class="boo-bubble" x="1140" y="284" width="70" height="28" rx="14"/>
      <text class="boo-text" x="1175" y="304" text-anchor="middle">Boo!</text>
    </g>
  </g>
</svg>
