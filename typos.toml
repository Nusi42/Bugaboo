# Spelling (LINT-SPELL). Defaults of typos, except as noted.
[files]
# Generated by tools/docs-html/build.mjs ("GENERATED" comment): fix the Markdown source instead.
extend-exclude = [
  "docs/03-architecture.html",
  "docs/04-milestones.html",
  "crates/bb-auth/data/breached-passwords.txt",
  # German sentences for the full-text search on the large dataset (architecture section 11).
  "crates/bb-sample/data/large.toml",
]

[default.extend-words]
# Feature-ID group prefix THM (themes), e.g. THM-03: an ID, not a misspelling of "them".
THM = "THM"
# The ASCII spelling of the German umlaut u, in the table of handle letters (bb-core comment.rs).
ue = "ue"

[default.extend-identifiers]
# The crate name flate2 (docs/third-party/README.md), not a misspelling of "flat".
flate2 = "flate2"

# Short CSS class names of the design pages (docs/02-ux-design.html, docs/mockups, and the rules
# of design/theme.kdl that style them); only these files get these two words.
[type.html]
extend-glob = ["*.html", "theme.kdl", "ux-design.css"]

[type.html.extend-words]
nd = "nd"
pn = "pn"

# The `/fo` (format) switch of Windows' whoami.exe, written in the data folder code.
[type.rust.extend-words]
fo = "fo"
# The PDF filter `/FlateDecode` (zlib), written into the PDF that a test of previews builds.
Flate = "Flate"
