[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/bb-server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Zero warnings, zero errors: every lint below is a warning, and every check runs with
# warnings denied (`cargo xtask check`). Exceptions need a narrow `#[allow(.., reason = "..")]`
# that names an issue or a doc section (CLAUDE.md, META-SUPPRESS).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_crate_dependencies = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Not useful for an unpublished workspace (no crates.io metadata, internal crates share versions).
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# Restriction lints we want (coding-standards §3).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
