[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/bb-server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Zero warnings, zero errors: every lint below is a warning, and every check runs with
# warnings denied (`cargo xtask check`). Exceptions need a narrow `#[allow(.., reason = "..")]`
# that names an issue or a doc section (CLAUDE.md, META-SUPPRESS).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_crate_dependencies = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Not useful for an unpublished workspace (no crates.io metadata, internal crates share versions).
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# Restriction lints we want (coding-standards §3).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# Versions of dependencies used by more than one crate live here once; crates use
# `{ workspace = true }` and add only their own features (coding-standards §1).
[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
globset = "0.4.20"
jiff = { version = "0.2.37", default-features = false, features = ["serde", "std"] }
mime_guess = "2.0.5"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", default-features = false }
tempfile = "3.27.0"
tokio = "1.53.2"
toml = "1.1.6"
tower = "0.5.3"
tower-http = "0.7.1"
trybuild = "1.0.121"
uuid = { version = "1.27.0", default-features = false }
