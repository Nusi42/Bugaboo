# License, ban and advisory policy (architecture §1, DEP-LICENSES, SEC-ADVISORIES).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT-0",
  # Zero-clause BSD: as free as public domain. tslib, a helper of React Aria Components.
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "OFL-1.1",
  "MPL-2.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
