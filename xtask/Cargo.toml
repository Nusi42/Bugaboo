[package]
name = "xtask"
description = "The single runner for every check, generator and developer task (ADR-0014, ADR-0020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
bb-api-words = { path = "../crates/bb-api-words" }
bb-core = { path = "../crates/bb-core", features = ["zone-data"] }
bb-dev-words = { path = "../crates/bb-dev-words" }
bb-policy = { path = "../crates/bb-policy" }
bb-searchlang = { path = "../crates/bb-searchlang" }
brotli = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
flate2 = "1.1.10"
getrandom = { workspace = true }
globset = { workspace = true }
jiff = { workspace = true }
jsonschema = { version = "0.61.2", default-features = false }
kdl = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "derive"] }
tar.workspace = true
toml = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
