[package]
name = "xtask"
description = "The single runner for every check, generator and developer task (ADR-0014, ADR-0020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
bb-api-words = { path = "../crates/bb-api-words" }
bb-core = { path = "../crates/bb-core" }
bb-dev-words = { path = "../crates/bb-dev-words" }
bb-policy = { path = "../crates/bb-policy" }
brotli = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
flate2 = "1.1.10"
getrandom = { workspace = true }
globset = { workspace = true }
kdl = { workspace = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "derive"] }
tar = "0.4.46"
toml = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
